# Проверка приложения перед выпуском: те же тесты в двух движках — Chromium и WebKit (движок Safari на iPhone).
# Запускается, когда скрипт обновления присылает ветку ci/… с новой сборкой; скрипт ждёт итога
# и ставит новую версию, только если всё прошло. Можно запустить и вручную (Actions → Run workflow).
name: Проверка приложения
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить Playwright и браузер
        working-directory: ci
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Тесты
        working-directory: ci
        env:
          BROWSER: ${{ matrix.browser }}
        run: node run.mjs
      - name: Скриншоты и отчёты при провале
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.browser }}
          path: ci/out
          retention-days: 7
