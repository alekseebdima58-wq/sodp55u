name: Проверка личного кабинета
on:
  push:
    branches: [feature/student-cabinet, main]
    paths: ['cabinet-server/**', 'cabinet.js', 'cabinet.css', 'cabinet-config.json', 'index.html', 'sw.js', '.github/workflows/cabinet-tests.yml']
  pull_request:
    paths: ['cabinet-server/**', 'cabinet.js', 'cabinet.css', 'cabinet-config.json', 'index.html', 'sw.js', '.github/workflows/cabinet-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cabinet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: cabinet-server
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          CABINET_MOCKUP_DIR: mockup
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-mockup
          path: cabinet-server/mockup/*.png
          if-no-files-found: error
          retention-days: 14
