.schart svg { display: block; width: 100%; height: 132px; overflow: visible; touch-action: pan-y; margin-top: 6px; }
.schart .sbar { fill: color-mix(in srgb, var(--accent) 38%, transparent); transition: fill .15s; }
.schart .sbar.on { fill: var(--accent); }
.schart .shit { fill: transparent; cursor: pointer; }
.schart .sbase { stroke: var(--sep); stroke-width: 1; }
.schart .savg { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .8; }
.schart .sval { fill: var(--text2); font-size: 11px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
.saxis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.saxis.wd span { flex: 1; text-align: center; font-weight: 600; }
.saxis.wd span.on { color: var(--text); }
.savgl { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: calc(12px * var(--fs, 1)); color: var(--muted); }
.savgl i { width: 16px; border-top: 1.5px dashed var(--muted); }
.sstack { display: flex; gap: 2px; height: 12px; border-radius: 8px; overflow: hidden; background: var(--surface2); }
.sstack i { display: block; height: 100%; min-width: 4px; }
.sleg { display: flex; flex-direction: column; margin-top: 4px; }
.sleg > div { display: grid; grid-template-columns: 10px 1fr auto 44px; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); font-size: calc(15px * var(--fs, 1)); }
.sleg > div:first-child { border-top: 0; }
.sleg .dot { width: 10px; height: 10px; border-radius: 3px; }
.sleg .nm { font-weight: 600; min-width: 0; }
.sleg b { font-variant-numeric: tabular-nums; }
.sleg .pc { text-align: right; color: var(--muted); font-size: calc(13px * var(--fs, 1)); font-variant-numeric: tabular-nums; }
.c1 { background: #2a78d6; } .c2 { background: #eb6834; } .c3 { background: #1baf7a; }
html[data-theme="dark"] .c1 { background: #3987e5; } html[data-theme="dark"] .c2 { background: #d95926; } html[data-theme="dark"] .c3 { background: #199e70; }
.skv > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; font-size: calc(15px * var(--fs, 1)); border-top: 1px solid var(--sep); }
.skv > div:first-child { border-top: 0; }
.skv span { color: var(--text2); min-width: 0; }
.skv b { font-variant-numeric: tabular-nums; text-align: right; }
.skv small { grid-column: 1 / -1; font-size: calc(12px * var(--fs, 1)); color: var(--muted); margin-top: -2px; }
.skv .pbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.skv .pbar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sgrid > div { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--hair); min-width: 0; }
.sgrid .tx { display: flex; flex-direction: column; min-width: 0; }
.sgrid b { font-size: calc(20px * var(--fs, 1)); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--text); }
.sgrid .sic { background: var(--surface2); color: var(--text2); }
.sgrid .tx > span { font-size: calc(12px * var(--fs, 1)); color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snote { margin: 8px 4px 0; font-size: calc(13px * var(--fs, 1)); color: var(--muted); }
.sic-gray { background: linear-gradient(180deg, #A3AAB6, #737B89); }
.sic-tg { background: linear-gradient(180deg, #37BBFE, #229ED9); }
.sic-green { background: linear-gradient(180deg, #4ADE80, #16A34A); }
.dg-hero { padding: 14px 16px 12px; border-radius: 22px; border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--elev); }
.dg-head .sic, .dg-chips .sic, .dg-row .sic { background: var(--surface2); color: var(--text2); }
.dg-head .sic-red, .dg-chips .on .sic-red, .dg-row .sic-red { color: var(--red-fg); }
.dg-head .sic-green { color: var(--tag-fg); }
.dg-chips .on.err b { color: var(--red-fg); }
.dg-head { display: flex; align-items: center; gap: 12px; }
.dg-head .sic { width: 40px; height: 40px; border-radius: 14px; }
.dg-head .sic svg { width: 22px; height: 22px; }
.dg-ht { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dg-ht b { font-size: calc(20px * var(--fs, 1)); font-weight: 800; letter-spacing: -.01em; }
.dg-ht span { font-size: calc(13px * var(--fs, 1)); color: var(--text2); }
.dg-spark { display: block; width: 100%; height: 40px; margin-top: 14px; }
.dg-spark .de { fill: var(--red-fg); } .dg-spark .dj { fill: var(--faint); } .dg-spark .dz { fill: var(--sep); }
.dg-axis { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.dg-leg { display: inline-flex; align-items: center; gap: 5px; }
.dg-leg i { width: 8px; height: 8px; border-radius: 2px; margin-left: 4px; } .dg-leg i.de { background: var(--red-fg); } .dg-leg i.dj { background: var(--faint); }
.dg-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.dg-chips > div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 9px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--hair); min-width: 0; }

.schips span b { color: var(--muted); font-weight: 600; margin-left: 4px; }
/* сбой из прошлых версий: в текущей не повторялся — приглушён, с зелёной пометкой */
.dg-row.old > .sic, .dg-row.old .dg-k, .dg-row.old .dg-m, .dg-row.old .dg-cnt { opacity: .5; }
.dg-pills i.ok { background: var(--tag-bg); color: var(--tag-fg); }

/* ================= Ещё больше iOS 26 =================
   1. «Линза» выбранной вкладки — отдельный кусок стекла, который переезжает между вкладками
      с пружиной и чуть растягивается в пути (как капля), а не перескакивает.
   2. Крупный заголовок экрана при прокрутке уходит под стеклянную плашку сверху,
      а в ней появляется маленький заголовок по центру (и кнопка «назад», если она есть).
   3. Переключатель темы — ползунок из стекла едет к выбранному варианту.
   4. Кнопка «Удалить» при свайпе — круг, который тянется в таблетку (как в «Сообщениях»).
   5. Поиск — капсула. */

/* 1. линза нижней панели */
.tabs .in { position: relative; }
.tab { position: relative; z-index: 1; }
.tab.on, html[data-theme="light"] .tab.on { background: transparent; box-shadow: none; }
.tabs .lens {
  position: absolute; z-index: 0; top: 0; bottom: 0; left: 0; width: calc(100% / 3); border-radius: 30px; pointer-events: none;
  background: rgba(255, 255, 255, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 0 1px rgba(255, 255, 255, .06);
  transform: translate3d(calc(var(--ti, 0) * 100%), 0, 0);
  transition: transform .5s var(--ease-spring, cubic-bezier(.3, 1.3, .5, 1));
}
html[data-theme="light"] .tabs .lens { background: rgba(255, 255, 255, .85); box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 8px rgba(20, 30, 60, .12); }
.tabs .lens.mv { animation: lensMv .5s cubic-bezier(.3, .7, .4, 1); }
@keyframes lensMv { 0% { scale: 1 1; } 35% { scale: 1.16 .9; } 100% { scale: 1 1; } }
@supports (corner-shape: squircle) { .tabs .lens { border-radius: 34px; } }

/* 2. стеклянная плашка с маленьким заголовком */
.navbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 11; height: calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 46px);
  padding-top: calc(var(--safe-top, 0px) + var(--top-gap, 0px)); display: flex; align-items: center; justify-content: center;
  background: rgba(8, 9, 11, .78);
  -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .07);
  opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility 0s .22s;
}
html[data-theme="light"] .navbar { background: rgba(250, 250, 252, .82); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .07); }
/* под плашкой — мягкое затухание, как у iOS 26: край без резкой черты */
.navbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 18px; pointer-events: none;
  background: linear-gradient(rgba(8, 9, 11, .55), rgba(8, 9, 11, 0)); }
html[data-theme="light"] .navbar::after { background: linear-gradient(rgba(250, 250, 252, .6), rgba(250, 250, 252, 0)); }
html.nb-on .navbar { opacity: 1; visibility: visible; transition: opacity .22s ease; }
.nb-title {
  max-width: calc(100% - 140px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 17px; font-weight: 600; color: var(--text); transform: translate3d(0, 8px, 0); opacity: 0;
  transition: transform .35s var(--ease-spring, ease), opacity .2s ease;
}
html.nb-on .nb-title { transform: none; opacity: 1; }
.nb-back {
  position: absolute; left: 14px; bottom: 4px; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0;
  display: none; align-items: center; justify-content: center; color: var(--text);
  background: rgba(255, 255, 255, .1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
}
html[data-theme="light"] .nb-back { background: rgba(255, 255, 255, .9); box-shadow: inset 0 1px 0 #FFF, 0 1px 4px rgba(0, 0, 0, .1); }
html.nb-back-on .nb-back { display: flex; }
.nb-back:active { transform: scale(.9); }
/* крупный заголовок плавно гаснет, уходя под плашку */
#app > .top h1 { transition: opacity .2s ease; }
html.nb-on #app > .top h1, html.nb-on #app > .top .eyebrow { opacity: 0; }

/* 3. ползунок переключателя темы */
.seg3 { position: relative; }
.seg3 button { position: relative; z-index: 1; }
.seg3 button.on, html[data-theme="light"] .seg3 button.on { background: transparent; border-color: transparent; box-shadow: none; }
.seg3 .thumb {
  position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 18px; pointer-events: none;
  background: var(--surface2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 0 0 1px var(--border);
}
.seg3 .thumb.go { transition: transform .45s var(--ease-spring, ease), translate .45s var(--ease-spring, ease); }
html[data-theme="light"] .seg3 .thumb { background: #FFFFFF; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.seg3 .thumb.mv { animation: lensMv .45s cubic-bezier(.3, .7, .4, 1); }

/* 4. круглая кнопка «Удалить» (размеры — в NC_* в 14-notif-swipe.js) */
.nc-del { top: calc(50% - 28px); bottom: auto; height: 56px; border-radius: 30px; gap: 0; }
.nc-del span { display: none; }
.nc-del svg { width: 24px; height: 24px; }
.ncw.armed > .nc-del { padding-left: 16px; }
@supports (corner-shape: squircle) { .nc-del { corner-shape: round; } }

/* 5. поиск — капсула */
.search { border-radius: 26px; }

/* ================= Размер текста и знакомство при первом запуске ================= */

/* --- ползунок «Размер текста» (как в настройках iPhone: маленькая А — большая А) --- */
.tsz .srow { padding: 12px 0 4px; border: 0; background: transparent; }
.tsz-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px 4px; transition: opacity .2s; }
.tsz-row.off { opacity: .4; }
.tsz-row .a1 { font-size: 13px; font-weight: 600; color: var(--muted); }
.tsz-row .a2 { font-size: 22px; font-weight: 600; color: var(--muted); }
.tsz-row input[type=range] { flex: 1; min-width: 0; height: 32px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: pan-y; }
.tsz-row input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent) var(--pct, 50%), var(--strong) var(--pct, 50%));
}
.tsz-row input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--strong); }
.tsz-row input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.tsz-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 2px 8px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .1);
}
.tsz-row input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #FFF; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.tsz-row input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }
.tsz-demo { margin: 4px 2px 2px; font-size: calc(15px * var(--fs, 1)); line-height: calc(20px * var(--fs, 1)); color: var(--text2); }

/* --- знакомство: на весь экран, листается по страницам --- */
html.onb-open, html.onb-open body { overflow: hidden; }
.onb {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + var(--safe-top, 0px) + 12px) 0 calc(max(env(safe-area-inset-bottom), var(--safe-bottom, 0px)) + 18px);
  background: var(--bg); opacity: 0; transform: scale(1.03);
  transition: opacity .32s ease, transform .45s var(--ease-spring, ease);
}
.onb.in { opacity: 1; transform: none; }
.onb.out { opacity: 0; transform: scale(.97); transition-duration: .28s; pointer-events: none; }
.onb-skip { align-self: flex-end; margin: 0 16px 0 0; padding: 8px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: calc(15px * var(--fs, 1)); font-weight: 600; }
.onb-pages { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.onb-pages::-webkit-scrollbar { display: none; }
.onb-p { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 28px; text-align: center; max-width: 100%; box-sizing: border-box; }
.onb-p h2 { margin: 26px 0 10px; font-size: calc(28px * var(--fs, 1)); line-height: calc(34px * var(--fs, 1)); font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.onb-p p { margin: 0 auto; max-width: 340px; font-size: calc(16px * var(--fs, 1)); line-height: calc(23px * var(--fs, 1)); color: var(--text2); }
.onb-link { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--acc-soft); color: var(--accent); font: inherit; font-size: calc(15px * var(--fs, 1)); font-weight: 600; }
.onb-dots { display: flex; justify-content: center; gap: 8px; margin: 10px 0 16px; }
.onb-dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--strong); transition: width .3s var(--ease-spring, ease), background .3s; }
.onb-dots i.on { width: 22px; background: var(--accent); }
.onb-next { margin: 0 24px; height: 54px; border: 0; border-radius: 26px; background: var(--accent); color: var(--on-accent); font: inherit; font-size: calc(17px * var(--fs, 1)); font-weight: 700;
  box-shadow: 0 8px 24px rgba(var(--acc-rgb), .35); }
.onb-next:active, .onb-link:active, .onb-skip:active { transform: scale(.96); }

/* картинки-демо: размеры фиксированные (в «Размер текста» не растут) */
.onb-art { position: relative; width: 300px; height: 220px; max-width: 100%; border-radius: 30px; overflow: hidden;
  background: radial-gradient(120% 90% at 30% 0%, rgba(var(--acc-rgb), .22), transparent 60%), var(--surface);
  box-shadow: inset 0 0 0 1px var(--hair); }
.onb-p:not(.cur) .onb-art * { animation-play-state: paused !important; }

/* 1: дни и карточки едут, палец ведёт */
.a1 .o-days { position: absolute; left: 16px; right: 16px; top: 16px; display: grid; grid-template-columns: repeat(5, 1fr); height: 34px; border-radius: 18px; background: var(--surface2); }
.a1 .o-d { position: relative; z-index: 1; display: grid; place-items: center; font-size: calc(12px * var(--fs, 1)); font-weight: 700; color: var(--muted); }
.a1 .o-pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(20% - 6px); border-radius: 14px; background: var(--accent); animation: oPill 4.8s var(--ease-spring, ease) infinite; }
.a1 .o-d.on { color: var(--on-accent); animation: oDayOn 4.8s infinite; }
.a1 .o-view { position: absolute; left: 0; right: 0; top: 66px; height: 120px; overflow: hidden; }
.a1 .o-track { display: flex; width: 300%; height: 100%; animation: oTrack 4.8s var(--ease-spring, ease) infinite; }
.a1 .o-card { flex: 0 0 calc(100% / 3); box-sizing: border-box; margin: 0; padding: 14px 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  border-left: 4px solid var(--lab-bar); background-clip: content-box; }
.a1 .o-card > * { margin-left: 16px; }
.a1 .o-card.lab { border-color: var(--lab-bar); } .a1 .o-card.prac { border-color: var(--prac-bar); } .a1 .o-card.lec { border-color: var(--lec-bar); }
.a1 .o-card { border-left: 0; position: relative; }
.a1 .o-card::before { content: ""; position: absolute; left: 22px; top: 16px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--lab-bar); }
.a1 .o-card.prac::before { background: var(--prac-bar); } .a1 .o-card.lec::before { background: var(--lec-bar); }
.a1 .o-card > * { margin-left: 22px; }
.a1 .o-card b { font-size: calc(17px * var(--fs, 1)); color: var(--text); }
.a1 .o-card span { font-size: calc(15px * var(--fs, 1)); font-weight: 600; color: var(--text); }
.a1 .o-card small { font-size: calc(12px * var(--fs, 1)); color: var(--muted); }
.a1 .o-finger { position: absolute; top: 120px; left: 220px; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255, 255, 255, .35); box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); animation: oFinger 4.8s ease-in-out infinite; }
html[data-theme="light"] .a1 .o-finger { background: rgba(0, 0, 0, .14); box-shadow: 0 0 0 2px rgba(0, 0, 0, .18); }
@keyframes oTrack { 0%, 18% { transform: translate3d(0, 0, 0); } 30%, 52% { transform: translate3d(-33.333%, 0, 0); } 64%, 86% { transform: translate3d(-66.666%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
@keyframes oPill { 0%, 18% { transform: translate3d(0, 0, 0); } 30%, 52% { transform: translate3d(calc(100% + 6px), 0, 0); } 64%, 86% { transform: translate3d(calc(200% + 12px), 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
@keyframes oDayOn { 0%, 100% { color: var(--on-accent); } }
@keyframes oFinger { 0%, 8% { opacity: 0; transform: translate3d(0, 0, 0) scale(.8); } 12% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  28% { opacity: 1; transform: translate3d(-140px, 0, 0); } 33% { opacity: 0; transform: translate3d(-150px, 0, 0); }
  42% { opacity: 0; transform: translate3d(0, 0, 0) scale(.8); } 46% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  62% { opacity: 1; transform: translate3d(-140px, 0, 0); } 67%, 100% { opacity: 0; transform: translate3d(-150px, 0, 0); } }

/* 2: уведомления опускаются сверху стеклом */
.a2 { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; box-sizing: border-box; }
.a2 .o-note { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 22px; text-align: left;
  background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 8px 20px rgba(0, 0, 0, .25);
  animation: oDrop 4.4s var(--ease-spring, ease) infinite; }
html[data-theme="light"] .a2 .o-note { background: rgba(255, 255, 255, .9); box-shadow: 0 6px 18px rgba(20, 30, 60, .12); }
.a2 .o-note.o2 { animation-delay: .35s; }
.a2 .o-note img { width: 38px; height: 38px; border-radius: 8px; flex: none; }
.a2 .o-note div { display: flex; flex-direction: column; min-width: 0; }
.a2 .o-note b { font-size: calc(12px * var(--fs, 1)); font-weight: 600; color: var(--muted); }
.a2 .o-note span { font-size: calc(14px * var(--fs, 1)); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a2 .o-note small { font-size: calc(13px * var(--fs, 1)); color: var(--text2); }
@keyframes oDrop { 0% { opacity: 0; transform: translate3d(0, -40px, 0) scale(.96); } 12%, 82% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: translate3d(0, -10px, 0) scale(.98); } }

/* 3: иконка приложения прыгает на свободное место экрана «Домой» */
.a3 .o-home { position: absolute; inset: 22px 30px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; gap: 14px 16px; }
.a3 .o-app { border-radius: 14px; background: var(--surface2); }
.a3 .o-app.c0 { background: linear-gradient(160deg, #34C759, #248A3D); } .a3 .o-app.c1 { background: linear-gradient(160deg, #5AC8FA, #007AFF); }
.a3 .o-app.c2 { background: linear-gradient(160deg, #FF9F0A, #FF6B00); } .a3 .o-app.c3 { background: linear-gradient(160deg, #8E8E93, #48484A); }
.a3 .o-app.c4 { background: linear-gradient(160deg, #FF375F, #D70040); } .a3 .o-app.c5 { background: linear-gradient(160deg, #BF5AF2, #8944AB); }
.a3 .o-me { width: 52px; height: 52px; border-radius: 14px; justify-self: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); animation: oPop 3.2s var(--ease-spring, ease) infinite; }
@keyframes oPop { 0%, 10% { opacity: 0; transform: translate3d(0, -60px, 0) scale(.4); } 30%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(.9); } }

/* 3 (уже ярлык): жесты */
.a3g { display: flex; align-items: center; justify-content: space-around; padding: 0 12px; }
.a3g .o-g { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: calc(14px * var(--fs, 1)); font-weight: 600; color: var(--text2); }
.a3g .o-arrow { width: 64px; height: 64px; border-radius: 50%; background: var(--acc-soft); position: relative; }
.a3g .o-arrow::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -12px 0 0 -8px; border: solid var(--accent); border-width: 0 4px 4px 0; transform: rotate(45deg); }
.a3g .o-arrow.right::after { margin: -8px 0 0 -12px; transform: rotate(-45deg); }
.a3g .o-arrow.down { animation: oNudgeY 1.6s ease-in-out infinite; }
.a3g .o-arrow.right { animation: oNudgeX 1.6s ease-in-out infinite .4s; }
@keyframes oNudgeY { 0%, 100% { transform: none; } 50% { transform: translate3d(0, 10px, 0); } }
@keyframes oNudgeX { 0%, 100% { transform: none; } 50% { transform: translate3d(10px, 0, 0); } }

@media (prefers-reduced-motion: reduce) { .onb-art * { animation: none !important; } }
@media (max-height: 640px) { .onb-art { height: 170px; } .onb-p h2 { margin-top: 16px; font-size: calc(24px * var(--fs, 1)); } .onb-p p { font-size: calc(15px * var(--fs, 1)); line-height: calc(21px * var(--fs, 1)); } }
.onb-next:focus { outline: none; } .onb-next:focus-visible { box-shadow: 0 0 0 3px rgba(var(--acc-rgb), .4), 0 8px 24px rgba(var(--acc-rgb), .35); }
/* карточка-демо: подпись вида пары и внутренняя обёртка (в обычном оформлении — просто текст справа от полоски) */
.a1 .o-in { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.a1 .o-in b { display: flex; align-items: center; gap: 8px; }
.a1 .o-in em { font-style: normal; font-size: calc(12px * var(--fs, 1)); font-weight: 700; padding: 2px 7px; border-radius: 8px; color: var(--muted); background: var(--surface2); }
.a1 .o-in span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
/* ---------- оформление «Стекло»: цветной фон, полупрозрачные карточки с бликом ---------- */
/* включается классом html.glass — остальная тема (цвета пар, жесты, размеры) не меняется */
html.glass[data-theme="dark"] {
  --bg: #000000; --surface: rgba(255, 255, 255, .07); --surface2: rgba(255, 255, 255, .11);
  --hair: rgba(255, 255, 255, .13);
  --g-a: #1E3A8A; --g-b: #3B1E5E; --g-c: #0B3B4A; --g-op: .55;
  --g-card: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
  --g-edge: inset 0 1px 0 rgba(255, 255, 255, .30), inset 0 0 0 1px rgba(255, 255, 255, .09);
  --g-drop: 0 10px 24px rgba(0, 0, 0, .4);
  --g-bar: rgba(0, 0, 0, .9);
}
html.glass[data-theme="light"] {
  --bg: #FFFFFF; --surface: rgba(255, 255, 255, .6); --surface2: rgba(255, 255, 255, .75);
  --hair: rgba(255, 255, 255, .7);
  --g-a: #DCE6FF; --g-b: #EFE3FF; --g-c: #D9F2F7; --g-op: .8;
  --g-card: linear-gradient(160deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .55));
  --g-edge: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(20, 30, 60, .06);
  --g-drop: 0 8px 22px rgba(40, 50, 110, .10);
  --g-bar: rgba(255, 255, 255, .92);
}

/* фон: чёрный (белый) с еле заметными цветными отсветами по краям; стоит на месте при прокрутке */
html.glass { background: var(--bg); }
html.glass body { background: transparent; }
html.glass body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 40% at 12% 8%, var(--g-a) 0%, transparent 70%),
    radial-gradient(55% 35% at 100% 38%, var(--g-b) 0%, transparent 70%),
    radial-gradient(70% 45% at 25% 100%, var(--g-c) 0%, transparent 70%);
  opacity: var(--g-op);
}

/* шапка недели: матовое стекло — фон и карточки под ней размываются */
html.glass .sbar { background: transparent; isolation: isolate; }
/* размытие — на отдельном слое под содержимым шапки: так оно не конфликтует со стеклянными кнопками внутри */
html.glass .sbar::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--g-bar);
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6); }
html.glass .sbar.stuck { box-shadow: inset 0 -1px 0 var(--hair); }

/* стеклянные поверхности */
html.glass :is(.days, .card, .cc, .tcard, .wbtn, .icon-btn, .offline) {
  background: var(--g-card); border-color: transparent; box-shadow: var(--g-edge), var(--g-drop);
}
html.glass .row.past :is(.cc, .card) { background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
html.glass[data-theme="light"] .row.past :is(.cc, .card) { background: #F3F4F7; box-shadow: inset 0 0 0 1px rgba(20, 30, 60, .05); }
html.glass .offline.stale { background: linear-gradient(160deg, rgba(255, 181, 71, .28), rgba(255, 181, 71, .10)); }

/* выбранный день — стеклянная линза, как у вкладок внизу: светлый блик сверху, тонкая кромка, фон чуть просвечивает */
html.glass .days .pill {
  background: linear-gradient(180deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .10) 55%, rgba(255, 255, 255, .16));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 -6px 14px rgba(255, 255, 255, .06), 0 8px 20px rgba(0, 0, 0, .45);
  -webkit-backdrop-filter: blur(8px) saturate(1.8); backdrop-filter: blur(8px) saturate(1.8);
}
html.glass .days-on-in { color: #FFFFFF; }
html.glass .days-on .dots i { background: #FFFFFF; }
html.glass[data-theme="light"] .days .pill {
  background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .72));
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(20, 30, 60, .07), 0 6px 16px rgba(20, 30, 60, .16);
}
html.glass[data-theme="light"] .days-on-in { color: #0A6CFF; }
html.glass[data-theme="light"] .days-on .dots i { background: #0A6CFF; }

/* «Сейчас»: стекло с подсветкой цветом пары */
html.glass .hero {
  background: linear-gradient(160deg, rgba(var(--k-rgb), .34), rgba(255, 255, 255, .06) 70%);
  border-color: transparent; box-shadow: var(--g-edge), 0 22px 44px -18px rgba(var(--k-rgb), .7);
}
html.glass[data-theme="light"] .hero { background: linear-gradient(160deg, rgba(var(--k-rgb), .30), rgba(255, 255, 255, .62) 70%); }
html.glass .row.live .cc, html.glass .row.live .card { background: linear-gradient(160deg, rgba(var(--k-rgb), .26), rgba(255, 255, 255, .06)); }

/* панель вкладок: прозрачнее, чтобы фон просвечивал */
html.glass .tabs { background: rgba(255, 255, 255, .14); }
html.glass[data-theme="light"] .tabs { background: rgba(255, 255, 255, .5); }
html.glass[data-theme="dark"] .tab.on { color: #FFFFFF; }

/* v2.1: тени-свечения карточек короче (размытие 30–34 → 16–20 точек): на дне до 36 карточек, и каждая перерисовка
   ленты считала столько больших размытых теней; на вид почти то же */
/* карточки пар — цветное стекло под вид занятия: лекция зелёная, практика янтарная, лаба фиолетовая.
   Размеры отсвета — в точках, а не в процентах: у свёрнутой и раскрытой карточки он одинаковый,
   поэтому в начале и в конце раскрытия цвет карточки не «перескакивает» */
html.glass .row:not(.past) :is(.card, .cc) {
  background:
    radial-gradient(360px 110px at 0 0, rgba(var(--k-rgb), .30), rgba(var(--k-rgb), 0) 60%),
    linear-gradient(160deg, rgba(var(--k-rgb), .16), rgba(255, 255, 255, .04) 130px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .30), inset 0 0 0 1px rgba(var(--k-rgb), .32), 0 10px 18px -10px rgba(var(--k-rgb), .55);
}
html.glass .row.live :is(.card, .cc) {
  background:
    radial-gradient(360px 110px at 0 0, rgba(var(--k-rgb), .42), rgba(var(--k-rgb), 0) 65%),
    linear-gradient(160deg, rgba(var(--k-rgb), .24), rgba(255, 255, 255, .05) 130px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), inset 0 0 0 1px rgba(var(--k-rgb), .5), 0 12px 20px -9px rgba(var(--k-rgb), .7);
}
html.glass[data-theme="light"] .row:not(.past) :is(.card, .cc) {
  background:
    radial-gradient(360px 110px at 0 0, rgba(var(--k-rgb), .22), rgba(var(--k-rgb), 0) 60%),
    linear-gradient(160deg, rgba(255, 255, 255, .80), rgba(var(--k-rgb), .10) 130px);
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(var(--k-rgb), .28), 0 9px 16px -10px rgba(var(--k-rgb), .45);
}
html.glass[data-theme="light"] .row.live :is(.card, .cc) {
  background:
    radial-gradient(360px 110px at 0 0, rgba(var(--k-rgb), .32), rgba(var(--k-rgb), 0) 65%),
    linear-gradient(160deg, rgba(255, 255, 255, .78), rgba(var(--k-rgb), .16) 130px);
}

/* ---------- знакомство при первом запуске — в том же стекле ---------- */
html.glass .onb { background: var(--bg); }
html.glass[data-theme="dark"] .onb { --o-btn: #FFFFFF; --o-btn-fg: #000000; --o-ink: #FFFFFF; }
html.glass[data-theme="light"] .onb { --o-btn: #111522; --o-btn-fg: #FFFFFF; --o-ink: #111522; }
/* у каждой страницы своё цветное свечение за картинкой: янтарь, синий, фиолетовый — уезжает вместе со страницей */
html.glass .onb-p { position: relative; }
html.glass .onb-p::before { content: ""; position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -330px 0 0 -210px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--o-rgb), .38), rgba(var(--o-rgb), 0)); z-index: 0; }
html.glass[data-theme="light"] .onb-p::before { background: radial-gradient(closest-side, rgba(var(--o-rgb), .22), rgba(var(--o-rgb), 0)); }
html.glass .onb-p > * { position: relative; z-index: 1; }
html.glass .onb-art {
  border-radius: 34px;
  background: radial-gradient(120% 90% at 20% 0%, rgba(var(--o-rgb), .30), rgba(var(--o-rgb), 0) 62%), linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 0 0 1px rgba(255, 255, 255, .10), 0 30px 60px -24px rgba(var(--o-rgb), .65);
}
html.glass[data-theme="light"] .onb-art {
  background: radial-gradient(120% 90% at 20% 0%, rgba(var(--o-rgb), .22), rgba(var(--o-rgb), 0) 62%), linear-gradient(160deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .7));
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(20, 30, 60, .06), 0 26px 50px -24px rgba(var(--o-rgb), .55);
}
html.glass .onb-p h2 { color: var(--o-ink); }
html.glass .onb-skip { background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); color: var(--text2); }
html.glass[data-theme="light"] .onb-skip { background: rgba(20, 30, 60, .05); box-shadow: none; }
html.glass .onb-link { color: var(--o-ink); background: linear-gradient(160deg, rgba(var(--o-rgb), .30), rgba(var(--o-rgb), .12));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 0 0 1px rgba(var(--o-rgb), .45); }
html.glass .onb-dots i { background: rgba(127, 127, 127, .35); }
html.glass .onb-dots i.on { background: var(--o-ink); }
html.glass .onb-next { background: var(--o-btn); color: var(--o-btn-fg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 10px 30px rgba(127, 127, 127, .25); }

/* 1: строка дней — стекло с белой каплей; карточки пар — цветное стекло по виду */
html.glass .a1 { --on-accent: var(--o-btn-fg); }
html.glass .a1 .o-days { background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
html.glass[data-theme="light"] .a1 .o-days { background: rgba(20, 30, 60, .05); box-shadow: none; }
html.glass .a1 .o-pill { background: var(--o-btn); box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
html.glass .a1 .o-view { top: 62px; height: 140px; }
html.glass .a1 .o-card { padding: 0 16px; align-items: stretch; }
html.glass .a1 .o-card::before { display: none; }
html.glass .a1 .o-card > * { margin-left: 0; }
html.glass .a1 .o-card.lab { --k-rgb: var(--lab-rgb); --k-fg: var(--lab-fg); } html.glass .a1 .o-card.prac { --k-rgb: var(--prac-rgb); --k-fg: var(--prac-fg); }
html.glass .a1 .o-card.lec { --k-rgb: var(--lec-rgb); --k-fg: var(--lec-fg); }
html.glass .a1 .o-in { height: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 22px; justify-content: center;
  background: radial-gradient(120% 140% at 0% 0%, rgba(var(--k-rgb), .38), rgba(var(--k-rgb), 0) 62%), linear-gradient(160deg, rgba(var(--k-rgb), .18), rgba(255, 255, 255, .04));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 0 0 1px rgba(var(--k-rgb), .45); }
html.glass[data-theme="light"] .a1 .o-in { background: radial-gradient(120% 140% at 0% 0%, rgba(var(--k-rgb), .26), rgba(var(--k-rgb), 0) 62%), linear-gradient(160deg, rgba(255, 255, 255, .9), rgba(var(--k-rgb), .10));
  box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(var(--k-rgb), .35); }
html.glass .a1 .o-in em { color: var(--k-fg); background: rgba(var(--k-rgb), .18); }

/* 2: уведомления — как на экране блокировки, со свечением */
html.glass .a2 .o-note { background: linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .06));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 0 0 1px rgba(255, 255, 255, .08), 0 12px 26px -10px rgba(var(--o-rgb), .55); }
html.glass[data-theme="light"] .a2 .o-note { background: rgba(255, 255, 255, .92); box-shadow: inset 0 0 0 1px rgba(20, 30, 60, .05), 0 12px 26px -12px rgba(var(--o-rgb), .5); }
html.glass .a2 .o-note img { box-shadow: 0 4px 12px rgba(var(--o-rgb), .45); }

/* 3: экран «Домой» — иконки с бликом, наша светится */
html.glass .a3 .o-app { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
html.glass .a3 .o-me { box-shadow: 0 0 0 2px rgba(255, 255, 255, .8), 0 8px 26px rgba(var(--o-rgb), .8); }
html.glass .a3g .o-arrow { background: rgba(var(--o-rgb), .2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 0 0 1px rgba(var(--o-rgb), .45); }
html.glass .a3g .o-arrow::after { border-color: var(--o-ink); }

/* плашка «Установи на главный экран» — тоже стекло */
html.glass .ibar { background: rgba(28, 30, 38, .82); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .08), 0 16px 36px rgba(0, 0, 0, .45); }
html.glass[data-theme="light"] .ibar { background: rgba(255, 255, 255, .9); box-shadow: inset 0 0 0 1px rgba(20, 30, 60, .06), 0 14px 30px rgba(40, 50, 110, .14); }

/* шторка под часами (установленное приложение, полный экран) — на 8px ниже: закрывает щель между ней и шапкой недели.
   В щели цветная тень фона просвечивала без затемнения и выглядела синей полоской */
html.glass .topveil { height: calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 8px); }

/* блик на линзе дня: вместо «капли» над подписью — мягкий отсвет по всей верхней половине, как на стекле */
html.glass .days .pill::after { left: 1px; right: 1px; top: 1px; height: 48%; border-radius: 18px 18px 40% 40% / 18px 18px 12px 12px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, 0)); }
html.glass[data-theme="light"] .days .pill::after { background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); }

/* цветная тень фона плавно проявляется ниже шторки под часами: на её нижнем краю не должно быть ступеньки
   «чёрное → цветное» (ни полоски, ни чёрной плашки сверху) */
html.glass body::before {
  -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 8px), #000 calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 160px));
  mask-image: linear-gradient(180deg, transparent 0, transparent calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 8px), #000 calc(var(--safe-top, 0px) + var(--top-gap, 0px) + 160px));
}

/* шапка недели без резкой нижней границы: затемнение мягко сходит на нет к низу (и чуть ниже шапки),
   а само стекло светлее — на телефоне под ним размытие, текст ленты всё равно не читается */
html.glass[data-theme="dark"] { --g-bar: rgba(0, 0, 0, .72); }
html.glass[data-theme="light"] { --g-bar: rgba(255, 255, 255, .78); }
html.glass .sbar::before { bottom: -14px;
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 30px), transparent);
  mask-image: linear-gradient(180deg, #000 calc(100% - 30px), transparent); }
html.glass .sbar.stuck { box-shadow: none; }

/* ---------- фон-тень для слоёв, которые должны его повторять (иначе на них он пропадает рывком) ---------- */
/* те же три пятна, что у body::before, — уже с прозрачностью (--g-op) и с тем же плавным проявлением под часами */
html.glass {
  --g-veil: calc(var(--safe-top, 0px) + var(--top-gap, 0px));
  --g-img:
    linear-gradient(180deg, var(--bg) calc(var(--g-veil) + 8px), transparent calc(var(--g-veil) + 160px)),
    radial-gradient(60% 40% at 12% 8%, color-mix(in srgb, var(--g-a) calc(var(--g-op) * 100%), transparent) 0%, transparent 70%),
    radial-gradient(55% 35% at 100% 38%, color-mix(in srgb, var(--g-b) calc(var(--g-op) * 100%), transparent) 0%, transparent 70%),
    radial-gradient(70% 45% at 25% 100%, color-mix(in srgb, var(--g-c) calc(var(--g-op) * 100%), transparent) 0%, transparent 70%);
}
/* жест «назад»: прошлый экран под пальцем и уезжающий экран — на том же фоне, без «вспышки» в чёрное */
html.glass .under, html.glass #appbg { background: var(--g-img), var(--bg); }
/* заставка при запуске — сразу на фоне приложения, без смены чёрного на цветной */
html.glass #splash { background: var(--g-img), var(--bg); }
/* v2.1: фон готовой картинкой (рисует paintBackdrop в js/08-theme.js) — растягивается на весь экран,
   перерисовка такого слоя почти бесплатная (три градиента с маской на весь экран — дорого) */
html.glass.gpic body::before { background: var(--g-img) 0 0 / 100% 100% no-repeat; opacity: 1; -webkit-mask-image: none; mask-image: none; }
html.glass.gpic :is(.under, #appbg, #splash) { background: var(--g-img) 0 0 / 100% 100% no-repeat, var(--bg); }
/* v2.1.4: шапка под часами — тот же фон, что и под ней (раньше — сплошная чёрная полоса) */
html.glass.gpic .topveil { background: var(--g-img) 0 0 / 100% var(--bd-h, 100vh) no-repeat, var(--bg); }
/* v2.1.13: у шапки снизу была тёмная растушёвка в 12 точек (из цвета фона в прозрачность) — на цветном фоне
   она рисовала заметную полосу поперёк экрана. С общим фоном растушёвка не нужна: шва нет */
html.glass.gpic .topveil::after { display: none; }
/* v2.1.14: когда шапка прилипла, её стекло затемняет фон (--g-bar) — полоса под часами темнеет так же и вместе с ней */
html.glass.gpic .topveil::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--g-bar);
  opacity: 0; transition: opacity .2s ease; }
html.glass.gpic .topveil.dim::before { opacity: 1; }

/* окно «Установка на главный экран» — непрозрачное: под ним экран расписания, текст не должен просвечивать */
html.glass[data-theme="dark"] .isheet { background: linear-gradient(160deg, #1B1D23, #121317); border-color: transparent;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 0 0 1px rgba(255, 255, 255, .06), 0 -10px 40px rgba(0, 0, 0, .5); }
html.glass[data-theme="light"] .isheet { background: #F7F8FA; border-color: transparent; box-shadow: inset 0 1px 0 #FFFFFF, 0 -10px 40px rgba(20, 30, 60, .18); }

/* плашка с названием при прокрутке — тем же стеклом, что шапка недели, без тонкой черты снизу */
html.glass .navbar { background: var(--g-bar); box-shadow: none; }

/* в «Стекле» контур карточки — только тонкая кромка-тень; старая цветная рамка (у ближайшей и идущей пары)
   лежала рядом с ней второй линией: контур выглядел двойным, а при раскрытии/сворачивании — «квадратным» */
html.glass .row :is(.card, .cc) { border-color: transparent; }

/* ---------- замена кабинета (владелец) ---------- */
.rmedit { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 12px;
  background: var(--surface2); color: var(--text2); font: inherit; font-size: calc(13px * var(--fs, 1)); font-weight: 600; }
.rmedit:active { transform: scale(.96); }
.rsheet { text-align: left; }
.rsheet h3 { margin: 4px 0 4px; text-align: left; }
.rsheet .ix { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--surface2); color: var(--muted); display: grid; place-items: center; }
.rs-sub { margin: 0 0 14px; font-size: calc(14px * var(--fs, 1)); line-height: calc(20px * var(--fs, 1)); color: var(--muted); }
.rs-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; }
.rs-in { display: flex; flex-direction: column; gap: 4px; font-size: calc(12px * var(--fs, 1)); font-weight: 600; color: var(--muted); }
.rs-in input { height: 46px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 12px; background: var(--bg); color: var(--text);
  font: inherit; font-size: calc(17px * var(--fs, 1)); font-weight: 600; outline: none; }
.rs-in input:focus { border-color: var(--accent); }
.rs-ck { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: calc(15px * var(--fs, 1)); color: var(--text); }
.rs-ck input { width: 20px; height: 20px; accent-color: var(--accent); }
.rs-note { margin: 14px 0 10px; font-size: calc(13px * var(--fs, 1)); line-height: calc(17px * var(--fs, 1)); color: var(--muted); }
/* ================= Android: стекло размывает слабее (v1.8.6) =================
   Почти все рывки листания в «Статистике» (52 из 61) — с Android. На главном потоке листание чистое
   (дни едут сдвигом на видеокарте), а над движущимся днём лежат слои размытия: нижняя панель, шапка недели,
   кнопки шапки, таблетка дня — их видеокарта пересчитывает каждый кадр. Здесь радиус размытия примерно
   вдвое меньше, а у таблетки (она сама едет вместе с пальцем) размытия нет совсем.
   iPhone не затронут. Проверка: рывки Android в v1.8.6 против v1.8.5 в «Статистике». */
html.android .tabs {
  -webkit-backdrop-filter: blur(12px) saturate(200%); backdrop-filter: blur(12px) saturate(200%); }
html.android .whead .wbtn, html.android .whead .icon-btn.bell, html.android .btn.icon-btn[data-act="back"] {
  -webkit-backdrop-filter: blur(8px) saturate(180%); backdrop-filter: blur(8px) saturate(180%); }
html.android .navbar { -webkit-backdrop-filter: blur(12px) saturate(180%); backdrop-filter: blur(12px) saturate(180%); }
html.android .ibar { -webkit-backdrop-filter: blur(12px) saturate(180%); backdrop-filter: blur(12px) saturate(180%); }
html.android.glass .sbar::before { -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6); }
html.android.glass .days .pill { -webkit-backdrop-filter: none; backdrop-filter: none; }
/* ================= «Стекло, смелее» (проба, html.d3) =================
   Та же раскладка, что и сейчас; меняется подача: фон окрашен цветом текущей пары, крупнее заголовки и время,
   блок «Сейчас» ярче и с медленным бликом, карточки чуть подкрашены цветом своего типа, выбранный день — цветом. */

/* фон — цветом идущей (или ближайшей) пары; нет пары — фирменным синим */
html.d3 { --amb: var(--acc-rgb); }
/* цвет пары ставит renderSchedule (свойство --amb у html) */
html.d3.glass[data-theme="dark"] { --g-a: color-mix(in srgb, rgb(var(--amb)) 62%, #000); --g-c: color-mix(in srgb, rgb(var(--amb)) 45%, #000); --g-op: .75; }
html.d3.glass[data-theme="light"] { --g-a: color-mix(in srgb, rgb(var(--amb)) 30%, #fff); --g-c: color-mix(in srgb, rgb(var(--amb)) 22%, #fff); --g-op: .95; }

/* шапка: крупный жирный заголовок недели */
html.d3 .whead { --wrfs: clamp(22px, 6.6vw, 26px); }   /* крупнее прежних 22, но не наезжает на кнопки недели */
html.d3 h1.wr { font-weight: 800; letter-spacing: -.025em; }
html.d3 .dayhead h2 { font-size: calc(24px * var(--fs, 1)); font-weight: 800; letter-spacing: -.02em; }

/* выбранный день — цветная линза */
html.d3.glass .days .pill { background: linear-gradient(180deg, rgba(var(--acc-rgb), .95), rgba(var(--acc-rgb), .7)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 8px 22px rgba(var(--acc-rgb), .45); }
html.d3.glass .days-on-in, html.d3.glass[data-theme="light"] .days-on-in { color: #FFFFFF; }
html.d3.glass .days-on .dots i, html.d3.glass[data-theme="light"] .days-on .dots i { background: #FFFFFF; }
html.d3.glass .days-on .s, html.d3.glass[data-theme="light"] .days-on .s { color: #FFFFFF; opacity: .85; }

/* «Сейчас»: крупнее, насыщеннее, с медленным бликом по стеклу */
html.d3 .hero { padding: 20px; gap: 14px 16px; border-radius: 30px; overflow: hidden; isolation: isolate; }
html.d3 .hv-ring { grid-template-columns: 92px minmax(0, 1fr); }
html.d3 .ring { width: 92px; height: 92px; }
html.d3 .ring circle { stroke-width: 8; }
html.d3 .ring .rv b { font-size: 30px; font-weight: 800; }
html.d3 .hero h3 { font-size: calc(19px * var(--fs, 1)); font-weight: 700; letter-spacing: -.01em; }
html.d3 .hr b { font-size: calc(28px * var(--fs, 1)); font-weight: 800; letter-spacing: -.03em; }
html.d3.glass .hero { background: linear-gradient(150deg, rgba(var(--k-rgb), .58), rgba(var(--k-rgb), .16) 62%, rgba(255, 255, 255, .05));
  box-shadow: var(--g-edge), 0 26px 60px -18px rgba(var(--k-rgb), .85); }
html.d3.glass[data-theme="light"] .hero { background: linear-gradient(150deg, rgba(var(--k-rgb), .42), rgba(255, 255, 255, .72) 75%); }
/* свет на стекле «Сейчас»: два мягких источника, их вставляет и ведёт 33-bold-glass.js.
   .hglow — большое размытое свечение, .hstreak — вытянутый блик-отражение. Оба плывут без остановок по своей
   гладкой случайной траектории; анимацию считает видеокарта (Web Animations: только transform и opacity).
   Острых краёв нет: радиальные градиенты гаснут внутри своего слоя. Здесь — положение «в покое» (без анимации) */
html.d3 .hero .hglow, html.d3 .hero .hstreak { position: absolute; z-index: -1; left: 50%; top: 50%; pointer-events: none; will-change: transform, opacity; }
html.d3 .hero .hglow { width: 380px; height: 380px; margin: -190px 0 0 -190px; transform: translate(-20%, -15%); opacity: .8;
  background: radial-gradient(circle closest-side, rgba(255, 255, 255, .15), rgba(255, 255, 255, .07) 38%, rgba(255, 255, 255, .02) 68%, transparent); }
html.d3 .hero .hstreak { width: 420px; height: 420px; margin: -210px 0 0 -210px; transform: translate(20%, 0) rotate(35deg); opacity: .8;
  background: radial-gradient(ellipse 15% 46% at 50% 50%, rgba(255, 255, 255, .22), rgba(255, 255, 255, .08) 42%, rgba(255, 255, 255, .02) 72%, transparent); }
html.d3[data-theme="light"] .hero .hglow { background: radial-gradient(circle closest-side, rgba(255, 255, 255, .55), rgba(255, 255, 255, .22) 40%, transparent); }
html.d3[data-theme="light"] .hero .hstreak { background: radial-gradient(ellipse 15% 46% at 50% 50%, rgba(255, 255, 255, .7), rgba(255, 255, 255, .25) 42%, transparent); }

/* лента: время крупнее, карточки подкрашены цветом типа пары */
html.d3 .time .st { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
html.d3.glass .row:not(.past) :is(.card, .cc) { background: linear-gradient(160deg, rgba(var(--k-rgb), .16), rgba(255, 255, 255, .05) 62%); }
html.d3.glass[data-theme="light"] .row:not(.past) :is(.card, .cc) { background: linear-gradient(160deg, rgba(var(--k-rgb), .12), rgba(255, 255, 255, .78) 62%); }
html.d3.glass .row.live :is(.card, .cc) { background: linear-gradient(160deg, rgba(var(--k-rgb), .36), rgba(255, 255, 255, .06)); }

/* нижняя панель: выбранная вкладка — цветом */
html.d3.glass .tab.on { color: var(--accent); }
html.d3.glass[data-theme="dark"] .tab.on { color: #FFFFFF; }

/* v1.9.5: фон липкой полосы (неделя и дни) — только когда она прилипла к верху и под неё уезжает лента.
   Пока полоса стоит на месте (у преподавателя — под его карточкой), фона нет: цветная подсветка не обрезается линией */
.sbar::before { transition: opacity .2s ease, box-shadow .25s ease, scale .45s var(--ease-spring); }
.sbar:not(.stuck)::before { opacity: 0; }

/* v1.9.5: линза нижней панели не выходит за её край. «Желе» растягивает линзу от края, который внутри панели
   (у первой вкладки — от левого, у последней — от правого, у средней — от центра), а к крайней вкладке она едет
   без пружинного перелёта (класс .edge ставит 29-ios26.js) */
/* scale действует после сдвига (translate в transform), поэтому точка растяжения — в координатах несдвинутой линзы:
   сдвиг ti·100% плюс ti·50% внутри неё (0 → левый край, 1 → центр, 2 → правый край) */
.tabs .lens { transform-origin: calc(var(--ti, 0) * 150%) 50%; }
.tabs .lens.edge { transition-timing-function: cubic-bezier(.22, 1, .36, 1); }
.seg3 .thumb.go.edge { transition-timing-function: cubic-bezier(.22, 1, .36, 1); }

/* v2.1.7: вариант «wrap» (см. js/33) — свет в своём слое размером ровно с карточку */
html.d3 .hero > .hlights { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; will-change: transform; }
/* вариант «static» — свет нарисован прямо в карточке, без своего слоя */
html.d3[data-lv="static"] .hero .hglow, html.d3[data-lv="static"] .hero .hstreak { will-change: auto; }
</style>

      const p = st === "live" ? Math.min(100, Math.max(0, Math.round((now.sec - s) / (e - s) * 100))) : 0;
      let statusText;
      if (st === "live") statusText = `Идёт · ещё ${dur(e - now.sec)}`;
      else if (st === "next") statusText = `Через ${dur(s - now.sec)}`;
      else if (st === "past") statusText = "Прошла";
      else statusText = l.number && l.number !== "?" ? `${l.number} пара` : (s != null && e != null ? dur(e - s) : "");
      const teacher = isTeacher ? null : matchTeacher(l.extra);
      items.push({
        type: "lesson", i, key, st, k, compact, p, statusText,
        start: l.start || "", end: l.end || "", time: l.time || "",
        subject: l.subject || "Занятие", room: roomText(l.room), room0: l.room0 ? roomText(l.room0) : "", extra: (l.extra || "").trim(), teacher,
        first: i === 0, last: i === n - 1, afterPast: i > 0 && status[i - 1] === "past" && isToday,
        showNow: st === "live", nowLabel: now.label,
        ctl: controlOf(l.subject, date, isTeacher, l.extra),
        col: k.cls,
      });
    });

    // Блок «Сейчас» наверху сегодняшнего дня: идущая пара, перерыв или ожидание первой пары
    let hero = null;
    if (isToday) {
      const ls = items.filter((x) => x.type === "lesson");
      const live = ls.find((x) => x.st === "live");
      const up = ls.filter((x) => { const s = toSec(x.start); return s != null && s > now.sec; });
      const brk = items.find((x) => x.type === "break" && x.active);
      if (live && toSec(live.end) != null) {
        hero = { mode: "live", main: live, left: toSec(live.end) - now.sec, p: live.p, next: up.find((x) => x.start !== live.start) || null, from: live.start, to: live.end };
      } else if (up.length) {
        const prev = brk ? ls.find((x) => x.i === brk.i - 1) : null;
        hero = { mode: brk ? "break" : "before", main: up[0], left: toSec(up[0].start) - now.sec, p: brk ? brk.p : 0, next: up.find((x) => x.start !== up[0].start) || null,
          from: prev ? prev.end : "", to: up[0].start };
      }
      // в то же время у другой подгруппы — тоже покажем в блоке
      if (hero) hero.same = ls.filter((x) => x !== hero.main && x.start && x.start === hero.main.start);
      // Пара из блока «Сейчас» в ленте сворачивается, чтобы не дублировать её (раскрывается нажатием)
      if (hero && !opened.has(hero.main.key)) hero.main.compact = true;
    }

    let summary = "";
    if (n) {
      const starts = lessons.map((l) => l.start).filter(Boolean);
      const ends = lessons.map((l) => l.end).filter(Boolean);
      summary = `${n} ${plural(n, "пара", "пары", "пар")}`;
      if (starts.length && ends.length) summary += ` · ${starts[0]} – ${ends[ends.length - 1]}`;
      if (isToday && status.every((x) => x === "past")) summary += " · пары закончились";
    }
    const sig = [date, now.date, status.join(","), activeBreak, items.filter((x) => x.showNow).length,
      [...opened].join(",")].join("|");
    return { date, isToday, isPastDay, n, items, summary, sig, hero };
  }

  function heroLeft(h) {
    const m = Math.max(1, Math.ceil(h.left / 60));
    if (m < 100) return { big: String(m), unit: "мин", text: `${m} мин` };
    const hh = Math.floor(m / 60), mm = m % 60;
    return { big: `${hh} ч`, unit: mm ? `${mm} мин` : "ровно", text: mm ? `${hh} ч ${mm} мин` : `${hh} ч` };
  }
  function heroHTML(h) {
    const t = heroLeft(h);
    const label = h.mode === "live" ? `Сейчас · ${h.main.k.label}` : h.mode === "break" ? "Перерыв · дальше" : (h.main.first ? "Первая пара" : "Следующая пара");
    const [roomMain, ...roomRest] = (h.main.room || "").split(" · ");
    const tail = h.mode === "live" ? `до ${h.main.end}` : `начало в ${h.main.start}`;
    const sub = [roomRest.join(" · "), tail].filter(Boolean).join(" · ");
    const nx = h.next;
    // аудитория — раньше названия: длинное название срезается многоточием, а номер аудитории остаётся
    const rm = (o) => (o.room ? `<b>${esc(o.room.split(" · ")[0])}</b> · ` : "");
    const same = (h.same || []).map((o) => `<div class="hn ${o.col}"><i></i><span class="x">Одновременно · ${rm(o)}${esc(o.subject)}</span></div>`).join("");
    const next = same + (nx ? `<div class="hn ${nx.col}"><i></i><span class="x">Дальше <b>${esc(nx.start)}</b> · ${rm(nx)}${esc(nx.subject)}</span></div>` : "");
    const info = `<div class="hb"><span class="hl">${esc(label)}</span><h3>${esc(h.main.subject)}</h3>
        <div class="hr"><b class="${!roomMain ? "none" : roomMain.length > 14 ? "lg" : ""}">${esc(roomMain || "Аудитория не указана")}</b><span>${esc(sub)}</span></div></div>`;
    // ring: ровная дуга без свечения, pathLength=100 — дуга ровно p%
    const vis = `<div class="ring" aria-hidden="true"><svg viewBox="0 0 80 80"><circle class="trk" cx="40" cy="40" r="34" pathLength="100"/>
        ${h.p > 0 ? `<circle class="arc" data-hfill cx="40" cy="40" r="34" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:${100 - h.p}"/>` : ""}</svg>
        <span class="rv"><b data-hbig>${t.big}</b><small data-hunit>${t.unit}</small></span></div>`;
    return `<section class="hero hv-ring ${h.main.col} ${h.mode}" data-hero>${vis}${info}${next}</section>`;
  }

  function emptyHint(data, w, d, isPastDay) {
    if (isPastDay) return "В этот день занятий не было.";
    for (let wi = w; wi < data.weeks.length; wi++) {
      for (let di = wi === w ? d + 1 : 0; di < 7; di++) {
        if (lessonsOf(data.weeks[wi], di).length) {
          return `Свободный день. Следующие пары — ${WHEN[di]}, ${fmtDate(addDays(data.weeks[wi].monday, di))}.`;
        }
      }
    }
    return "Свободный день. Дальше в расписании пар пока нет.";
  }

  function weekLabel(monday) {
    const cur = mondayOf(samaraNow().date);
    const diff = Math.round((toUTC(monday) - toUTC(cur)) / (7 * 86400000));
    return { "-1": "Прошлая неделя", "0": "Эта неделя", "1": "Следующая неделя", "2": "Через неделю" }[diff] || "";
  }
  function weekRange(monday) {
    const a = toUTC(monday), b = toUTC(addDays(monday, 6));
    return a.getUTCMonth() === b.getUTCMonth()
      ? `${a.getUTCDate()} – ${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`
      : `${a.getUTCDate()} ${MSHORT[a.getUTCMonth()]} – ${b.getUTCDate()} ${MSHORT[b.getUTCMonth()]}`;
  }

  // ---------------- разметка ----------------
  function skeletonHTML() {
    return `<div class="top"><div><div class="eyebrow">${esc((index && index.group) || "СОДП-55у")}</div><h1>Расписание</h1></div></div>
      <div class="sk" style="height:66px"></div>
      <div class="sk" style="height:120px;margin-top:22px"></div><div class="sk"></div><div class="sk"></div>`;
  }
  function errorHTML() {
    // без сети — про интернет; сеть есть, а сервер не ответил — так и говорим, чтобы не искать проблему у себя
    const off = navigator.onLine === false;
    return `<div class="empty fade"><div class="ic">${I.wifi}</div><div class="h">${off ? "Нет интернета" : "Не удалось загрузить расписание"}</div>
      <div class="p">${off ? "Подключись к сети — расписание загрузится и дальше будет открываться даже без интернета." : "Сервер расписания не ответил. Попробуй ещё раз через минуту."}</div>
      <button class="btn" data-act="retry" style="margin-top:8px">Повторить</button></div>`;
  }

  function lessonHTML(it, n, isTeacher) {
    const cls = ["row", it.st, it.col, it.first ? "first" : "", it.last ? "last" : "", it.afterPast ? "after-past" : ""].join(" ");
    let rail = `<span class="seg-top"></span><span class="dot"></span><span class="seg" style="--p:${it.p}%;--pn:${it.p / 100}">`;
    if (it.st === "live") {
      rail += `<span class="fill"></span><span class="mark"></span>`
        + `<span class="nowlbl" data-nowlbl${it.showNow ? "" : " hidden"}>${esc(it.nowLabel)}</span>`;
    }
    if (it.st !== "past") rail += `<span class="cap"></span>`;
    rail += `</span>`;

    let body;
    if (it.compact) {
      const lead = it.st === "past" ? I.check : `<span class="bar"></span>`;
      const who = isTeacher ? it.extra : (it.teacher ? shortName(it.teacher.name) : it.extra);
      const room = it.room ? `<b class="rm">${esc(it.room)}</b>` : "";
      // аудитория — первой: на узком экране хвост строки срезается многоточием, а она нужнее всего
      const parts = it.st === "past" ? [room, esc(it.k.label)]
        : it.st === "live" ? [room, esc("Идёт"), esc(it.k.label)]
        : it.st === "next" ? [room, esc("Следующая"), esc(it.k.label)]
        : [room, esc(it.k.label), esc(who || "")];
      body = `<button class="cc" data-act="open" data-key="${esc(it.key)}" aria-expanded="false">
        <h3>${esc(it.subject)}</h3><span class="ln">${lead}<span class="x">${parts.filter(Boolean).join(" · ")}</span></span></button>`;
    } else {
      // кабинет заменён владельцем (на сайте указан другой) — показываем, какой был в расписании
      const r0 = it.room0 ? `<span class="rm0">кабинет изменён · на сайте <s>${esc(it.room0.split(" · ")[0].replace(/^ауд\.\s*/, ""))}</s></span>` : "";
      let meta = it.room ? `<span>${I.pin}<span class="x">${esc(it.room)}</span></span>${r0}` : "";
      let who = "";
      if (isTeacher) {
        if (it.extra) who = `<span>${I.users}<span class="x">${esc(it.extra)}</span></span>`;
      } else if (it.teacher) {
        who = `<button class="tlink" data-act="teacher" data-t="${esc(it.teacher.id)}">${I.user}<span class="x">${esc(shortName(it.teacher.name))}</span></button>`;
      } else if (it.extra) {
        who = `<span>${I.user}<span class="x">${esc(it.extra)}</span></span>`;
      }
      // Форма контроля — тихим чипом справа в последней строке, а не отдельной строкой «Сессия: …»
      const ctl = it.ctl ? `<span class="ctlchip" title="${esc(it.ctl.text)}" aria-label="${esc(it.ctl.text)}">${esc(it.ctl.short)}</span>` : "";
      meta += ctl ? `<div class="mrow">${who}${ctl}</div>` : who;
      const isOpened = opened.has(it.key);
      body = `<div class="card${isOpened ? " opened" : ""}"${isOpened ? ` data-act="open" data-key="${esc(it.key)}"` : ""}>
        <div class="hd"><span class="status" data-status>${esc(it.statusText)}</span><span class="kind">${esc(it.k.label)}</span></div>
        <h3>${esc(it.subject)}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}${isOpened ? roomBtnHTML(it, isTeacher) : ""}</div>`;
    }
    return `<li class="${cls}" style="--i:${n}" data-row="${it.i}">
      <div class="time"><span class="st">${esc(it.start || it.time || "—")}</span><span class="en">${esc(it.end)}</span></div>
      <div class="rail">${rail}</div>${body}</li>`;
  }

  function breakHTML(it) {
    return `<li class="brk${it.active ? " active" : ""}" style="--p:${it.p}%;--pn:${it.p / 100}" data-brk="${it.i}" aria-hidden="${it.active ? "false" : "true"}">
      <div class="time">${it.active ? `<span class="bnow" data-bnow>${esc(it.nowLabel)}</span>` : ""}</div>
      <div class="rail2"><span class="dash"></span>${it.active ? `<span class="bmark"></span>` : ""}</div>
      <div class="blbl">${I.cup}<span data-btext>Перерыв · ${esc(it.text)}</span></div></li>`;
  }

  const PAGER_SPAN = 2;   // v2.0: сколько дней с каждой стороны от текущего готовы сразу (остальные — в паузах)
  // Сосед через n дней (dir = ±n): шагаем по одному, пока не кончатся недели
  function stepPos(data, p, dir) {
    let q = p;
    for (let k = 0; k < Math.abs(dir) && q; k++) q = neighborPos(data, q.w, q.d, Math.sign(dir));
    return q;
  }
  function neighborPos(data, w, d, dir) {
    let nw = w, nd = d + dir;
    if (nd > 6) { if (nw >= data.weeks.length - 1) return null; nw += 1; nd = 0; }
    if (nd < 0) { if (nw <= 0) return null; nw -= 1; nd = 6; }
    return { w: nw, d: nd };
  }
  function dayBodyHTML(data, w, d, isTeacher, enter, model) {
    const m = model || dayModel(data, w, d, isTeacher);
    let html = `<div class="dayhead"><div class="t"><h2>${DAYS[d]}, ${fmtDate(m.date)}</h2>${m.isToday ? `<span class="tag">сегодня</span>` : ""}</div>
      ${m.summary ? `<span class="summary" data-summary>${esc(m.summary)}</span>` : ""}</div>`;
    if (m.hero) html += heroHTML(m.hero);
    if (m.n) {
      let n = 0;
      html += `<ol class="tl${enter ? " enter" : ""}">`;
      for (const it of m.items) html += it.type === "break" ? breakHTML(it) : lessonHTML(it, n++, isTeacher);
      html += `</ol>`;
    } else {
      html += `<div class="empty"><div class="ic">${I.moon}</div><div class="h">Пар нет</div>
        <div class="p">${esc(emptyHint(data, w, d, m.isPastDay))}</div></div>`;
    }
    return html;
  }
  // Шапка недели и полоса дней (v2.1: отдельно от ленты — при переходе на другую неделю перерисовываются только они,
  // лента со всеми днями уже на месте)
  function barParts(data, p, isTeacher, m) {
    const week = data.weeks[p.w];
    m = m || dayModel(data, p.w, p.d, isTeacher);
    const now = samaraNow();
    const def = pickDefault(data);
    const notToday = !(p.w === def.w && p.d === def.d && m.isToday);
    const todayInData = data.weeks.some((x) => x.monday === mondayOf(now.date));

    const label = weekLabel(week.monday);
    const prevW = `<button class="wbtn" data-act="week" data-dir="-1" aria-label="Предыдущая неделя"${p.w <= 0 ? " disabled" : ""}>${I.left}</button>`;
    const nextW = `<button class="wbtn" data-act="week" data-dir="1" aria-label="Следующая неделя"${p.w >= data.weeks.length - 1 ? " disabled" : ""}>${I.right}</button>`;
    const wl = `<span class="wl${label === "Эта неделя" ? " cur" : ""}">${esc(label)}</span>`, wr = esc(weekRange(week.monday));
    // У преподавателя неделя — отдельной строкой под его карточкой; у группы она в шапке (см. renderSchedule)
    let bar = isTeacher ? `<div class="week"><div class="mid" aria-live="polite">${wl}<span class="wr">${wr}</span></div>${prevW}${nextW}</div>` : "";

    bar += `<nav class="days" aria-label="Дни недели"><span class="pill" aria-hidden="true"></span>`;
    for (let d = 0; d < 7; d++) {
      const date = addDays(week.monday, d);
      const ls = lessonsOf(week, d);
      const on = d === p.d, today = date === now.date, dim = date < now.date && !on;
      const dots = ls.slice(0, 4).map((l) => `<i class="${kindOf(l.type).cls}"></i>`).join("");
      const aria = `${DAYS[d]}, ${fmtDate(date)}${today ? ", сегодня" : ""}, ${ls.length ? ls.length + " " + plural(ls.length, "пара", "пары", "пар") : "пар нет"}`;
      bar += `<button class="day${on ? " on" : ""}${today ? " today" : ""}${dim ? " dim" : ""}" data-act="day" data-d="${d}" aria-pressed="${on}" aria-label="${esc(aria)}">
        <span class="s">${SHORT[d]}</span><span class="n">${dayNum(date)}</span><span class="dots">${dots}</span></button>`;
    }
    bar += `</nav>`;
    return { bar, notToday: notToday && todayInData, wl, wr, prevW, nextW, isCur: label === "Эта неделя" };
  }
  function scheduleHTML(data, id, isTeacher) {
    const p = pos[id];
    const m = dayModel(data, p.w, p.d, isTeacher);
    const b = barParts(data, p, isTeacher, m);

    // v2.0: в ленте — все дни расписания подряд (родная прокрутка с защёлкиванием, см. 23-pager.js).
    // Номер страницы = неделя × 7 + день. Текущий и по PAGER_SPAN соседей — готовы сразу, остальные
    // достраиваются в паузах (pagerFillLater) или по пути, если до них долистали раньше.
    const N = data.weeks.length * 7, ci = p.w * 7 + p.d;
    let html = `<div class="pager" data-pager>`;
    for (let i = 0; i < N; i++) {
      const q = { w: Math.floor(i / 7), d: i % 7 };
      if (i === ci) { html += `<div class="page cur${slideDir > 0 ? " from-r" : slideDir < 0 ? " from-l" : ""}" data-cur data-i="${i}">${dayBodyHTML(data, p.w, p.d, isTeacher, enterNext, m)}</div>`; continue; }
      const near = Math.abs(i - ci) <= PAGER_SPAN;
      html += `<div class="page ${i < ci ? "prev" : "next"}" data-i="${i}"${near ? "" : " data-lazy"} aria-hidden="true" inert>${near ? dayBodyHTML(data, q.w, q.d, isTeacher, false) : ""}</div>`;
    }
    html += `</div>`;
    liveSig = m.sig;
    return { ...b, html };
  }

  // ---------------- экраны ----------------
  function render() {
    const token = ++renderToken;
    if (app.style.transform && window.resetEdgeSwipe && !ROOT.classList.contains("ptr-busy") && !ROOT.classList.contains("nav-anim")) window.resetEdgeSwipe();   // экран не должен остаться сдвинутым (кроме самого свайпа)
    app.classList.remove("fill");
    if (view === "settings") return renderSettings();
    if (view === "teachers") return renderTeachers(token);
    if (view === "notif") return renderNotif(token);
    if (view === "stats") return renderStats();
    return renderSchedule(token);
  }

  // ---------------- уведомления ----------------
  function changeItems() { return changes && Array.isArray(changes.items) ? changes.items : []; }
  // Лента «Уведомлений»: изменения расписания от бота + то, что приходит на телефон по расписанию —
  // напоминание перед парой, утренняя сводка, пары на завтра. Их приложение составляет само из расписания:
  // ничего не уходит на сервер, лента появляется даже без подключённого бота.
  const SUN = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 20);
  const MORNING_SEC = 8 * 3600, EVENING_SEC = 20 * 3600;
  function remindLead() { return nstate && nstate.min ? nstate.min : 15; }
  function dayLessons(date) {
    const g = mem.g;
    const w = g && g.weeks.find((x) => x.monday === mondayOf(date));
    return w ? lessonsOf(w, weekday(date)).filter((l) => l.start) : [];
  }
  const hmSec = (hm) => { const [h, m] = String(hm).split(":").map(Number); return h * 3600 + m * 60; };
  const isoAt = (date, sec) => `${date}T${String(Math.floor(sec / 3600)).padStart(2, "0")}:${String(Math.floor((sec % 3600) / 60)).padStart(2, "0")}:00+04:00`;
  // Удалённые свайпом уведомления: помним их (на этом устройстве) 3 недели
  const nItemId = (c) => (c.src === "app" ? `a|${c.kind}|${c.date}|${c.start || ""}` : `c|${c.ts}|${c.date}|${c.start || ""}|${c.kind}|${c.subject || ""}`);
  let nHidden = {};
  try { nHidden = JSON.parse(store.get("nHidden") || "{}") || {}; } catch (e) { nHidden = {}; }
  function nHide(ids, on) {
    const today = samaraNow().date;
    for (const id of ids) { if (on) nHidden[id] = today; else delete nHidden[id]; }
    for (const [id, d] of Object.entries(nHidden)) if (d < addDays(today, -21)) delete nHidden[id];
    store.set("nHidden", JSON.stringify(nHidden));
  }
  function feedItems() {
    return feedItemsAll().filter((c) => !nHidden[nItemId(c)]);
  }
  function feedItemsAll() {
    const out = changeItems().map((c) => Object.assign({ src: "change" }, c));
    const now = samaraNow(), lead = remindLead();
    const today = now.date, yesterday = addDays(today, -1);
    // вчера вечером — «пары на завтра» (то есть на сегодня)
    const tl = dayLessons(today);
    if (tl.length) out.push({ src: "app", kind: "evening", date: today, ts: isoAt(yesterday, EVENING_SEC), lessons: tl });
    const ls = dayLessons(today);
    if (ls.length && now.sec >= MORNING_SEC) out.push({ src: "app", kind: "morning", date: today, ts: isoAt(today, MORNING_SEC), lessons: ls });
    for (const st of [...new Set(ls.map((l) => l.start))]) {
      const at = hmSec(st) - lead * 60;
      if (at >= 0 && at <= now.sec) out.push({ src: "app", kind: "remind", date: today, start: st, lead, ts: isoAt(today, at), lessons: ls.filter((l) => l.start === st) });
    }
    if (now.sec >= EVENING_SEC) {
      const tm = addDays(today, 1), tml = dayLessons(tm);
      if (tml.length) out.push({ src: "app", kind: "evening", date: tm, ts: isoAt(today, EVENING_SEC), lessons: tml });
    }

  let adminStats = null;
  function statSend() {
    if (!index || !index.relay || !window.crypto || !crypto.getRandomValues) return;

    if (!/^[0-9a-f]{16}$/.test(sid || "")) {

    }
    store.set("statDay", today);
    const body = JSON.stringify({ q: "stat", d: sid, m: inTG ? "tg" : STANDALONE ? "pwa" : "web",
      p: IOS ? "ios" : ANDROID ? "android" : "desktop", v: APP_LABEL });
    fetch(index.relay, { method: "POST", body }).catch(() => fetch(index.relay, { method: "POST", body, mode: "no-cors" }).catch(() => {}));
  }
  async function openStats(j) {

    if ((await hmacRaw(kb, cat(utf8(`stats|${n}|`), c))) !== j.h) return null;   // не ваша сводка
    return JSON.parse(new TextDecoder().decode(await streamXor(await sha(cat(kb, utf8(n))), c)));
  }

    // Разрешение спрашиваем прямо в нажатии — иначе iPhone не покажет запрос
    const perm = want ? Notification.requestPermission() : null;
    el.disabled = true;
    setNStatus(want ? "Включаю…" : "Выключаю…");
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (want) {
        if ((await perm) !== "granted") throw new Error("denied");
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(index.vapid) });
        await pushSend(sub, true);
        store.set("pushOn", "1");
        haptic("medium");
        toast("Готово — сейчас придёт проверочное уведомление");
      } else {
        if (sub) { await pushSend(sub, false); await sub.unsubscribe().catch(() => {}); }
        store.set("pushOn", "0");
      }
      renderSettings();
      setNStatus(want ? "Уведомления будут приходить сюда" : "Сюда больше не присылаем", "ok");
    } catch (e) {
      el.disabled = false;
      renderSettings();
      setNStatus(e && e.message === "denied" ? "Уведомления запрещены. Разреши их: Настройки iPhone → Уведомления → Расписание" : "Не получилось — нет связи. Попробуй ещё раз", "err");
    }
  }
  async function pushTgToggle(el) {

    el.setAttribute("aria-checked", String(want));
    setNStatus("Сохраняю…");
    try {
      const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
      if (sub) await pushSend(sub, true);
      setNStatus(want ? "Будет приходить и сюда, и в Telegram" : "В Telegram больше не дублируем", "ok");

  // Подписываем настройки личным ключом и кладём в канал — бот заберёт их за пару секунд
  let saveTimer = null;

  async function hmacHex(keyHex, msg) {
    const raw = new Uint8Array(keyHex.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(msg));
    return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function scheduleSave() {
    setNStatus("Сохраняю…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNotify, 700);
  }
  async function saveNotify() {
    const code = nCode(nstate);
    const t = Date.now();
    const nonce = [...crypto.getRandomValues(new Uint8Array(6))].map((b) => b.toString(16).padStart(2, "0")).join("");
    try {
      const h = await hmacHex(nkey, `${code}|${t}|${nonce}`);
      const body = JSON.stringify({ s: code, t, n: nonce, h });
      let r;
      try {
        r = await fetch(index.relay, { method: "POST", body });
      } catch (netErr) {
        // Если канал не отдаёт CORS-заголовок, ответ прочитать нельзя, но сообщение всё равно доходит.
        // Повтор с тем же телом бот отбросит как дубликат.
        r = await fetch(index.relay, { method: "POST", body, mode: "no-cors" });
      }
      if (r.type !== "opaque" && !r.ok) throw new Error(String(r.status));
      store.set("nlocal", JSON.stringify({ code, min: nstate.min, t, u: TG_USER }));
      setNStatus("Сохранено ✓", "ok");
      if (tg && tg.HapticFeedback && tgAtLeast("6.1")) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) { /* старый клиент */ } }
    } catch (e) {
      setNStatus(`Не удалось сохранить — нет связи. <button class="flink" data-act="notify-settings">Изменить в чате</button>`, "err");
    }
  }

    const k = "seen_" + id, now = Date.now();
    if (now - (+store.get(k) || 0) < 6 * 3600e3) return;
    store.set(k, String(now));
    const body = JSON.stringify({ q: "seen", t: id });
    fetch(index.relay, { method: "POST", body }).catch(() => fetch(index.relay, { method: "POST", body, mode: "no-cors" }).catch(() => {}));
  }
