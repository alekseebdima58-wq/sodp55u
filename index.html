  // кривая переходов между экранами (разгон и мягкая остановка, как у iPhone) — точной ломаной, где браузер умеет
  const NAV_EASE = (() => {
    const f = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2) * 0.35 + (1 - Math.pow(1 - k, 3)) * 0.65;
    const lin = "linear(" + Array.from({ length: 25 }, (_, i) => f(i / 24).toFixed(4)).join(", ") + ")";
    try { if (CSS.supports("animation-timing-function", lin)) return lin; } catch (e) { /* нет CSS.supports */ }
    return "cubic-bezier(.35, .55, .2, 1)";
  })();
  function navLayers(entry) {
    ROOT.classList.add("swiping", "nav-anim");
    const under = document.createElement("div");
    under.className = "under";
    under.setAttribute("aria-hidden", "true");
    under.inert = true;
    if (entry && entry.snap) under.appendChild(entry.snap);
    const dim = document.createElement("div");
    dim.className = "under-dim";
    document.body.append(under, dim);
    under.scrollTop = (entry && entry.y) || 0;
    const w = app.getBoundingClientRect().width || innerWidth;
    const set = (p) => {   // 0 — новый экран на месте, 1 — уехал вправо целиком
      set.p = p;
      app.style.transform = p > 0.0005 ? `translate3d(${navSnap(p * w)}px,0,0)` : "";
      under.style.transform = `translate3d(${navSnap(-0.3 * w * (1 - p))}px,0,0)`;
      dim.style.opacity = String(1 - p);
    };
    const clear = () => {
      ROOT.classList.remove("swiping", "nav-anim");
      app.style.transform = "";
      if (under.firstChild) under.firstChild.remove();   // снимок остаётся в стеке — для жеста «назад»
      under.remove(); dim.remove();
    };
    return { set, clear, els: [app, under, dim] };
  }
  function navRun(L, from, to, dur, done) {
    watchFrames("переход между экранами", dur);
    L.set(from);
    const anims = gpuMove(L.els, () => L.set(to), dur, NAV_EASE);
    animsDone(anims, dur).then(done, done);
  }

  function go(v, t, push) {
    const anim = push && navReady && !navBusy && !navRM() && !document.hidden;
    if (push) stack.push({ view, target, y: window.scrollY, snap: snapshot() });
    else stack = [];
    view = v;
    if (t) target = t;
    enterNext = false;
    opened.clear();
    syncBack();
    syncTabs();
    if (v === "schedule") setTimeout(showInstallBar, 600); else hideInstallBar(false);   // плашка — только на расписании
    if (!anim) {
      render();
      window.scrollTo(0, 0);
      return;
    }
    // новый экран рисуем за правым краем, пока на месте виден снимок прошлого; данные ждём
    // не дольше 0,45 с — чтобы выезжал уже готовый экран, а не заготовка
    navBusy = true;
    const L = navLayers(stack[stack.length - 1]);
    L.set(1);
    const r = render();
    window.scrollTo(0, 0);
    Promise.race([Promise.resolve(r).catch(() => {}), new Promise((res) => setTimeout(res, 450))])
      .then(() => new Promise((res) => requestAnimationFrame(res)))
      .then(() => navRun(L, 1, 0, 380, () => { L.clear(); navBusy = false; }));
  }
  // «Назад» кнопкой (в приложении или в Telegram): тот же сдвиг, что и у жеста
  function goBack() {
    const prev = stack[stack.length - 1];
    if (!prev || !prev.snap || navBusy || navRM() || document.hidden) return back();
    navBusy = true;
    haptic("light");
    const L = navLayers(prev);
    L.set(0);
    navRun(L, 0, 1, 330, () => {
      // настоящий прошлый экран рисуем, пока его закрывает снимок, и только потом убираем снимок
      Promise.resolve(back(true)).catch(() => {}).then(() => requestAnimationFrame(() => { L.clear(); navBusy = false; }));
    });
  }
  function back(instant) {
    instant = instant === true;   // true — после свайпа: экран уже «приехал», без анимации появления
    const prev = stack.pop();
    if (!prev) { if (view !== "schedule") go("schedule", "g", false); return Promise.resolve(); }   // открыли не из расписания — просто туда
    if (!instant) haptic("light");
    view = prev.view;
    target = prev.target;
    enterNext = false;
    syncBack();
    syncTabs();
    // возвращаемся туда же, где были на прошлом экране
    return Promise.resolve(render()).then(() => { if (prev.y) window.scrollTo(0, prev.y); });
  }

  function pickDefault(data) {
    const now = samaraNow();
    const mon = mondayOf(now.date);
    let w = data.weeks.findIndex((x) => x.monday === mon);
    let d = now.wd;
    if (w < 0) {
      w = data.weeks.findIndex((x) => x.monday > mon);
      if (w < 0) w = data.weeks.length - 1;
      d = 0;
    }
    return { w, d };
  }
  function lessonsOf(week, d) {
    const day = week.days.find((x) => x.idx === d);
    return day ? day.lessons : [];
  }

  // ---------------- модель дня ----------------
  function dayModel(data, w, d, isTeacher) {
    const week = data.weeks[w];
    const date = addDays(week.monday, d);
    const lessons = lessonsOf(week, d);
    const now = samaraNow();
    const isToday = date === now.date;
    const isPastDay = date < now.date;
    const n = lessons.length;

    let nextStart = null;
    if (isToday) {
      for (const l of lessons) {
        const s = toSec(l.start);
        if (s != null && s > now.sec && (nextStart == null || s < nextStart)) nextStart = s;
      }
    }
    const status = lessons.map((l) => {
      const s = toSec(l.start), e = toSec(l.end);
      if (isPastDay) return "past";
      if (!isToday || s == null || e == null) return "up";
      if (now.sec >= e) return "past";
      if (now.sec >= s) return "live";
      return s === nextStart ? "next" : "up";
    });

    const items = [];
    let activeBreak = -1;
    lessons.forEach((l, i) => {
      if (i > 0) {
        const prev = lessons[i - 1];
        const bs = toSec(prev.end), be = toSec(l.start);
        if (bs != null && be != null && be > bs) {
          const active = isToday && now.sec >= bs && now.sec < be;
          if (active) activeBreak = i;
          items.push({
            type: "break", i, active,
            text: active ? `ещё ${dur(be - now.sec)}` : dur(be - bs),
            p: active ? Math.round((now.sec - bs) / (be - bs) * 100) : 0,
            nowLabel: now.label,
          });
        }
      }
      const st = status[i];
      const s = toSec(l.start), e = toSec(l.end);
      const k = kindOf(l.type);
      const key = `${date}|${i}`;
      // Свёрнуты все пары, кроме идущей и следующей — в любой день одинаково (раскрываются нажатием)
      const compact = st !== "live" && st !== "next" && !opened.has(key);
      const p = st === "live" ? Math.min(100, Math.max(0, Math.round((now.sec - s) / (e - s) * 100))) : 0;
      let statusText;
      if (st === "live") statusText = `Идёт · ещё ${dur(e - now.sec)}`;
      else if (st === "next") statusText = `Через ${dur(s - now.sec)}`;
      else if (st === "past") statusText = "Прошла";
      else statusText = l.number && l.number !== "?" ? `${l.number} пара` : (s != null && e != null ? dur(e - s) : "");
      const teacher = isTeacher ? null : matchTeacher(l.extra);
      items.push({
        type: "lesson", i, key, st, k, compact, p, statusText,
        start: l.start || "", end: l.end || "", time: l.time || "",
        subject: l.subject || "Занятие", room: roomText(l.room), extra: (l.extra || "").trim(), teacher,
        first: i === 0, last: i === n - 1, afterPast: i > 0 && status[i - 1] === "past" && isToday,
        showNow: st === "live", nowLabel: now.label,
        ctl: controlOf(l.subject, date, isTeacher, l.extra),
        col: k.cls,
      });
    });

    // Блок «Сейчас» наверху сегодняшнего дня: идущая пара, перерыв или ожидание первой пары
    let hero = null;
    if (isToday) {
      const ls = items.filter((x) => x.type === "lesson");
      const live = ls.find((x) => x.st === "live");
      const up = ls.filter((x) => { const s = toSec(x.start); return s != null && s > now.sec; });
      const brk = items.find((x) => x.type === "break" && x.active);
      if (live && toSec(live.end) != null) {
        hero = { mode: "live", main: live, left: toSec(live.end) - now.sec, p: live.p, next: up.find((x) => x.start !== live.start) || null, from: live.start, to: live.end };
      } else if (up.length) {
        const prev = brk ? ls.find((x) => x.i === brk.i - 1) : null;
        hero = { mode: brk ? "break" : "before", main: up[0], left: toSec(up[0].start) - now.sec, p: brk ? brk.p : 0, next: up.find((x) => x.start !== up[0].start) || null,
          from: prev ? prev.end : "", to: up[0].start };
      }
      // в то же время у другой подгруппы — тоже покажем в блоке
      if (hero) hero.same = ls.filter((x) => x !== hero.main && x.start && x.start === hero.main.start);
      // Пара из блока «Сейчас» в ленте сворачивается, чтобы не дублировать её (раскрывается нажатием)
      if (hero && !opened.has(hero.main.key)) hero.main.compact = true;
    }

    let summary = "";
    if (n) {
      const starts = lessons.map((l) => l.start).filter(Boolean);
      const ends = lessons.map((l) => l.end).filter(Boolean);
      summary = `${n} ${plural(n, "пара", "пары", "пар")}`;
      if (starts.length && ends.length) summary += ` · ${starts[0]} – ${ends[ends.length - 1]}`;
      if (isToday && status.every((x) => x === "past")) summary += " · пары закончились";
    }
    const sig = [date, now.date, status.join(","), activeBreak, items.filter((x) => x.showNow).length,
      [...opened].join(",")].join("|");
    return { date, isToday, isPastDay, n, items, summary, sig, hero };
  }

  function heroLeft(h) {
    const m = Math.max(1, Math.ceil(h.left / 60));
    if (m < 100) return { big: String(m), unit: "мин", text: `${m} мин` };
    const hh = Math.floor(m / 60), mm = m % 60;
    return { big: `${hh} ч`, unit: mm ? `${mm} мин` : "ровно", text: mm ? `${hh} ч ${mm} мин` : `${hh} ч` };
  }
  function heroHTML(h) {
    const t = heroLeft(h);
    const label = h.mode === "live" ? `Сейчас · ${h.main.k.label}` : h.mode === "break" ? "Перерыв · дальше" : (h.main.first ? "Первая пара" : "Следующая пара");
    const [roomMain, ...roomRest] = (h.main.room || "").split(" · ");
    const tail = h.mode === "live" ? `до ${h.main.end}` : `начало в ${h.main.start}`;
    const sub = [roomRest.join(" · "), tail].filter(Boolean).join(" · ");
    const nx = h.next;
    // аудитория — раньше названия: длинное название срезается многоточием, а номер аудитории остаётся
    const rm = (o) => (o.room ? `<b>${esc(o.room.split(" · ")[0])}</b> · ` : "");
    const same = (h.same || []).map((o) => `<div class="hn ${o.col}"><i></i><span class="x">Одновременно · ${rm(o)}${esc(o.subject)}</span></div>`).join("");
    const next = same + (nx ? `<div class="hn ${nx.col}"><i></i><span class="x">Дальше <b>${esc(nx.start)}</b> · ${rm(nx)}${esc(nx.subject)}</span></div>` : "");
    const info = `<div class="hb"><span class="hl">${esc(label)}</span><h3>${esc(h.main.subject)}</h3>
        <div class="hr"><b class="${!roomMain ? "none" : roomMain.length > 14 ? "lg" : ""}">${esc(roomMain || "Аудитория не указана")}</b><span>${esc(sub)}</span></div></div>`;
    // ring: ровная дуга без свечения, pathLength=100 — дуга ровно p%
    const vis = `<div class="ring" aria-hidden="true"><svg viewBox="0 0 80 80"><circle class="trk" cx="40" cy="40" r="34" pathLength="100"/>
        ${h.p > 0 ? `<circle class="arc" data-hfill cx="40" cy="40" r="34" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:${100 - h.p}"/>` : ""}</svg>
        <span class="rv"><b data-hbig>${t.big}</b><small data-hunit>${t.unit}</small></span></div>`;
    return `<section class="hero hv-ring ${h.main.col} ${h.mode}" data-hero>${vis}${info}${next}</section>`;
  }

  function emptyHint(data, w, d, isPastDay) {
    if (isPastDay) return "В этот день занятий не было.";
    for (let wi = w; wi < data.weeks.length; wi++) {
      for (let di = wi === w ? d + 1 : 0; di < 7; di++) {
        if (lessonsOf(data.weeks[wi], di).length) {
          return `Свободный день. Следующие пары — ${WHEN[di]}, ${fmtDate(addDays(data.weeks[wi].monday, di))}.`;
        }
      }
    }
    return "Свободный день. Дальше в расписании пар пока нет.";
  }

  function weekLabel(monday) {
    const cur = mondayOf(samaraNow().date);
    const diff = Math.round((toUTC(monday) - toUTC(cur)) / (7 * 86400000));
    return { "-1": "Прошлая неделя", "0": "Эта неделя", "1": "Следующая неделя", "2": "Через неделю" }[diff] || "";
  }
  function weekRange(monday) {
    const a = toUTC(monday), b = toUTC(addDays(monday, 6));
    return a.getUTCMonth() === b.getUTCMonth()
      ? `${a.getUTCDate()} – ${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`
      : `${a.getUTCDate()} ${MSHORT[a.getUTCMonth()]} – ${b.getUTCDate()} ${MSHORT[b.getUTCMonth()]}`;
  }

  // ---------------- разметка ----------------
  function skeletonHTML() {
    return `<div class="top"><div><div class="eyebrow">${esc((index && index.group) || "СОДП-55у")}</div><h1>Расписание</h1></div></div>
      <div class="sk" style="height:66px"></div>
      <div class="sk" style="height:120px;margin-top:22px"></div><div class="sk"></div><div class="sk"></div>`;
  }
  function errorHTML() {
    // без сети — про интернет; сеть есть, а сервер не ответил — так и говорим, чтобы не искать проблему у себя
    const off = navigator.onLine === false;
    return `<div class="empty fade"><div class="ic">${I.wifi}</div><div class="h">${off ? "Нет интернета" : "Не удалось загрузить расписание"}</div>
      <div class="p">${off ? "Подключись к сети — расписание загрузится и дальше будет открываться даже без интернета." : "Сервер расписания не ответил. Попробуй ещё раз через минуту."}</div>
      <button class="btn" data-act="retry" style="margin-top:8px">Повторить</button></div>`;
  }

  function lessonHTML(it, n, isTeacher) {
    const cls = ["row", it.st, it.col, it.first ? "first" : "", it.last ? "last" : "", it.afterPast ? "after-past" : ""].join(" ");
    let rail = `<span class="seg-top"></span><span class="dot"></span><span class="seg" style="--p:${it.p}%">`;
    if (it.st === "live") {
      rail += `<span class="fill"></span><span class="mark"></span>`
        + `<span class="nowlbl" data-nowlbl${it.showNow ? "" : " hidden"}>${esc(it.nowLabel)}</span>`;
    }
    if (it.st !== "past") rail += `<span class="cap"></span>`;
    rail += `</span>`;

    let body;
    if (it.compact) {
      const lead = it.st === "past" ? I.check : `<span class="bar"></span>`;
      const who = isTeacher ? it.extra : (it.teacher ? shortName(it.teacher.name) : it.extra);
      const room = it.room ? `<b class="rm">${esc(it.room)}</b>` : "";
      // аудитория — первой: на узком экране хвост строки срезается многоточием, а она нужнее всего
      const parts = it.st === "past" ? [room, esc(it.k.label)]
        : it.st === "live" ? [room, esc("Идёт"), esc(it.k.label)]
        : it.st === "next" ? [room, esc("Следующая"), esc(it.k.label)]
        : [room, esc(it.k.label), esc(who || "")];
      body = `<button class="cc" data-act="open" data-key="${esc(it.key)}" aria-expanded="false">
        <h3>${esc(it.subject)}</h3><span class="ln">${lead}<span class="x">${parts.filter(Boolean).join(" · ")}</span></span></button>`;
    } else {
      let meta = it.room ? `<span>${I.pin}<span class="x">${esc(it.room)}</span></span>` : "";
      let who = "";
      if (isTeacher) {
        if (it.extra) who = `<span>${I.users}<span class="x">${esc(it.extra)}</span></span>`;
      } else if (it.teacher) {
        who = `<button class="tlink" data-act="teacher" data-t="${esc(it.teacher.id)}">${I.user}<span class="x">${esc(shortName(it.teacher.name))}</span></button>`;
      } else if (it.extra) {
        who = `<span>${I.user}<span class="x">${esc(it.extra)}</span></span>`;
      }
      // Форма контроля — тихим чипом справа в последней строке, а не отдельной строкой «Сессия: …»
      const ctl = it.ctl ? `<span class="ctlchip" title="${esc(it.ctl.text)}" aria-label="${esc(it.ctl.text)}">${esc(it.ctl.short)}</span>` : "";
      meta += ctl ? `<div class="mrow">${who}${ctl}</div>` : who;
      const isOpened = opened.has(it.key);
      body = `<div class="card${isOpened ? " opened" : ""}"${isOpened ? ` data-act="open" data-key="${esc(it.key)}"` : ""}>
        <div class="hd"><span class="status" data-status>${esc(it.statusText)}</span><span class="kind">${esc(it.k.label)}</span></div>
        <h3>${esc(it.subject)}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}</div>`;
    }
    return `<li class="${cls}" style="--i:${n}" data-row="${it.i}">
      <div class="time"><span class="st">${esc(it.start || it.time || "—")}</span><span class="en">${esc(it.end)}</span></div>
      <div class="rail">${rail}</div>${body}</li>`;
  }

  function breakHTML(it) {
    return `<li class="brk${it.active ? " active" : ""}" style="--p:${it.p}%" data-brk="${it.i}" aria-hidden="${it.active ? "false" : "true"}">
      <div class="time">${it.active ? `<span class="bnow" data-bnow>${esc(it.nowLabel)}</span>` : ""}</div>
      <div class="rail2"><span class="dash"></span>${it.active ? `<span class="bmark"></span>` : ""}</div>
      <div class="blbl">${I.cup}<span data-btext>Перерыв · ${esc(it.text)}</span></div></li>`;
  }

  const PAGER_SPAN = 1;   // соседи по одному дню с каждой стороны — строятся сразу, во время свайпа ничего не вставляется
  // Сосед через n дней (dir = ±n): шагаем по одному, пока не кончатся недели
  function stepPos(data, p, dir) {
    let q = p;
    for (let k = 0; k < Math.abs(dir) && q; k++) q = neighborPos(data, q.w, q.d, Math.sign(dir));
    return q;
  }
  function neighborPos(data, w, d, dir) {
    let nw = w, nd = d + dir;
    if (nd > 6) { if (nw >= data.weeks.length - 1) return null; nw += 1; nd = 0; }
    if (nd < 0) { if (nw <= 0) return null; nw -= 1; nd = 6; }
    return { w: nw, d: nd };
  }
  function dayBodyHTML(data, w, d, isTeacher, enter, model) {
    const m = model || dayModel(data, w, d, isTeacher);
    let html = `<div class="dayhead"><div class="t"><h2>${DAYS[d]}, ${fmtDate(m.date)}</h2>${m.isToday ? `<span class="tag">сегодня</span>` : ""}</div>
      ${m.summary ? `<span class="summary" data-summary>${esc(m.summary)}</span>` : ""}</div>`;
    if (m.hero) html += heroHTML(m.hero);
    if (m.n) {
      let n = 0;
      html += `<ol class="tl${enter ? " enter" : ""}">`;
      for (const it of m.items) html += it.type === "break" ? breakHTML(it) : lessonHTML(it, n++, isTeacher);
      html += `</ol>`;
    } else {
      html += `<div class="empty"><div class="ic">${I.moon}</div><div class="h">Пар нет</div>
        <div class="p">${esc(emptyHint(data, w, d, m.isPastDay))}</div></div>`;
    }
    return html;
  }
  function scheduleHTML(data, id, isTeacher) {
    const p = pos[id];
    const week = data.weeks[p.w];
    const m = dayModel(data, p.w, p.d, isTeacher);
    const now = samaraNow();
    const def = pickDefault(data);
    const notToday = !(p.w === def.w && p.d === def.d && m.isToday);
    const todayInData = data.weeks.some((x) => x.monday === mondayOf(now.date));

    const label = weekLabel(week.monday);
    const prevW = `<button class="wbtn" data-act="week" data-dir="-1" aria-label="Предыдущая неделя"${p.w <= 0 ? " disabled" : ""}>${I.left}</button>`;
    const nextW = `<button class="wbtn" data-act="week" data-dir="1" aria-label="Следующая неделя"${p.w >= data.weeks.length - 1 ? " disabled" : ""}>${I.right}</button>`;
    const wl = `<span class="wl${label === "Эта неделя" ? " cur" : ""}">${esc(label)}</span>`, wr = esc(weekRange(week.monday));
    // У преподавателя неделя — отдельной строкой под его карточкой; у группы она в шапке (см. renderSchedule)
    let bar = isTeacher ? `<div class="week"><div class="mid" aria-live="polite">${wl}<span class="wr">${wr}</span></div>${prevW}${nextW}</div>` : "";

    bar += `<nav class="days" aria-label="Дни недели"><span class="pill" aria-hidden="true"></span>`;
    for (let d = 0; d < 7; d++) {
      const date = addDays(week.monday, d);
      const ls = lessonsOf(week, d);
      const on = d === p.d, today = date === now.date, dim = date < now.date && !on;
      const dots = ls.slice(0, 4).map((l) => `<i class="${kindOf(l.type).cls}"></i>`).join("");

  // ---------- push-уведомления на этот телефон (ярлык на экране «Домой») ----------
  // Бот шифрует и подписывает их сам (VAPID + aes128gcm), здесь — только подписка. Подписку передаём боту
  // через тот же канал, зашифрованной и подписанной личным ключом, как и настройки.
  function pushSupported() {
    return !inTG && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && !!(index && index.vapid);
  }
  const pushOn = () => store.get("pushOn") === "1";
  const pushTg = () => store.get("pushTg") !== "0";
  function pushRowsHTML() {
    if (!pushSupported() || !canEditNotify()) return "";

      <div class="body"><span class="nm">${title}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</div>
      <button class="sw" role="switch" data-act="${act}" aria-checked="${on}" aria-label="${title}"><span class="tr"><span class="kn"></span></span></button></div>`;
    const denied = Notification.permission === "denied";
    const phone = svg('<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/>', 18);
    const plane = svg('<path d="M21.5 4.5 2.8 11.6c-.9.4-.9 1.6 0 1.9l4.6 1.5 1.8 5.4c.3.8 1.3 1 1.9.4l2.6-2.5 4.7 3.5c.7.5 1.7.1 1.9-.7L23 5.9c.2-1-.6-1.8-1.5-1.4Z"/><path d="m7.4 15 10.1-7.6"/>', 18);

      ${pushOn() && !denied ? row("ntg", pushTg(), plane, "sic-tg", "В Telegram", "") : ""}`;
  }
  async function pushSend(sub, on) {
    const j = sub.toJSON();
    const kb = Uint8Array.from(nkey.match(/../g).map((h) => parseInt(h, 16)));
    const nonce = hex(crypto.getRandomValues(new Uint8Array(8)));
    const c = await streamXor(await sha(cat(kb, utf8(nonce))),
      utf8(JSON.stringify({ e: j.endpoint, p: j.keys.p256dh, a: j.keys.auth, on: on ? 1 : 0, tg: pushTg() ? 1 : 0 })));
    const t = Date.now();
    const h = await hmacRaw(kb, cat(utf8(`push|${t}|${nonce}|`), c));
    const body = JSON.stringify({ q: "push", n: nonce, t, c: b64u(c), h });
    try { await fetch(index.relay, { method: "POST", body }); }
    catch (e) { await fetch(index.relay, { method: "POST", body, mode: "no-cors" }); }
  }
  async function pushToggle(el) {
    const want = el.getAttribute("aria-checked") !== "true";
    // Разрешение спрашиваем прямо в нажатии — иначе iPhone не покажет запрос
    const perm = want ? Notification.requestPermission() : null;
    el.disabled = true;
    setNStatus(want ? "Включаю…" : "Выключаю…");
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (want) {
        if ((await perm) !== "granted") throw new Error("denied");
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(index.vapid) });
        await pushSend(sub, true);
        store.set("pushOn", "1");
        haptic("medium");
        toast("Готово — сейчас придёт проверочное уведомление");
      } else {
        if (sub) { await pushSend(sub, false); await sub.unsubscribe().catch(() => {}); }
        store.set("pushOn", "0");
      }
      renderSettings();
      setNStatus(want ? "Уведомления будут приходить сюда" : "Сюда больше не присылаем", "ok");

      setNStatus(e && e.message === "denied" ? "Уведомления запрещены. Разреши их: Настройки iPhone → Уведомления → Расписание" : "Не получилось — нет связи. Попробуй ещё раз", "err");

  // Подписываем настройки личным ключом и кладём в канал — бот заберёт их за пару секунд
  let saveTimer = null;

  async function hmacHex(keyHex, msg) {
    const raw = new Uint8Array(keyHex.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(msg));
    return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function scheduleSave() {

  async function saveNotify() {
    const code = nCode(nstate);
    const t = Date.now();
    const nonce = [...crypto.getRandomValues(new Uint8Array(6))].map((b) => b.toString(16).padStart(2, "0")).join("");
    try {
      const h = await hmacHex(nkey, `${code}|${t}|${nonce}`);
      const body = JSON.stringify({ s: code, t, n: nonce, h });
      let r;
      try {
        r = await fetch(index.relay, { method: "POST", body });
      } catch (netErr) {
        // Если канал не отдаёт CORS-заголовок, ответ прочитать нельзя, но сообщение всё равно доходит.
        // Повтор с тем же телом бот отбросит как дубликат.
        r = await fetch(index.relay, { method: "POST", body, mode: "no-cors" });
      }
      if (r.type !== "opaque" && !r.ok) throw new Error(String(r.status));
      store.set("nlocal", JSON.stringify({ code, min: nstate.min, t, u: TG_USER }));
      setNStatus("Сохранено ✓", "ok");
      if (tg && tg.HapticFeedback && tgAtLeast("6.1")) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) { /* старый клиент */ } }
    } catch (e) {
      setNStatus(`Не удалось сохранить — нет связи. <button class="flink" data-act="notify-settings">Изменить в чате</button>`, "err");
    }
  }

  function noteTeacherSeen(id) {

    if (/удален/i.test(t)) return "trash";

    if (/скопирован/i.test(t)) return "copy";
    if (/нет сети|не отвечает|ошибк|не удалось/i.test(t)) return "warn";
    if (/подключен|готово|включен|сохранен/i.test(t)) return "ok";
    return "info";
  }
  function toast(text, action, onAction) {
    const old = document.querySelector(".toast");
    if (old) old.remove();
    text = String(text).replace(/\s*✓$/, "");
    const kind = toastKind(text);
    const el = document.createElement("div");
    el.className = `toast t-${kind}${action ? " act" : ""}`;
    el.setAttribute("role", "status");
    el.innerHTML = `<span class="t-ic" aria-hidden="true">${TOAST_IC[kind]}</span><span class="t-tx"></span>`;
    el.querySelector(".t-tx").textContent = text;
    let hideAnim = null;
    const hide = () => {
      if (!el.isConnected) return;
      try { (hideAnim ? hideAnim() : el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" })).finished.then(() => el.remove(), () => el.remove()); }
      catch (e) { el.remove(); }
    };
    if (action) {
      const b = document.createElement("button");
      b.textContent = action;
      b.addEventListener("click", () => { haptic("light"); el.remove(); onAction && onAction(); });
      el.appendChild(b);
    }
    if (text.length > 34) el.classList.add("long");
    document.body.appendChild(el);
    // всплывает над нижней панелью: чуть поднимается и проявляется (только прозрачность и сдвиг — плавно везде)
    const shown = "translateX(-50%)", up = "translateX(-50%) translateY(12px) scale(.96)";
    try { el.animate([{ transform: up, opacity: 0 }, { transform: shown, opacity: 1 }], { duration: 340, easing: "cubic-bezier(.2, .9, .25, 1.05)" }); }
    catch (e) { /* без анимации */ }
    hideAnim = () => el.animate([{ transform: shown, opacity: 1 }, { transform: up, opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
    setTimeout(hide, action ? 4000 : 2000);
  }

  // ---------------- живое обновление ----------------
  // Подпись «сейчас» у линии идущей пары видна с первой минуты. В начале пары она стоит
  // сразу под временем начала (на месте времени конца) — время конца в это время прячется,
  // а когда подпись уезжает ниже, плавно возвращается. Время начала не перекрывается никогда.
  const NOW_MIN = 14;   // то же, что max(var(--p), 14px) у .nowlbl
  function placeNowLabels(animate) {
    for (const row of app.querySelectorAll(".row.live")) {
      const seg = row.querySelector(".seg"), time = row.querySelector(".time");
      const en = time && time.querySelector(".en"), lbl = row.querySelector("[data-nowlbl]");
      if (!seg || !en || !lbl || lbl.hidden) continue;
      const p = parseFloat(seg.style.getPropertyValue("--p")) || 0;
      const segTop = seg.offsetParent === time.offsetParent ? seg.offsetTop - time.offsetTop
        : seg.getBoundingClientRect().top - time.getBoundingClientRect().top;
      const top = segTop + Math.max(p / 100 * seg.offsetHeight, NOW_MIN) - 8;
      const hide = !!en.textContent && top < en.offsetTop + en.offsetHeight + 1 && top + 16 > en.offsetTop;
      if (row.classList.contains("en-off") === hide) continue;
      if (!animate) row.classList.add("quiet");
      row.classList.toggle("en-off", hide);
      if (!animate) { void en.offsetWidth; row.classList.remove("quiet"); }
    }
  }

  // Раз в 15 секунд: если статусы пар не поменялись — двигаем только шкалу и подписи,
  // чтобы не перезапускать анимации; если поменялись — перерисовываем день целиком.
  // Наступили новые сутки (приложение висело открытым или свёрнутым ночью): кто смотрел «сегодня» —
  // переводим на новое «сегодня», даже без сети. Кто сам ушёл на другой день — не трогаем.
  let tickDate = samaraNow().date;
  function rollDay() {
    const d = samaraNow().date;
    if (d === tickDate) return false;
    const was = tickDate;
    tickDate = d;
    let moved = false;
    for (const id of Object.keys(pos)) {
      const data = mem[id], p = pos[id], w = data && data.weeks[p.w];
      if (!w || addDays(w.monday, p.d) === was) { delete pos[id]; moved = true; }
    }
    return moved;
  }
  function tick() {
    if (rollDay() && (view === "schedule" || view === "teacher") && !scrolling) { opened.clear(); render(); return; }
    if (view !== "schedule" && view !== "teacher") return;
    if (scrolling) return;   // не перерисовываем посреди листания
    const id = view === "teacher" ? target : "g";
    const data = mem[id];
    if (!data || !pos[id] || !data.weeks[pos[id].w]) return;
    const m = dayModel(data, pos[id].w, pos[id].d, view === "teacher");
    if (m.sig !== liveSig) { render(); return; }
    for (const it of m.items) {
      if (it.type === "lesson" && it.st === "live") {
        const row = app.querySelector(`[data-cur] [data-row="${it.i}"]`);
        if (!row) continue;
        const seg = row.querySelector(".seg");
        if (seg) seg.style.setProperty("--p", it.p + "%");
        const st = row.querySelector("[data-status]");
        if (st) st.textContent = it.statusText;
        const lbl = row.querySelector("[data-nowlbl]");
        if (lbl) { lbl.textContent = it.nowLabel; lbl.hidden = !it.showNow; }
        placeNowLabels(true);
      } else if (it.type === "lesson" && it.st === "next") {
        const st = app.querySelector(`[data-cur] [data-row="${it.i}"] [data-status]`);
        if (st) st.textContent = it.statusText;
      } else if (it.type === "break" && it.active) {
        const b = app.querySelector(`[data-cur] [data-brk="${it.i}"]`);
        if (!b) continue;
        b.style.setProperty("--p", it.p + "%");
        const t = b.querySelector("[data-btext]");
        if (t) t.textContent = `Перерыв · ${it.text}`;
        const nl = b.querySelector("[data-bnow]");
        if (nl) nl.textContent = it.nowLabel;
      }
    }
    const hero = m.hero && app.querySelector("[data-cur] [data-hero]");
    if (hero) {
      const t = heroLeft(m.hero);
      const fill = hero.querySelector("[data-hfill]");
      if (fill) { if (fill.tagName.toLowerCase() === "circle") fill.style.strokeDashoffset = 100 - m.hero.p; else fill.style.width = m.hero.p + "%"; }
      const big = hero.querySelector("[data-hbig]"), unit = hero.querySelector("[data-hunit]");
      if (big) big.textContent = t.big;
      if (unit) unit.textContent = t.unit;
    }
  }

  // ---------------- пружины и переходы ----------------
  let springCache = null;
  // Пружинная кривая из CSS (--ease-spring); если linear() не поддерживается — обычная плавная
  function springEase() {
    if (springCache) return springCache;
    const v = getComputedStyle(ROOT).getPropertyValue("--ease-spring").trim() || "cubic-bezier(.4, 0, .2, 1)";
    try { document.body.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1, easing: v }).cancel(); springCache = v; }
    catch (e) { springCache = "cubic-bezier(.4, 0, .2, 1)"; }
    return springCache;
  }
  // Переход на другой день/неделю по нажатию (свайп пальцем идёт своей дорогой — через ленту).
  let quietCommit = false;
  function moveTo(np) {
    const c = curPos();
    if (!c || !np) return;
    // лента уже едет к этому дню (повторное нажатие, «двойной» тап iPhone) — ничего не делаем,
    // иначе день появлялся заново, а таблетка прыгала назад и ехала ещё раз
    if (pgAnim && pgAnim.goal && pgAnim.goal.w === np.w && pgAnim.goal.d === np.d) return;
    const k = (np.w - c.p.w) * 7 + (np.d - c.p.d);
    if (!k) return;
    // Любой переход (соседний или дальний день, «Сегодня», другая неделя) — тем же движением, что и
    // при листании: нужный день кладём в соседний слот ленты, лента уезжает целиком, таблетка едет к нему.
    const pg = pagerEl();
    if (pg && !pgAnim && !REDUCED) {
      const dir = Math.sign(k);
      if (Math.abs(k) === 1 && hasNeighbor(k)) { quietCommit = true; slideTo(pg, k, 0); if (pgAnim) pgAnim.goal = np; return; }
      const slot = pg.querySelector(dir > 0 ? ":scope > .page.next" : ":scope > .page.prev");
      if (slot) {
        slot.innerHTML = dayBodyHTML(c.data, np.w, np.d, view === "teacher", false);
        placeNowLabels(false);
        // таблетка едет прямо к нужному дню (в той же неделе); при смене недели стоит на месте —
        // иначе она «перелетала» на соседний день, пока уезжала страница
        pillGoal = np.w === c.p.w ? np.d : c.p.d;
        haptic("select");
        slideTo(pg, dir, 0, np);
        if (pgAnim) pgAnim.goal = np;
        return;
      }
    }
    rememberPill();
    pos[c.id] = np;
    opened.clear();
    enterNext = false;
    slideDir = Math.sign(k);
    render();
  }

  // ---------------- липкая шапка ----------------
  // Как «большой заголовок» в iOS: при прокрутке полоса с днями прилипает к верху на стекле,
  // а заголовок недели сжимается. Порог с запасом (56 / 8 px), чтобы не дрожало на границе.
  let barSmall = false;
  function syncBar() {
    const bar = app.querySelector(".sbar");
    if (!bar) return;
    const y = window.scrollY;
    if (!barSmall && y > 56) barSmall = true;
    else if (barSmall && y < 8) barSmall = false;
    bar.classList.toggle("stuck", y > 2);
    bar.classList.toggle("small", barSmall);
  }
  window.addEventListener("scroll", syncBar, { passive: true });

  // ---------------- события ----------------
  app.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    if (navBusy && (act === "teacher" || act === "notif" || act === "back")) return;   // экран ещё едет — второй тап не считаем
    const id = view === "teacher" ? target : "g";

    if (act === "day") {
      const d = +el.dataset.d;
      const goal = pgAnim && pgAnim.goal;   // лента ещё едет — сравниваем с днём, к которому едет
      if (goal && goal.w === pos[id].w && goal.d === d) { /* лента уже едет туда — повторное нажатие не считаем */ }
      else if (pos[id] && (goal || pos[id].d !== d)) { haptic("select"); moveTo({ w: pos[id].w, d }); }
    } else if (act === "week") {
      const data = mem[id];
      const w = pos[id].w + (+el.dataset.dir);
      if (data && w >= 0 && w < data.weeks.length) { haptic("select"); moveTo({ w, d: pos[id].d }); }
    } else if (act === "today") {
      if (mem[id]) {
        haptic("light");
        moveTo(pickDefault(mem[id]));
      }
    } else if (act === "teacher") {
      haptic("light");
      go("teacher", el.dataset.t, true);
    } else if (act === "open") {
      toggleCard(el.dataset.key);
    } else if (act === "back") {
      goBack();
    } else if (act === "notif") {
      haptic("light");
      go("notif", null, true);
    } else if (act === "fs") {
      haptic("select");
      setFullscreen(!tg.isFullscreen);
    } else if (act === "srange") {
      const r = +el.dataset.v;
      if (r !== statsRange) { haptic("light"); statsRange = r; statsPick = -1; store.set("statsRange", String(r)); const y = window.scrollY; render(); window.scrollTo(0, y); }
    } else if (act === "stats") {
      haptic("light");
      statsPick = -1;
      go("stats", null, true);
      loadAdminStats(true).then((st) => { if (st && view === "stats" && !navBusy) { const y = window.scrollY; render(); window.scrollTo(0, y); } });
    } else if (act === "to-settings") {
      haptic("light");
      nOpen = true; store.set("nOpen", "1");
      go("settings", null, true);
      const sec = document.getElementById("nsec");
      if (sec) requestAnimationFrame(() => sec.scrollIntoView({ block: "start", behavior: "smooth" }));
    } else if (act === "install") {
      haptic("light");
      promptInstall();
    } else if (act === "install-open") {
      haptic("light");
      openInstallPage();
    } else if (act === "notify-settings") {
      openNotifySettings();
    } else if (act === "nfold") {
      haptic("light");
      setNotifOpen(!nOpen);
    } else if (act === "nlink") {
      haptic("light");
      linkStart();
    } else if (act === "npush") {
      pushToggle(el);
    } else if (act === "ntg") {
      haptic("select");
      pushTgToggle(el);
    } else if (act === "nlink-reopen") {
      if (linkStartArg) openLinkChat(linkStartArg);
    } else if (act === "nlink-cancel") {
      haptic("light");
      linkCancel();
    } else if (act === "ntoggle") {
      if (!canEditNotify()) return;
      const k = el.dataset.k;
      nstate[k] = !nstate[k];
      el.setAttribute("aria-checked", String(nstate[k]));
      if (k === "on") { const row = document.getElementById("nminrow"); if (row) row.hidden = !nstate.on; }
      haptic("select");
      refreshNSummary();
      scheduleSave();
    } else if (act === "ndel") {
      const w = el.closest(".ncw");
      if (w) ncRemove([w]);
    } else if (act === "nclear") {
      let ids = [];
      try { ids = JSON.parse(el.dataset.ids || "[]"); } catch (e) { ids = []; }
      const ws = [...app.querySelectorAll(".ncw")].filter((w) => ids.includes(w.dataset.nid));
      if (ws.length) ncRemove(ws);
    } else if (act === "jump") {
      const date = el.dataset.date;
      const g = mem.g;
      const w = g && date ? g.weeks.findIndex((x) => x.monday === mondayOf(date)) : -1;
      if (w < 0) { haptic("light"); toast("Этого дня уже нет в расписании"); return; }
      pos.g = { w, d: weekday(date) };
      delete keepMonday.g;   // иначе после обновления (потянули вниз) открылась бы прежняя неделя, а не день из уведомления
      focusTarget = { date, start: el.dataset.start, kind: el.dataset.kind };
      haptic("select");
      go("schedule", "g", false);
    } else if (act === "retry") {
      delete mem[id];
      render();
    } else if (act === "retry-net") {
      haptic("light");
      el.textContent = "Обновляю…";
      refreshNow();
    } else if (act === "icon-style") {
      store.set("iconStyle", el.dataset.v);
      try { window.applyIconStyle(el.dataset.v); } catch (e) { /* старая страница */ }
      haptic("select");
      app.querySelectorAll('[data-act="icon-style"]').forEach((b) => { const on = b === el; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
    } else if (act === "install-done") {
      haptic("medium"); store.set("installDone", "1"); hideInstallBar(true); renderSettings();
    } else if (act === "install-again") {
      haptic("light"); store.set("installDone", "0"); renderSettings();
    } else if (act === "theme") {
      store.set("theme", el.dataset.v);
      applyTheme();
      haptic("select");
      renderSettings();
    } else if (act === "site") {
      const g = mem.g;
      const w = g && pos.g ? g.weeks[pos.g.w] : g && g.weeks[0];
      const url = (w && w.url) || "https://www.samgups.ru/raspisanie_v2/";
      if (inTG && tg.openLink) { try { tg.openLink(url); return; } catch (e) { /* ниже — обычное окно */ } }
      window.open(url, "_blank", "noopener");
    }
  });

  app.addEventListener("change", (ev) => {
    if (ev.target.id !== "nmin" || !canEditNotify()) return;
    nstate.min = +ev.target.value;
    haptic("select");
    refreshNSummary();
    scheduleSave();
  });

  app.addEventListener("input", (ev) => {
    if (ev.target.id !== "q") return;
    query = ev.target.value;
    const box = document.getElementById("tlists");
    if (box && index) box.innerHTML = teacherListsHTML();
  });

  // «Расписание» внизу: с другого раздела — возвращает к расписанию, а если уже в нём — к сегодняшнему дню
  function goToday() {
    const data = mem.g;
    if (!data || !data.weeks || !data.weeks.length) return;
    const def = pickDefault(data), p = pos.g;
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (p && p.w === def.w && p.d === def.d) return;   // уже сегодня — просто наверх
    if (!p) { pos.g = def; render(); return; }
    moveTo(def);   // рядом — плавная прокрутка ленты, далеко — сдвиг страницы
  }
  tabs.forEach((b) => b.addEventListener("click", () => {
    if (navBusy) return;   // пока экран едет, вкладки не переключаем
    const t = b.dataset.tab;
    haptic("select");
    if (t === "schedule") {
      if (view === "schedule") goToday();
      else go("schedule", "g", false);
    } else if (view === t) {
      // уже открыта эта вкладка — не перерисовываем заново, просто наверх
      window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
    } else go(t, null, false);
  }));

  // ---------------- свежие данные при возвращении ----------------
  // Если приложение долго висело свёрнутым — тихо подтягиваем то, что бот выложил за это время.
  let loadedAt = Date.now(), loadedDate = samaraNow().date, reloading = false;
  // Принудительно: по кнопке «Повторить», при появлении сети и раз в минуту, пока показано сохранённое
  function refreshNow() { loadedAt = 0; reloadIfStale(true); }
  window.addEventListener("online", () => { if (mem.g && mem.g._offline) refreshNow(); });
  setInterval(() => { if (mem.g && mem.g._offline && !document.hidden) refreshNow(); }, 60 * 1000);
  async function reloadIfStale(force, quiet) {
    if (reloading || (document.hidden && !force) || Date.now() - loadedAt < 10 * 60 * 1000) return;
    reloading = true;
    try {
      const [i, mt, ch, g] = await Promise.all([fetchJSON("data/index.json"), fetchJSON("data/meta.json"),
        fetchJSON("data/changes.json"), fetchJSON("data/g.json")]);
      if (g._offline) {
        if (quiet) { if (mem.g) mem.g._offline = true; if (view === "schedule") render(); return false; }   // показываем «нет сети» на сохранённом
        if (force) { render(); toast(lastNetError ? `Не отвечает — ${lastNetError}` : "Нет сети"); }
        return false;
      }
      // тихая проверка после быстрого запуска: всё то же самое — экран не трогаем совсем
      const same = (a, b) => { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } };
      if (quiet && same(g, mem.g) && same(i, index) && same(ch, changes)) {
        meta = mt; loadedAt = Date.now(); loadedDate = samaraNow().date;
        syncBadge();
        return true;
      }
      const newDay = samaraNow().date !== loadedDate;
      for (const id of Object.keys(pos)) {
        const w = mem[id] && mem[id].weeks[pos[id].w];
        if (newDay || !w) delete pos[id];          // наступил новый день — открываем сегодня
        else keepMonday[id] = w.monday;            // иначе — та же неделя и день, что были
      }
      for (const k of Object.keys(mem)) delete mem[k];
      index = i; meta = mt; changes = ch; mem.g = g;
      loadedAt = Date.now(); loadedDate = samaraNow().date;
      opened.clear();
      if (view !== "teachers") render();   // в списке преподавателей не сбиваем поиск
      syncBadge();
      return true;
    } catch (e) {
      /* нет сети — попробуем в следующий раз */
      return false;
    } finally {
      reloading = false;
    }
  }

  // ---------------- раскрытие карточки пары ----------------
  // Меняем только эту карточку и плавно тянем её высоту — остальной экран не перерисовываем
  function toggleCard(key) {
    opened.has(key) ? opened.delete(key) : opened.add(key);
    haptic("select");
    const isTeacher = view === "teacher";
    const id = isTeacher ? target : "g";
    const data = mem[id], p = pos[id];
    const btn = [...app.querySelectorAll("[data-cur] [data-key]")].find((x) => x.dataset.key === key);
    const row = btn && btn.closest(".row");
    if (!data || !p || !row || REDUCED || scrolling) { render(); return; }
    const m = dayModel(data, p.w, p.d, isTeacher);
    const it = m.items.find((x) => x.type === "lesson" && x.key === key);
    if (!it) { render(); return; }
    const oldBody = row.querySelector(".card, .cc");
    const ob = oldBody.getBoundingClientRect(), rb = row.getBoundingClientRect();
    const h0 = ob.height;
    const r0 = getComputedStyle(oldBody).borderTopLeftRadius;   // скругление старой карточки (пока она ещё на странице)
    const oldTitle = oldBody.querySelector("h3");
    const t0 = oldTitle ? oldTitle.getBoundingClientRect() : null;
    const f0 = oldTitle ? parseFloat(getComputedStyle(oldTitle).fontSize) : 0;
    const n0 = oldTitle ? Math.round(t0.height / (parseFloat(getComputedStyle(oldTitle).lineHeight) || f0 * 1.3)) : 0;   // строк в названии
    const oldSeg = row.querySelector(".seg");
    const s0 = oldSeg ? oldSeg.getBoundingClientRect().height : 0;
    // где стояли пары ниже — потом они плавно доедут до новых мест
    const after = [];
    for (let el = row.nextElementSibling; el; el = el.nextElementSibling) after.push([el, el.getBoundingClientRect().top]);
    const list = row.parentElement;
    if (list) list.classList.remove("enter");   // чтобы не проиграть заново анимацию появления
    const tmp = document.createElement("ol");
    tmp.innerHTML = lessonHTML(it, parseInt(row.style.getPropertyValue("--i"), 10) || 0, isTeacher);
    const fresh = tmp.firstElementChild;
    row.replaceWith(fresh);
    // новая строка пришла без отметки «конец пары спрятан» — сразу решаем заново, иначе «сейчас 12:14»
    // ложилось прямо на «13:40» (у идущей пары после нажатия на карточку)
    placeNowLabels(false);
    liveSig = m.sig;
    const body = fresh.querySelector(".card, .cc");
    const h1 = body.getBoundingClientRect().height;
    const d = h1 - h0;   // > 0 — раскрываем, < 0 — сворачиваем
    if (d >= 0) fitPager(); else setTimeout(fitPager, 360);

    // Всё движение — сдвигами и масками, которые телефон считает на видеокарте:
    // страница под карточкой не перерисовывается каждый кадр, поэтому без рывков
    // Без пружины: карточка и пары ниже приезжают на место и сразу останавливаются. Пружина с перелётом
    // давала «докат» — содержимое проскакивало на несколько точек и возвращалось, это выглядело как дёрганье.
    const ease = "cubic-bezier(.25, .9, .3, 1)", dur = 340, opt = { duration: dur, easing: ease };
    watchFrames("раскрытие карточки", dur);
    const radius = getComputedStyle(body).borderTopLeftRadius;

    // 1) пары ниже съезжают со старого места на новое
    for (const [el, top0] of after) {
      const dy = top0 - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 0.5) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], opt);
    }
    // 2) линия слева растёт/укорачивается вместе с карточкой, кружок на конце остаётся круглым
    const seg = fresh.querySelector(".seg");
    if (seg && s0) {
      const s1 = seg.getBoundingClientRect().height || 1, k = s0 / s1;
      seg.style.transformOrigin = "50% 0";
      seg.animate([{ transform: `scaleY(${k})` }, { transform: "none" }], opt);
      const cap = seg.querySelector(".cap");
      if (cap) { cap.style.transformOrigin = "50% 100%"; cap.animate([{ transform: `scaleY(${1 / k})` }, { transform: "none" }], opt); }
      // отметка «сейчас» и время рядом с ней — тоже без растяжения
      seg.querySelectorAll(".mark, .nowlbl").forEach((el) => el.animate([{ transform: `scaleY(${1 / k})` }, { transform: "none" }], opt));
    }
    // 3) сама карточка: при раскрытии — открывается маской сверху вниз,
    //    при сворачивании — старая карточка под ней поджимается той же маской
    const ghost = oldBody.cloneNode(true);
    ghost.removeAttribute("data-act");
    ghost.setAttribute("aria-hidden", "true");
    Object.assign(ghost.style, {
      position: "absolute", top: `${ob.top - rb.top}px`, left: `${ob.left - rb.left}px`, width: `${ob.width}px`,
      height: `${h0}px`, margin: "0", pointerEvents: "none",
    });
    const gt = ghost.querySelector("h3");
    fresh.style.position = "relative";
    // Название: если строки переносятся так же — просто едет и масштабируется. Если перенос другой
    // (в свёрнутой карточке в одну строку, в раскрытой — в две), старое название уезжает и гаснет,
    // а новое появляется на его месте и доезжает — без мгновенного «прыжка» текста
    const title = body.querySelector("h3");
    const t1 = title && t0 ? title.getBoundingClientRect() : null;
    const f1 = title ? parseFloat(getComputedStyle(title).fontSize) || f0 : f0;
    const n1 = title && t1 ? Math.round(t1.height / (parseFloat(getComputedStyle(title).lineHeight) || f1 * 1.3)) : 0;
    const morph = !!(t1 && n0 && n0 !== n1 && gt);
    if (gt && !morph) gt.style.visibility = "hidden";
    // Фон карточки возвращаем без плавного перехода (иначе после сворачивания он ещё 0,2 с «проявляется»)
    const cleanup = () => {
      ghost.remove(); fresh.style.position = "";
      body.style.cssText = "transition: none";
      requestAnimationFrame(() => requestAnimationFrame(() => { body.style.cssText = ""; }));
    };
    if (d >= 0) {
      Object.assign(ghost.style, { background: "transparent", borderColor: "transparent", boxShadow: "none", zIndex: "2" });
      fresh.appendChild(ghost);
      body.animate([{ clipPath: `inset(0px 0px ${d}px 0px round ${radius})` }, { clipPath: `inset(0px 0px 0px 0px round ${radius})` }], opt);
      // старая карточка убирается, как только её текст погас (раньше конца движения)
      if (ghost.getAnimations) requestAnimationFrame(() => Promise.all(ghost.getAnimations({ subtree: true }).map((x) => x.finished)).then(cleanup, cleanup));
      else setTimeout(cleanup, dur + 40);   // старый iPhone без getAnimations — убираем по времени
    } else {
      ghost.style.zIndex = "0";
      fresh.insertBefore(ghost, fresh.firstChild);
      // transition: none — иначе фон карточки гаснет плавно и на миг закрывает старый текст тёмной плашкой
      Object.assign(body.style, { position: "relative", zIndex: "1", background: "transparent", borderColor: "transparent", boxShadow: "none", transition: "none" });
      ghost.animate([{ clipPath: `inset(0px 0px 0px 0px round ${r0})` }, { clipPath: `inset(0px 0px ${-d}px 0px round ${radius})` }], { ...opt, fill: "forwards" })
        .finished.then(cleanup).catch(cleanup);
    }
    // старые строки (аудитория, преподаватель, тип) плавно гаснут на своих местах
    const fadeOut = { duration: 120, easing: "ease-out", fill: "forwards" };
    for (const c of ghost.children) if (c !== gt) c.animate([{ opacity: 1 }, { opacity: 0 }], fadeOut);
    // 4) название переезжает на новое место
    if (t1) {
      const dx = t0.left - t1.left, dy = t0.top - t1.top, k = f0 / f1;
      title.style.transformOrigin = gt.style.transformOrigin = "0 0";
      title.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${k})` }, { transform: "none" }], opt);
      if (morph) {
        // по очереди, а не одновременно: две разные раскладки текста не просвечивают друг через друга
        gt.animate([{ transform: "none" }, { transform: `translate(${-dx}px, ${-dy}px) scale(${1 / k})` }], { ...opt, fill: "forwards" });
        gt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: Math.round(dur * 0.28), easing: "ease-in", fill: "forwards" });
        title.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: Math.round(dur * 0.5), delay: Math.round(dur * 0.18), easing: "ease-out", fill: "backwards" });
      }
    }
    // 5) новые строки проявляются вместе с движением, а не после него — ничего не «выскакивает» в конце
    let n = 0;
    for (const c of body.children) {
      if (c === title) continue;
      c.animate([{ opacity: 0, transform: "translateY(-3px)" }, { opacity: 1, transform: "none" }],
        { duration: 200, delay: (d >= 0 ? 50 : Math.round(dur * (morph ? 0.3 : 0.15))) + 30 * n++, easing: "ease-out", fill: "backwards" });
    }
  }

  // ---------------- листание дней ----------------
  // Вчера | сегодня | завтра лежат в горизонтальной прокрутке с защёлкиванием. Листает сам телефон,

  function curPos() {

  }

  // Высота ленты — как у текущего дня, но до низа экрана: соседние дни при листании видны целиком,
  // а пустого места для прокрутки под коротким днём не появляется
  function fitPager() {
    const pg = pagerEl();
    const cur = pg && pg.querySelector("[data-cur]");
    if (!cur) return;
    const top = pg.getBoundingClientRect().top + window.scrollY;
    const padBottom = parseFloat(getComputedStyle(app).paddingBottom) || 0;   // место под нижней панелью
    const visible = window.innerHeight - top - padBottom;
    pg.style.height = `${Math.max(cur.offsetHeight, Math.round(visible))}px`;
  }
  function setupPager() {
    const pg = pagerEl();
    if (!pg) return;
    fitPager();
    pg.scrollLeft = curIndex(pg) * pg.clientWidth;   // лента сама не прокручивается — двигаем дни трансформом
    pg.addEventListener("touchstart", pagerDown, { passive: true });
    pg.addEventListener("touchmove", pagerMove, { passive: false });
    pg.addEventListener("touchend", pagerUp, { passive: true });
    pg.addEventListener("touchcancel", pagerUp, { passive: true });
    setupPill();

  // ---- листание дней: как в iOS, через видеокарту ----
  // Дни (текущий и по соседу с каждой стороны) сдвигаются трансформом — это делает видеокарта,
  // главный поток не нагружается, поэтому без подёргиваний. Таблетка в полосе дней едет вместе с пальцем.
  let pgDrag = null, pgAnim = null, pgX = 0;
  // Сдвиги — ровно по точкам экрана телефона: при дробных сдвигах текст выравнивается отдельно
  // от рамок и «дрожит» внутри карточки
  const DPR = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const snap = (v) => Math.round(v * DPR) / DPR;
  // на время движения каждый день — отдельный слой видеокарты: не перерисовывается, а едет готовой картинкой
  function pagerLayers(pg, on) { if (pg && pg.classList.contains("paging") !== on) pg.classList.toggle("paging", on); }
  function pagerPages(pg) { return pg.querySelectorAll(":scope > .page"); }
  // ---- «открытие дня» ----
  // Въезжающий день мягко проявляется, уходящий слегка гаснет. Строки внутри дня едут вместе с ним.
  let cascadeSide = 0;
  function cascadeReset(page) {
    if (!page) return;
    page.style.opacity = "";
  }
  function cascade(pg, off) {
    if (REDUCED) return;
    const dir = Math.sign(off), p = Math.min(1, Math.abs(off));
    const cur = pg.querySelector(":scope > [data-cur]");
    const inc = dir > 0 ? pg.querySelector(":scope > .page.next") : dir < 0 ? pg.querySelector(":scope > .page.prev") : null;
    if (cascadeSide && cascadeSide !== dir) {   // сменили направление — прошлый въезжающий день вернуть как был
      cascadeReset(pg.querySelector(cascadeSide > 0 ? ":scope > .page.next" : ":scope > .page.prev"));
    }
    cascadeSide = dir;
    // «Открытие дня» — мягкая смена прозрачности целых дней. Строки внутри дня едут вместе
    // со страницей, без отставания: название и преподаватель не съезжают и не возвращаются
    if (cur) cur.style.opacity = p ? (1 - 0.35 * p).toFixed(3) : "";

  const pagerCurve = (k, a) => { const k2 = k * k, k3 = k2 * k; return 3 * k2 - 2 * k3 + a * (k - 2 * k2 + k3); };

  function pagerStop() {
    const a = pgAnim;
    if (!a) return;
    pgAnim = null;
    const ct = a.anims[0] && a.anims[0].currentTime;
    const k = Math.max(0, Math.min(1, ((ct != null ? ct : performance.now() - a.t0)) / a.T));
    setPagerX(a.pg, a.from + a.dist * pagerCurve(k, a.a));
    a.anims.forEach((x) => x.cancel());

  function pagerAnim(pg, to, v, done, since) {

    pagerLayers(pg, true);
    const from = pgX, dist = to - from;
    scrolling = true;
    let tok = null;
    const finish = () => { if (pgAnim !== tok) return; pgAnim = null; scrolling = false; done && done(); if (!pgDrag) pagerLayers(pagerEl(), false); };
    if (Math.abs(dist) < 0.5 || REDUCED) { setPagerX(pg, to); finish(); return; }
    // День продолжает движение ровно с той скоростью, с которой его отпустил палец, плавно
    // разгоняется (если палец был медленным) и мягко тормозит у места — без скачка скорости.
    // Раньше после отпускания скорость сразу вырастала в 2–3 раза: глаз видел рывок и «30 кадров».
    const W = pg.clientWidth || 390, D = Math.abs(dist), sg = Math.sign(dist);
    let v0 = v || 0;                                   // px/мс, как у пальца (плюс — вправо)
    const tMax = 200 + 220 * Math.min(1, D / W);       // целый день — 0,42 с, остаток пути — быстрее
    let T = v0 * sg > 0.05 ? Math.max(140, Math.min(tMax, 2 * D / (v0 * sg))) : tMax;
    if (!v) v0 = sg * 0.8 * D / T;                     // по нажатию — трогается сразу, без «раскачки»
    if (v0 * sg * T > 3 * D) v0 = sg * 3 * D / T;      // быстрее нельзя — проскочил бы мимо дня
    const a3 = v0 * T;                                 // начальная скорость в долях пути
    // отсчёт — с последнего движения пальца: первый кадр после отпускания не «замирает»
    // since — время кадра, в котором показано последнее положение пальца: движение продолжается
    // ровно с него, и следующий кадр сдвигается на один кадр пути — без «прыжка» и без «замирания»
    const now0 = performance.now(), t0 = since && now0 - since < 50 ? since : 0;

    // и цифры в ней едут в отдельном потоке видеокарты с частотой экрана (60 или 120 кадров)
    const a = a3 / dist;
    const pill = pillEl(), on = pill && pill.parentNode.querySelector(".days-on");
    const anims = gpuMove([...pagerPages(pg), pill, on, on && on.firstElementChild], () => setPagerX(pg, to), T,
      `cubic-bezier(0.3333, ${(a / 3).toFixed(4)}, 0.6667, 1)`);
    if (t0) anims.forEach((x) => { try { x.startTime = t0; } catch (e) { /* не умеет — начнёт со следующего кадра */ } });

  // уехать на соседний день (dir = ±1) и сменить его (новый день встаёт ровно туда же — подмена незаметна)
  function slideTo(pg, dir, v, np, since) {

    pgX = 0;

    pgDrag = { pg, x: t.clientX, y: t.clientY, base: pgX, mode: 0, vx: 0, lx: t.clientX, lt: performance.now() };

      d.x = t.clientX; d.base = pgX;                         // без рывка на величину «мёртвой зоны»

    if (d.mode !== 1) return;

    setPagerX(d.pg, x);
    // скорость пальца — по всем касаниям за последние ~80 мс (как в iOS), а не по одному-двум:
    // при быстром броске касаний мало, и прежний расчёт занижал скорость — после отпускания день «тормозил»
    const now = e.timeStamp || performance.now();

    pagerTouch = false;
    if (d.mode !== 1) { if (pgX && !pgAnim) slideTo(d.pg, 0, 0); else if (!pgAnim) pagerLayers(d.pg, false); return; }
    const W = d.pg.clientWidth || 1;

    const ct = e.changedTouches && e.changedTouches[0], upT = e.timeStamp || performance.now();

    const off = -pgX / W;                                   // плюс — тянем к следующему дню
    let dir = 0;
    if (d.vx < -0.3 || (off > 0.35 && d.vx < 0.25)) dir = 1;
    else if (d.vx > 0.3 || (off < -0.35 && d.vx > -0.25)) dir = -1;
    if (dir && !hasNeighbor(dir)) dir = 0;
    if (d.raf) { cancelAnimationFrame(d.raf); d.raf = 0; }

  }

  // ---- таблетка выбранного дня: плавно едет за листанием и к нажатому дню ----
  let pillPos = [];
  function pillEl() { return app.querySelector(".days .pill"); }
  function measurePill() {
    const days = app.querySelectorAll(".days .day");

  }
  function pillAt(f) {   // f — дробный номер дня 0…6

    const a = Math.max(0, Math.min(6, Math.floor(f))), b = Math.max(0, Math.min(6, a + 1)), k = Math.max(0, Math.min(1, f - a));
    const [la, wa] = pillPos[a], [lb, wb] = pillPos[b];
    return { x: la + (lb - la) * k, w: wa + (wb - wa) * k };

  // и выезжает навстречу. Отпустили — решаем по пройденному пути и скорости броска.
  if (!inTG) {
    let sx = null, sy = 0, dx = 0, mode = 0, lockedPager = null, under = null, dim = null;
    let vx = 0, lastX = 0, lastT = 0, animating = false;
    const W = () => app.getBoundingClientRect().width || innerWidth;
    const unlockPager = () => { if (lockedPager) { lockedPager.style.overflowX = ""; lockedPager = null; } };
    function begin() {
      ROOT.classList.add("swiping");
      const e = stack[stack.length - 1];
      under = document.createElement("div");
      under.className = "under";
      under.setAttribute("aria-hidden", "true");
      under.inert = true;
      if (e && e.snap) under.appendChild(e.snap);
      dim = document.createElement("div");
      dim.className = "under-dim";
      document.body.append(under, dim);
      under.scrollTop = (e && e.y) || 0;
    }
    function setP(p) {   // 0 — экран на месте, 1 — уехал целиком
      const w = W();
      app.style.transform = `translate3d(${snap(p * w)}px,0,0)`;
      if (under) under.style.transform = `translate3d(${snap(-0.3 * w * (1 - p))}px,0,0)`;
      if (dim) dim.style.opacity = String(1 - p);
    }
    function cleanup() {
      ROOT.classList.remove("swiping");
      app.style.transform = "";
      if (under) { if (under.firstChild) under.firstChild.remove(); under.remove(); under = null; }   // снимок остаётся в стеке
      if (dim) { dim.remove(); dim = null; }
    }
    function settle(goBack) {
      animating = true;
      const w = W(), p0 = Math.max(0, Math.min(1, dx / w)), to = goBack ? 1 : 0;
      const dist = Math.abs(to - p0) * w;
      // быстрее бросили — быстрее доезжает; но не дольше 0,33 с и не резче 0,14 с
      const dur = REDUCED ? 1 : Math.max(140, Math.min(330, dist / Math.max(Math.abs(vx), 0.9)));
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);
        setP(p0 + (to - p0) * e);
        if (k < 1) { requestAnimationFrame(step); return; }
        if (!goBack) { cleanup(); animating = false; return; }
        // настоящий прошлый экран рисуем, пока он ещё скрыт снимком, и только потом убираем снимок
        Promise.resolve(back(true)).catch(() => {}).then(() => requestAnimationFrame(() => { cleanup(); animating = false; }));
      };
      requestAnimationFrame(step);
    }
    const abort = () => {   // жест прерван (второй палец, отмена, сворачивание) — экран на место
      if (animating) return;
      const was = sx !== null && mode === 1;
      sx = null; mode = 0; unlockPager();
      if (was) { vx = 0; settle(false); } else if (app.style.transform && !ROOT.classList.contains("ptr-busy") && !ROOT.classList.contains("nav-anim")) cleanup();
    };
    window.resetEdgeSwipe = () => { if (animating || mode === 1 || ROOT.classList.contains("nav-anim")) return; sx = null; unlockPager(); cleanup(); };
    document.addEventListener("touchstart", (e) => {
      if (animating) return;
      if (sx !== null) { abort(); return; }
      const t = e.touches[0];
      if (e.touches.length !== 1 || !stack.length || t.clientX > 24 || document.querySelector(".isheet")
        || ROOT.classList.contains("ptr-busy") || ROOT.classList.contains("nav-anim")) return;
      sx = t.clientX; sy = t.clientY; dx = 0; mode = 0; vx = 0; lastX = t.clientX; lastT = performance.now();
      const pg = e.target.closest && e.target.closest("[data-pager]");
      if (pg) { lockedPager = pg; pg.style.overflowX = "hidden"; }   // у края — жест «назад», а не листание дней
    }, { passive: true });
    document.addEventListener("touchmove", (e) => {
      if (sx === null) return;
      const t = e.touches[0];
      if (!t) return;
      dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if (mode === 0) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (dx > 0 && dx >= Math.abs(dy)) { mode = 1; begin(); }
        else { sx = null; unlockPager(); return; }
      }
      if (e.cancelable) e.preventDefault();
      const now = performance.now(), dt = Math.max(1, now - lastT);
      vx = 0.7 * ((t.clientX - lastX) / dt) + 0.3 * vx;   // px/мс, сглаженно
      lastX = t.clientX; lastT = now;
      setP(Math.max(0, dx) / W());
    }, { passive: false });
    document.addEventListener("touchend", (e) => {
      if (e.touches && e.touches.length) return;
      if (sx === null) return;
      const was = mode === 1;
      sx = null; mode = 0; unlockPager();
      if (!was) return;
      if (performance.now() - lastT > 80) vx = 0;   // палец остановился перед отпусканием — броска нет
      const p = Math.max(0, dx) / W();
      settle(vx > 0.45 || (p > 0.45 && vx > -0.2));
    }, { passive: true });
    document.addEventListener("touchcancel", abort, { passive: true });
    document.addEventListener("visibilitychange", () => { if (document.hidden) abort(); });
    window.addEventListener("pageshow", () => window.resetEdgeSwipe());
  }

  // --- уведомление нажали, когда приложение уже открыто ---
  if ("serviceWorker" in navigator) {
    try {
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data && e.data.type === "open" && /#notif$/.test(e.data.url || "")) { changes = null; go("notif", null, view !== "notif"); }
      });
    } catch (e) { /* старый браузер */ }
  }

  // ---------------- PWA: офлайн и установка ----------------
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
    if (document.readyState === "complete") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
};
window.__boot();
</script>
