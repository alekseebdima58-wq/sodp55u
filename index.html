<link rel="manifest" id="lnkManifest" href="manifest.webmanifest">
<link rel="icon" id="lnkFav" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" id="lnkTouch" href="icons/apple-touch-icon.png">
<script>
  // Вид иконки на рабочем столе (выбирается в настройках): blue | light | dark.
  // iPhone и Android берут иконку в момент установки — поэтому подставляем нужную сразу.
  window.applyIconStyle = function (st) {
    var suf = st === "light" ? "-light" : st === "dark" ? "-dark" : "";
    document.getElementById("lnkManifest").href = "manifest" + suf + ".webmanifest";
    document.getElementById("lnkFav").href = "icons/favicon-64" + suf + ".png";
    document.getElementById("lnkTouch").href = "icons/apple-touch-icon" + suf + ".png";
  };
  try {
    var fromUrl = new URLSearchParams(location.search).get("icon");   // выбор, сделанный внутри Telegram
    if (/^(blue|light|dark)$/.test(fromUrl || "")) localStorage.setItem("iconStyle", fromUrl);
    var st0 = localStorage.getItem("iconStyle") || fromUrl;
    if (st0) applyIconStyle(st0);
  } catch (e) { /* хранилище недоступно */ }
</script>

  (function () {
    var inTg = /tgWebApp/.test(location.hash + location.search) || !!window.TelegramWebviewProxy || window.parent !== window;
    var tgDone = !inTg, appReady = false, started = false;
    function go() { if (!started && tgDone && appReady && window.__appStart) { started = true; window.__appStart(); } }
    window.__boot = function () { appReady = true; go(); };
    if (inTg) {
      var s = document.createElement("script");
      s.src = "https://telegram.org/js/telegram-web-app.js";
      s.onload = s.onerror = function () { tgDone = true; go(); };
      document.head.appendChild(s);
      setTimeout(function () { tgDone = true; go(); }, 3000);
    }
  })();
</script>

/* ---------- основа ---------- */
* { box-sizing: border-box; }
:root { --side: 20px; }   /* поля по бокам экрана */
html, body { margin: 0; background: var(--bg); }
/* Двойное касание на iPhone не должно ничего увеличивать и прокручивать — только два обычных нажатия */
*, *::before, *::after { touch-action: manipulation; }
body {
  color: var(--text); font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg { flex: none; }
#app {
  max-width: 520px; margin: 0 auto; min-height: 100vh; overflow-x: clip;
  padding: calc(16px + var(--safe-top, 0px)) var(--side) calc(92px + max(env(safe-area-inset-bottom), var(--safe-bottom, 0px)));
}
.fade { animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }

/* ---------- шапка ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0; font-family: "Unbounded", "Onest", sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.icon-btn { width: 44px; padding: 0; color: var(--text); }
.offline {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 10px;
  border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); font-size: 12px; font-weight: 600;
}

/* ---------- неделя и дни ---------- */
.week {
  display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 2px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
}
.week button {
  width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent;
  color: var(--text); display: grid; place-items: center; padding: 0;
}
.week button:disabled { opacity: .3; cursor: default; }
.week .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.wl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 13px; }
.wl.cur { color: var(--accent); }
.wr { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.day {
  height: 58px; padding: 0; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: background .2s, border-color .2s, opacity .2s;
}
.day .s { font-size: 12px; font-weight: 500; opacity: .8; }
.day .n { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--k-bar); }
.day.dim { color: var(--muted); background: transparent; opacity: .45; }
.day.dim .dots i { background: var(--faint); }
.day.today { border-color: var(--today-border); }
.day.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day.on .dots i { background: var(--on-accent); }
.dayhead { display: flex; flex-direction: column; gap: 2px; margin: 14px 0 8px; }
.dayhead .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dayhead h2 { margin: 0; font-size: 17px; font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); }
.summary { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- лента пар ---------- */
.tl { list-style: none; margin: 0; padding: 0; }
.row, .brk { display: grid; grid-template-columns: 48px 14px minmax(0, 1fr); column-gap: 12px; }
.time { position: relative; padding-top: 0; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.time .st { font-size: 15px; font-weight: 700; line-height: 19px; }
.time .en { font-size: 13px; line-height: 16px; color: var(--muted); transition: opacity .3s ease; }
/* текущее время встало на место «10:00» — конец пары прячем, пока подпись не уедет ниже */
.row.en-off .time .en { opacity: 0; }
.row.quiet .time .en { transition: none; }
.row.live .time .st { color: var(--k-fg); }
.row.past .time .st { color: var(--past-muted); }

/* Линия пары — ровно по высоте карточки: точка у верхнего края, кружок у нижнего */
.rail { display: flex; flex-direction: column; align-items: center; isolation: isolate; padding-bottom: 3px; }
.seg-top { width: 2px; height: 3px; flex: none; background: var(--border); }
.row.first .seg-top { background: transparent; }
.row.after-past .seg-top { background: var(--done); }
.dot {
  position: relative; width: 12px; height: 12px; flex: none; border-radius: 50%;
  border: 2px solid var(--k-bar); background: var(--bg);
}
.row.live .dot { background: var(--k-bar); }
.row.past .dot { border-color: var(--done); background: var(--dot-past); }
.row.live .dot::after, .row.next .dot::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%; z-index: -1;
  background: rgba(var(--k-rgb), .45); animation: halo 2.4s ease-in-out infinite;
}
.row.next .dot::after { background: rgba(var(--k-rgb), .32); animation-duration: 4.8s; }
@keyframes halo { 0%, 100% { transform: scale(.5); opacity: .95; } 50% { transform: scale(1.2); opacity: 0; } }
.seg { position: relative; flex: 1; width: 4px; border-radius: 2px; background: rgba(var(--k-rgb), var(--track-a)); }
.row.past .seg { width: 2px; background: var(--done); }
.row.past.last .seg { background: transparent; }
.fill { position: absolute; left: 0; top: 0; width: 100%; height: var(--p); border-radius: 2px; background: var(--k-bar); transition: height .6s ease; }
.mark {

.cap {

}

.card {
  min-width: 0; margin: 3px 0; padding: 12px 14px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;

}
.row.live .card {

}

.row.past .card h3 { color: var(--past-title); }
.card.opened { cursor: pointer; }
.hd { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; min-width: 0; }

.row.live .status, .row.next .status { color: var(--k-fg); }
.kind {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 5px; border-radius: 8px;
  background: rgba(var(--k-rgb), var(--badge-a)); color: var(--k-fg); font-size: 12px; font-weight: 600;
}
.kind::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--k-bar); }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.meta { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; color: var(--text2); min-width: 0; }
.meta > span, .tlink { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.meta .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tlink { border: 0; background: none; padding: 4px 0; margin: -4px 0; color: var(--accent); }

.cc {
  min-width: 0; width: 100%; margin: 3px 0; padding: 10px 14px; border-radius: 16px; text-align: left;
  background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px;
}
.cc h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 20px; overflow-wrap: anywhere; }
.cc .ln { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
.cc .ln .bar { width: 4px; height: 12px; flex: none; border-radius: 2px; background: var(--k-bar); }
.cc .ln .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.past .cc { background: var(--past-bg); border-color: var(--past-border); }
.row.past .cc h3 { color: var(--past-title); }
.row.past .cc .ln { color: var(--past-muted); }

.brk { height: 28px; }
.brk.active { height: 44px; }
.brk .time { padding: 0; }
.rail2 { position: relative; display: flex; justify-content: center; }
.dash { width: 2px; height: 100%; background-image: repeating-linear-gradient(to bottom, var(--faint) 0 3px, transparent 3px 7px); }
.brk.active .dash { background-image: repeating-linear-gradient(to bottom, var(--text2) 0 3px, transparent 3px 7px); }
.bmark {
  position: absolute; left: 50%; top: var(--p); width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 50%; background: var(--text); border: 2px solid var(--bg); transition: top .6s ease;
}
.bnow { position: absolute; right: 0; top: var(--p); margin-top: -8px; font-size: 12px; font-weight: 700; line-height: 16px; transition: top .6s ease; }
.blbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.brk.active .blbl { color: var(--text); font-weight: 600; }

/* появление ленты при смене дня/недели */
.tl.enter .dot { animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * 90ms); }
.tl.enter .card, .tl.enter .cc { animation: rise .35s ease both; animation-delay: calc(var(--i) * 60ms); }
.tl.enter .fill { animation: grow .9s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(var(--i) * 90ms + 250ms); }
.tl.enter .mark { animation: slide .9s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(var(--i) * 90ms + 250ms); }
.tl.enter .nowlbl { animation: slide .9s cubic-bezier(.22, 1, .36, 1) both, fade .4s ease both; animation-delay: calc(var(--i) * 90ms + 250ms), calc(var(--i) * 90ms + 850ms); }
@keyframes pop { from { transform: scale(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes grow { from { height: 0; } }
@keyframes slide { from { top: 0; } }
/* Листание дней: дни лежат в горизонтальной прокрутке с защёлкиванием по страницам —
   двигает их сам телефон (как фото в «Фото»), поэтому плавно на любой скорости */
.pager {
  display: flex; margin: 0 calc(-1 * var(--side)); overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.pager::-webkit-scrollbar { display: none; }
.page {
  position: relative; isolation: isolate; flex: 0 0 100%; min-width: 0; align-self: flex-start;
  padding: 0 var(--side); display: flow-root; scroll-snap-align: center; scroll-snap-stop: always;
}
/* Пока листаем — под днями проявляются скруглённые «карточки», как при переключении приложений */
.pframe {
  position: absolute; z-index: -1; top: 4px; bottom: 0; left: 8px; right: 8px; border-radius: 26px;
  background: var(--bg); border: 1px solid var(--border); box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
  opacity: 0; pointer-events: none; will-change: opacity;
}
.page.cur.from-r { animation: inR .34s cubic-bezier(.22, 1, .36, 1) both; }
.page.cur.from-l { animation: inL .34s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes inR { from { opacity: 0; transform: translate3d(30%, 0, 0); } }
@keyframes inL { from { opacity: 0; transform: translate3d(-30%, 0, 0); } }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px 24px; }
.empty .ic {
  width: 64px; height: 64px; margin-bottom: 6px; border-radius: 20px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text2); display: grid; place-items: center;
}
.empty .h { font-size: 18px; font-weight: 600; }
.empty .p { max-width: 260px; font-size: 14px; line-height: 1.45; color: var(--muted); }

.sk {
  height: 76px; margin-top: 10px; border-radius: 18px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- преподаватели ---------- */
.search {
  display: flex; align-items: center; gap: 10px; height: 48px; margin-top: 16px; padding: 0 14px;
  border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--muted);
}
.search input {
  flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent;
  color: var(--text); font: inherit; font-size: 15px;
}
.search input::placeholder { color: var(--muted); }
.sec { margin: 20px 4px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
.item {
  width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border: 0; border-top: 1px solid var(--sep); background: transparent; color: var(--text); text-align: left;
}
.list > .item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .nm { font-size: 15px; font-weight: 600; }
.item .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chev { color: var(--faint); }
.av {
  width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center;
  font-family: "Unbounded", "Onest", sans-serif; font-size: 13px; font-weight: 600;
  background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) var(--avf-s) var(--avf-l));
}
.av.big { width: 56px; height: 56px; border-radius: 18px; font-size: 18px; }
.nothing { padding: 18px 14px; font-size: 14px; color: var(--muted); }
.tcard {
  display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
}
.tcard .nm { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; }
.tcard .sub { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.4; }

/* ---------- уведомления ---------- */
.bell { position: relative; }
.bell .badge {
  position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px var(--surface);
}
.nitem { align-items: flex-start; padding: 14px; }
.nitem.unread { background: var(--unread); }
.nitem.unread .nm { font-weight: 700; }
.tile { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; }
.t-cancel { background: var(--red-bg); color: var(--red-fg); }
.t-add { background: var(--tag-bg); color: var(--tag-fg); }
.t-room { background: var(--acc-soft); color: var(--accent); }
.t-other { background: var(--warn-bg); color: var(--warn-fg); }
.nitem .nm { font-weight: 600; line-height: 1.3; }
.nitem .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.nitem .when { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nitem .desc { font-size: 13px; line-height: 1.4; color: var(--text2); white-space: normal; }
.kv { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-top: 1px solid var(--sep); }
.list > .kv:first-child { border-top: 0; }
.kv .k { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.kv .v { flex: none; font-size: 14px; color: var(--muted); }
.kv .v.on { color: var(--text); font-weight: 600; }
.srow { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid var(--sep); }
.list > .srow:first-child { border-top: 0; }
.srow .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow .nm { font-size: 15px; font-weight: 600; }
.srow .sub { font-size: 12px; color: var(--muted); }
.sw { width: 60px; height: 44px; flex: none; padding: 0; border: 0; background: transparent; display: grid; place-items: center; }
.sw .tr { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--strong); transition: background .2s; }
.sw .kn {
  position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s;
}
.sw[aria-checked="true"] .tr { background: var(--accent); }
.sw[aria-checked="true"] .kn { transform: translateX(20px); }
.sw:disabled { opacity: .45; cursor: default; }
.selrow { display: flex; align-items: center; gap: 12px; padding: 0 14px 12px 16px; font-size: 14px; color: var(--text2); }
.selrow[hidden] { display: none; }
.selrow span { flex: 1; }
.nsel {
  height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong);
  background: var(--surface2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
}
.nstatus { margin: 8px 4px 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.nstatus.ok { color: var(--tag-fg); }
.nstatus.err { color: var(--red-fg); }
.hint { margin: 12px 4px 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
/* Пустой экран уведомлений: всё по центру, блок — посередине свободного места */
#app.fill { display: flex; flex-direction: column; }
.nempty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px 0 6vh; }
.nempty .empty { padding: 0 16px; }
.nempty .hint { max-width: 330px; margin: 24px auto 0; text-wrap: balance; }
.nempty .empty .p { text-wrap: balance; }
.nempty .btn.wide { max-width: 360px; margin-top: 24px; }
.nfoot { margin-top: 16px; }
.btn.wide { width: 100%; margin-top: 12px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------- настройки ---------- */
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.lbl15 { font-size: 15px; font-weight: 500; }
.seg3 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); }
.seg3 button { height: 40px; padding: 0 4px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.seg3 button.on { background: var(--surface2); border-color: var(--border); color: var(--text); }
html[data-theme="light"] .seg3 button.on { background: var(--surface); }
.foot { margin: 22px 0 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); }
.flink { border: 0; background: none; padding: 6px 2px; margin: -6px 0; color: var(--accent); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + max(env(safe-area-inset-bottom), var(--safe-bottom, 0px))); transform: translateX(-50%);
  padding: 10px 16px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
  animation: fade .2s ease both; z-index: 20;
}

/* Во весь экран сверху — часы телефона и кнопки Telegram «Закрыть» / «⋯». Под ними сплошная полоса
   цвета фона (с мягким краем), чтобы прокрученный текст не залезал под них. */
.topveil { display: none; }
.fs .topveil { display: block; position: fixed; left: 0; right: 0; top: 0; height: var(--safe-top, 0px); z-index: 9; background: var(--bg); }
.fs .topveil::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; background: linear-gradient(var(--bg), rgba(0, 0, 0, 0)); pointer-events: none; }

/* ---------- нижняя панель ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--tab-bg); border-top: 1px solid var(--tab-border);
  padding: 8px 8px max(12px, env(safe-area-inset-bottom), var(--safe-bottom, 0px));
}
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tab {
  min-height: 48px; border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.tab.on { color: var(--accent); font-weight: 600; }


/* ================= Оформление 2.0 =================
   Меньше рамок: блоки отделяются тоном фона и мягкой тенью. Крупнее заголовки и номер аудитории,
   дни недели — единой «дорожкой», нижняя панель — плавающая полупрозрачная, как в iOS. */
.btn { border-color: var(--hair); box-shadow: var(--elev); }
.icon-btn { border-radius: 50%; }
.btn.wide { border-radius: 16px; box-shadow: 0 8px 22px -10px rgba(var(--acc-rgb), .8); }

/* неделя: заголовок слева, стрелки — круглые кнопки справа */
.week { margin-top: 18px; padding: 0; gap: 8px; background: transparent; border: 0; }
.week .mid { order: -1; align-items: flex-start; gap: 1px; }
.week button { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); box-shadow: var(--elev); }
.wl { font-size: 12px; letter-spacing: .04em; }
.wr { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

/* дни — одна дорожка, выбранный день — плотная капсула */
.days { gap: 2px; margin-top: 12px; padding: 4px; border-radius: 22px; background: var(--surface); box-shadow: var(--elev); border: 1px solid var(--hair); }
.day { height: 56px; border-radius: 18px; border-color: transparent; background: transparent; }
.day .s { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; opacity: .65; }
.day .n { font-size: 18px; }
.day.today { border-color: transparent; }
.day.today:not(.on) .n, .day.today:not(.on) .s { color: var(--accent); opacity: 1; }
.day.on { box-shadow: 0 6px 18px -6px rgba(var(--acc-rgb), .75); }
.day.on .s { opacity: .85; }
.dayhead { margin: 20px 2px 10px; gap: 3px; }
.dayhead h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.tag { background: rgba(var(--acc-rgb), .14); color: var(--accent); }

/* карточки пар */
.card { padding: 14px 16px; border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); gap: 9px; }
.card h3 { font-size: 17px; letter-spacing: -.005em; }
.row.live .card { border-color: rgba(var(--k-rgb), .38); box-shadow: 0 14px 34px -18px rgba(var(--k-rgb), .7), var(--elev); }
.row.next .card { border-color: rgba(var(--k-rgb), .22); }
.row.past .card, .row.past .cc { border-color: transparent; box-shadow: none; }
.kind { border-radius: 999px; padding: 4px 10px 4px 7px; }
.kind::before { width: 6px; height: 6px; border-radius: 50%; }
.meta { gap: 5px; font-size: 13.5px; }
.meta > span:first-child { color: var(--text); font-weight: 600; }   /* аудитория — то, куда идти */
.cc { border-radius: 18px; border-color: var(--hair); box-shadow: var(--elev); padding: 11px 14px; }
.blbl { font-size: 12.5px; }

/* списки и поиск */
.search { height: 50px; border-radius: 16px; border-color: var(--hair); box-shadow: var(--elev); }
.list { border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); }
.item { position: relative; border-top: 0; }
.list > .item + .item::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); }
.av { border-radius: 50%; }
.av.big { border-radius: 50%; }
.tcard { border-radius: 24px; border-color: var(--hair); box-shadow: var(--elev); }
.empty .ic { border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); }
.seg3 { border-radius: 16px; }
.seg3 button { border-radius: 12px; }
.sec { margin: 24px 6px 8px; }

/* нижняя панель — плавающая капсула над полоской «домой» */
.tabs {
  left: 12px; right: 12px; bottom: max(10px, env(safe-area-inset-bottom), var(--safe-bottom, 0px));
  max-width: 496px; margin: 0 auto; padding: 6px; border-radius: 28px;
  background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
}
.tab { min-height: 52px; border-radius: 22px; transition: background .2s, color .2s; }
.tab.on { background: rgba(var(--acc-rgb), .14); }
html[data-theme="light"] .tab.on { color: #1E54C4; }   /* контраст подписи ≥ 4.5:1 на подсветке */


/* шапка: над заголовком везде название группы; у расписания заголовок — неделя, рядом стрелки и колокольчик */
h1 { font-size: 24px; margin-top: 4px; }
.whead { margin-top: 0; align-items: center; gap: 10px; }
.whead .ht { flex: 1; min-width: 0; }
.whead .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.whead .eyebrow .wl { font-size: inherit; letter-spacing: inherit; }
h1.wr { font-family: inherit; font-size: clamp(18px, 5.6vw, 22px); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.whead .top-actions { gap: 6px; flex: none; }
.whead .top-actions .wbtn, .whead .top-actions .icon-btn { width: 40px; height: 40px; }
.wbtn { flex: none; border: 1px solid var(--hair); border-radius: 50%; background: var(--surface); box-shadow: var(--elev); color: var(--text); display: grid; place-items: center; padding: 0; }
.wbtn:disabled { opacity: .3; cursor: default; }
.whead + .days, .whead + .offline + .days { margin-top: 14px; }

/* свёрнутая карточка: тип — цветной точкой, как в раскрытой; аудитория — жирная, как в раскрытой */
.cc .ln .bar { width: 6px; height: 6px; border-radius: 50%; }
.cc .rm { font-weight: 600; color: var(--text); }
.row.past .cc .rm, .row.past .meta > span:first-child { color: var(--past-title); }


/* ================= Стиль «Глубокий чёрный» =================
   Тёмная тема: чистый чёрный фон (на OLED-экране iPhone чёрные точки не светятся), неоновые цвета пар и свечение.
   Светлая — зеркально: чистый белый фон, насыщенные цвета, вместо свечения цветная тень. */
html[data-theme="dark"] {
  --bg: #000000; --surface: #0D0E11; --surface2: #15171B; --border: #1C1F24; --sep: #17191D; --strong: #2A2D33;
  --hair: rgba(255, 255, 255, .09); --tab-bg: #08090B; --tab-border: #17191D;
  --accent: #4DA3FF; --acc-rgb: 77, 163, 255; --on-accent: #000000; --acc-soft: #0F1D30;
  --lec-fg: #5CFFB4; --lec-bar: #1FF29A; --lec-rgb: 31, 242, 154;
  --prac-fg: #FFC861; --prac-bar: #FFB02E; --prac-rgb: 255, 176, 46;
  --lab-fg: #CDB0FF; --lab-bar: #A36CFF; --lab-rgb: 163, 108, 255;
  --oth-fg: #7FDBFF; --oth-bar: #33C8FF; --oth-rgb: 51, 200, 255;
  --past-bg: #07080A; --past-border: #121418; --dot-past: #24272D;
  --glass: rgba(8, 9, 11, .96); --glass-border: rgba(255, 255, 255, .08); --tint-a: .06;
  --glow-card: 0 0 30px -8px; --glow-a: .55; --glow-line: 0 0 12px; --glow-day: 0 0 22px -4px;
}
html[data-theme="light"] {
  --bg: #FFFFFF; --surface: #F5F6F8; --surface2: #ECEEF2; --border: #E6E8EC; --sep: #E9EBEF; --strong: #D5D8DE;
  --hair: rgba(0, 0, 0, .05); --elev: none; --tab-bg: #FFFFFF; --tab-border: #E9EBEF;
  --accent: #0A6CFF; --acc-rgb: 10, 108, 255; --on-accent: #FFFFFF; --acc-soft: #E5EFFF;
  --lec-fg: #00733F; --lec-bar: #00C875; --lec-rgb: 0, 200, 117;
  --prac-fg: #A35600; --prac-bar: #FF9500; --prac-rgb: 255, 149, 0;
  --lab-fg: #6526E0; --lab-bar: #8E4DFF; --lab-rgb: 142, 77, 255;
  --oth-fg: #006C99; --oth-bar: #14A7E8; --oth-rgb: 20, 167, 232;
  --past-bg: #FAFAFB; --past-border: #F0F1F4;
  --glass: rgba(255, 255, 255, .96); --glass-border: rgba(0, 0, 0, .06); --glass-shadow: 0 10px 30px rgba(0, 0, 0, .10);
  --tint-a: .08;
  --glow-card: 0 14px 30px -12px; --glow-a: .5; --glow-line: 0 2px 8px; --glow-day: 0 8px 20px -6px;
}
.row.live .card { border-color: rgba(var(--k-rgb), .6); box-shadow: var(--glow-card) rgba(var(--k-rgb), var(--glow-a)); }
.row.live .fill, .row.live .mark, .row.live .dot { box-shadow: var(--glow-line) rgba(var(--k-rgb), .85); }
.day.on { box-shadow: var(--glow-day) rgba(var(--acc-rgb), .9); }
.kind { box-shadow: inset 0 0 0 1px rgba(var(--k-rgb), .4); }
html[data-theme="light"] .tab.on { color: #0050CC; }
html[data-theme="light"] .seg3 { background: var(--surface2); }
html[data-theme="light"] .seg3 button.on { background: #FFFFFF; border-color: transparent; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
html[data-theme="light"] .day.today:not(.on) .n, html[data-theme="light"] .day.today:not(.on) .s { color: #0050CC; }

/* Узкие телефоны (360–380 px): чуть меньше полей, чтобы статус пары и подписи не обрезались */
@media (max-width: 380px) {
  .whead .grp { display: none; }
  .whead .eyebrow { font-size: 11px; letter-spacing: .03em; }
  .whead .top-actions { gap: 4px; }   /* в шапке остаётся «Эта неделя» — длинное «Следующая неделя» иначе обрезается */
  :root { --side: 14px; }
  .row, .brk { column-gap: 10px; }
  .card { padding: 12px; }
  .seg3 button { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ================= Современный вид 2026 ================= */

/* --- цвета типов пар (из макета): полоска — насыщенный цвет, подложка — светлая заливка --- */
html[data-theme="light"] {
  --lec-bar: #55B685; --lec-rgb: 85, 182, 133;  --lec-fg: #1F7A4C;  --lec-soft: #EFFDF5;
  --prac-bar: #E9A23B; --prac-rgb: 233, 162, 59; --prac-fg: #965A00; --prac-soft: #FEFBED;
  --lab-bar: #845EEE; --lab-rgb: 132, 94, 238;  --lab-fg: #5B34D6;  --lab-soft: #F5F3FE;
  --oth-soft: #EDF7FC;
}
html[data-theme="dark"] {
  --lec-bar: #55B685; --lec-rgb: 85, 182, 133;  --lec-fg: #7FD6AA;  --lec-soft: rgba(85, 182, 133, .16);
  --prac-bar: #E9A23B; --prac-rgb: 233, 162, 59; --prac-fg: #F2BD6B; --prac-soft: rgba(233, 162, 59, .16);
  --lab-bar: #845EEE; --lab-rgb: 132, 94, 238;  --lab-fg: #AD92FF;  --lab-soft: rgba(132, 94, 238, .18);
  --oth-soft: rgba(51, 200, 255, .14);
}
.k-lec  { --k-soft: var(--lec-soft); }
.k-prac { --k-soft: var(--prac-soft); }
.k-lab  { --k-soft: var(--lab-soft); }
.k-oth  { --k-soft: var(--oth-soft); }
/* чип типа — как в легенде: скруглённая полоска цвета + светлая заливка */
.kind { background: var(--k-soft); color: var(--k-fg); box-shadow: none; border-radius: 8px; padding: 4px 10px 4px 6px; }
.kind::before { display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--k-bar); }
html[data-theme="light"] .row.live .card { background: var(--k-soft); }
html[data-theme="light"] .hero { background: radial-gradient(130% 150% at 0% 0%, rgba(var(--k-rgb), .16), rgba(var(--k-rgb), 0) 70%), var(--k-soft); }

/* --- «жидкое стекло»: нижняя панель просвечивает и размывает то, что под ней --- */
.tabs {
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 55%),
              color-mix(in srgb, var(--tab-bg) 58%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 14px 36px rgba(0, 0, 0, .55);
}
html[data-theme="light"] .tabs {
  background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 60%), rgba(255, 255, 255, .62);
  border-color: rgba(0, 0, 0, .06);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 10px 30px rgba(0, 0, 0, .12);
}
.tab.on { background: rgba(var(--acc-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--acc-rgb), .18); }

/* --- липкая шапка: дни прилипают сверху на стекле, заголовок недели сжимается --- */
.sbar {
  position: sticky; top: var(--safe-top, 0px); z-index: 8;
  margin: -10px calc(-1 * var(--side)) -10px; padding: 10px var(--side);
  transition: background-color .25s ease, box-shadow .25s ease;
}
/* фон шапки — сплошной: при прокрутке текст ленты не должен просвечивать под «СОДП-55у» и днями */
.sbar { background: var(--bg); }
.sbar.stuck { box-shadow: 0 1px 0 var(--hair); }
.sbar.stuck .days { background: var(--surface); }
.sbar .eyebrow { max-height: 18px; transition: max-height .25s ease, opacity .2s ease; }
.sbar h1.wr, .sbar .wbtn, .sbar .icon-btn, .sbar .day { transition: font-size .25s ease, width .25s ease, height .25s ease; }

      const p = st === "live" ? Math.min(100, Math.max(0, Math.round((now.sec - s) / (e - s) * 100))) : 0;
      let statusText;
      if (st === "live") statusText = `Идёт · ещё ${dur(e - now.sec)}`;
      else if (st === "next") statusText = `Через ${dur(s - now.sec)}`;
      else if (st === "past") statusText = "Прошла";
      else statusText = l.number && l.number !== "?" ? `${l.number} пара` : (s != null && e != null ? dur(e - s) : "");
      const teacher = isTeacher ? null : matchTeacher(l.extra);
      items.push({
        type: "lesson", i, key, st, k, compact, p, statusText,
        start: l.start || "", end: l.end || "", time: l.time || "",
        subject: l.subject || "Занятие", room: roomText(l.room), extra: (l.extra || "").trim(), teacher,
        first: i === 0, last: i === n - 1, afterPast: i > 0 && status[i - 1] === "past" && isToday,
        showNow: st === "live", nowLabel: now.label,
        ctl: controlOf(l.subject, date, isTeacher, l.extra),
        col: k.cls,
      });
    });

    // Блок «Сейчас» наверху сегодняшнего дня: идущая пара, перерыв или ожидание первой пары
    let hero = null;
    if (isToday) {
      const ls = items.filter((x) => x.type === "lesson");
      const live = ls.find((x) => x.st === "live");
      const up = ls.filter((x) => { const s = toSec(x.start); return s != null && s > now.sec; });
      const brk = items.find((x) => x.type === "break" && x.active);
      if (live && toSec(live.end) != null) {
        hero = { mode: "live", main: live, left: toSec(live.end) - now.sec, p: live.p, next: up[0] || null, from: live.start, to: live.end };
      } else if (up.length) {
        const prev = brk ? ls.find((x) => x.i === brk.i - 1) : null;
        hero = { mode: brk ? "break" : "before", main: up[0], left: toSec(up[0].start) - now.sec, p: brk ? brk.p : 0, next: up[1] || null,
          from: prev ? prev.end : "", to: up[0].start };
      }
      // Пара из блока «Сейчас» в ленте сворачивается, чтобы не дублировать её (раскрывается нажатием)
      if (hero && !opened.has(hero.main.key)) hero.main.compact = true;
    }

    let summary = "";
    if (n) {
      const starts = lessons.map((l) => l.start).filter(Boolean);
      const ends = lessons.map((l) => l.end).filter(Boolean);
      summary = `${n} ${plural(n, "пара", "пары", "пар")}`;
      if (starts.length && ends.length) summary += ` · ${starts[0]} – ${ends[ends.length - 1]}`;
      if (isToday && status.every((x) => x === "past")) summary += " · пары закончились";
    }
    const sig = [date, now.date, status.join(","), activeBreak, items.filter((x) => x.showNow).length,
      [...opened].join(",")].join("|");
    return { date, isToday, isPastDay, n, items, summary, sig, hero };
  }

  function heroLeft(h) {
    const m = Math.max(1, Math.ceil(h.left / 60));
    if (m < 100) return { big: String(m), unit: "мин", text: `${m} мин` };
    const hh = Math.floor(m / 60), mm = m % 60;
    return { big: `${hh} ч`, unit: mm ? `${mm} мин` : "ровно", text: mm ? `${hh} ч ${mm} мин` : `${hh} ч` };
  }
  function heroHTML(h) {
    const t = heroLeft(h);
    const label = h.mode === "live" ? `Сейчас · ${h.main.k.label}` : h.mode === "break" ? "Перерыв · дальше" : (h.main.first ? "Первая пара" : "Следующая пара");
    const [roomMain, ...roomRest] = (h.main.room || "").split(" · ");
    const tail = h.mode === "live" ? `до ${h.main.end}` : `начало в ${h.main.start}`;
    const sub = [roomRest.join(" · "), tail].filter(Boolean).join(" · ");
    const nx = h.next;
    const next = nx ? `<div class="hn ${nx.col}"><i></i><span class="x">Дальше <b>${esc(nx.start)}</b> · ${esc(nx.subject)}${nx.room ? " · " + esc(nx.room.split(" · ")[0]) : ""}</span></div>` : "";
    const info = `<div class="hb"><span class="hl">${esc(label)}</span><h3>${esc(h.main.subject)}</h3>
        <div class="hr"><b>${esc(roomMain || "аудитория не указана")}</b><span>${esc(sub)}</span></div></div>`;
    // ring: ровная дуга без свечения, pathLength=100 — дуга ровно p%
    const vis = `<div class="ring" aria-hidden="true"><svg viewBox="0 0 80 80"><circle class="trk" cx="40" cy="40" r="34" pathLength="100"/>
        ${h.p > 0 ? `<circle class="arc" data-hfill cx="40" cy="40" r="34" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:${100 - h.p}"/>` : ""}</svg>
        <span class="rv"><b data-hbig>${t.big}</b><small data-hunit>${t.unit}</small></span></div>`;
    return `<section class="hero hv-ring ${h.main.col} ${h.mode}" data-hero>${vis}${info}${next}</section>`;
  }

  function emptyHint(data, w, d, isPastDay) {
    if (isPastDay) return "В этот день занятий не было.";
    for (let wi = w; wi < data.weeks.length; wi++) {
      for (let di = wi === w ? d + 1 : 0; di < 7; di++) {
        if (lessonsOf(data.weeks[wi], di).length) {
          return `Свободный день. Следующие пары — ${WHEN[di]}, ${fmtDate(addDays(data.weeks[wi].monday, di))}.`;
        }
      }
    }
    return "Свободный день. Дальше в расписании пар пока нет.";
  }

  function weekLabel(monday) {
    const cur = mondayOf(samaraNow().date);
    const diff = Math.round((toUTC(monday) - toUTC(cur)) / (7 * 86400000));
    return { "-1": "Прошлая неделя", "0": "Эта неделя", "1": "Следующая неделя", "2": "Через неделю" }[diff] || "";
  }
  function weekRange(monday) {
    const a = toUTC(monday), b = toUTC(addDays(monday, 6));
    return a.getUTCMonth() === b.getUTCMonth()
      ? `${a.getUTCDate()} – ${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`
      : `${a.getUTCDate()} ${MSHORT[a.getUTCMonth()]} – ${b.getUTCDate()} ${MSHORT[b.getUTCMonth()]}`;
  }

  // ---------------- разметка ----------------
  function skeletonHTML() {
    return `<div class="top"><div><div class="eyebrow">${esc((index && index.group) || "СОДП-55у")}</div><h1>Расписание</h1></div></div>

  function lessonHTML(it, n, isTeacher) {
    const cls = ["row", it.st, it.col, it.first ? "first" : "", it.last ? "last" : "", it.afterPast ? "after-past" : ""].join(" ");
    let rail = `<span class="seg-top"></span><span class="dot"></span><span class="seg" style="--p:${it.p}%">`;
    if (it.st === "live") {
      rail += `<span class="fill"></span><span class="mark"></span>`
        + `<span class="nowlbl" data-nowlbl${it.showNow ? "" : " hidden"}>${esc(it.nowLabel)}</span>`;
    }
    if (it.st !== "past") rail += `<span class="cap"></span>`;
    rail += `</span>`;

    let body;
    if (it.compact) {
      const lead = it.st === "past" ? I.check : `<span class="bar"></span>`;
      const who = isTeacher ? it.extra : (it.teacher ? shortName(it.teacher.name) : it.extra);
      const room = it.room ? `<b class="rm">${esc(it.room)}</b>` : "";
      const parts = it.st === "past" ? [esc(it.k.label), room]
        : it.st === "live" ? [esc("Идёт"), esc(it.k.label), room]
        : it.st === "next" ? [esc("Следующая"), esc(it.k.label), room]
        : [esc(it.k.label), room, esc(who || "")];
      body = `<button class="cc" data-act="open" data-key="${esc(it.key)}" aria-expanded="false">
        <h3>${esc(it.subject)}</h3><span class="ln">${lead}<span class="x">${parts.filter(Boolean).join(" · ")}</span></span></button>`;
    } else {
      let meta = it.room ? `<span>${I.pin}<span class="x">${esc(it.room)}</span></span>` : "";
      let who = "";
      if (isTeacher) {
        if (it.extra) who = `<span>${I.users}<span class="x">${esc(it.extra)}</span></span>`;
      } else if (it.teacher) {
        who = `<button class="tlink" data-act="teacher" data-t="${esc(it.teacher.id)}">${I.user}<span class="x">${esc(shortName(it.teacher.name))}</span></button>`;
      } else if (it.extra) {
        who = `<span>${I.user}<span class="x">${esc(it.extra)}</span></span>`;
      }
      // Форма контроля — тихим чипом справа в последней строке, а не отдельной строкой «Сессия: …»
      const ctl = it.ctl ? `<span class="ctlchip" title="${esc(it.ctl.text)}" aria-label="${esc(it.ctl.text)}">${esc(it.ctl.short)}</span>` : "";
      meta += ctl ? `<div class="mrow">${who}${ctl}</div>` : who;
      const isOpened = opened.has(it.key);
      body = `<div class="card${isOpened ? " opened" : ""}"${isOpened ? ` data-act="open" data-key="${esc(it.key)}"` : ""}>
        <div class="hd"><span class="status" data-status>${esc(it.statusText)}</span><span class="kind">${esc(it.k.label)}</span></div>
        <h3>${esc(it.subject)}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}</div>`;
    }
    return `<li class="${cls}" style="--i:${n}" data-row="${it.i}">
      <div class="time"><span class="st">${esc(it.start || it.time || "—")}</span><span class="en">${esc(it.end)}</span></div>
      <div class="rail">${rail}</div>${body}</li>`;
  }

  function breakHTML(it) {
    return `<li class="brk${it.active ? " active" : ""}" style="--p:${it.p}%" data-brk="${it.i}" aria-hidden="${it.active ? "false" : "true"}">
      <div class="time">${it.active ? `<span class="bnow" data-bnow>${esc(it.nowLabel)}</span>` : ""}</div>
      <div class="rail2"><span class="dash"></span>${it.active ? `<span class="bmark"></span>` : ""}</div>
      <div class="blbl">${I.cup}<span data-btext>Перерыв · ${esc(it.text)}</span></div></li>`;
  }

  const PAGER_SPAN = 3;
  // Сосед через n дней (dir = ±n): шагаем по одному, пока не кончатся недели
  function stepPos(data, p, dir) {
    let q = p;
    for (let k = 0; k < Math.abs(dir) && q; k++) q = neighborPos(data, q.w, q.d, Math.sign(dir));
    return q;
  }
  function neighborPos(data, w, d, dir) {
    let nw = w, nd = d + dir;
    if (nd > 6) { if (nw >= data.weeks.length - 1) return null; nw += 1; nd = 0; }
    if (nd < 0) { if (nw <= 0) return null; nw -= 1; nd = 6; }
    return { w: nw, d: nd };
  }
  function dayBodyHTML(data, w, d, isTeacher, enter, model) {
    const m = model || dayModel(data, w, d, isTeacher);
    let html = `<div class="dayhead"><div class="t"><h2>${DAYS[d]}, ${fmtDate(m.date)}</h2>${m.isToday ? `<span class="tag">сегодня</span>` : ""}</div>
      ${m.summary ? `<span class="summary" data-summary>${esc(m.summary)}</span>` : ""}</div>`;
    if (m.hero) html += heroHTML(m.hero);
    if (m.n) {
      let n = 0;
      html += `<ol class="tl${enter ? " enter" : ""}">`;
      for (const it of m.items) html += it.type === "break" ? breakHTML(it) : lessonHTML(it, n++, isTeacher);
      html += `</ol>`;
    } else {
      html += `<div class="empty"><div class="ic">${I.moon}</div><div class="h">Пар нет</div>
        <div class="p">${esc(emptyHint(data, w, d, m.isPastDay))}</div></div>`;
    }
    return html;
  }
  function scheduleHTML(data, id, isTeacher) {
    const p = pos[id];
    const week = data.weeks[p.w];
    const m = dayModel(data, p.w, p.d, isTeacher);
    const now = samaraNow();
    const def = pickDefault(data);
    const notToday = !(p.w === def.w && p.d === def.d && m.isToday);
    const todayInData = data.weeks.some((x) => x.monday === mondayOf(now.date));

    const label = weekLabel(week.monday);
    const prevW = `<button class="wbtn" data-act="week" data-dir="-1" aria-label="Предыдущая неделя"${p.w <= 0 ? " disabled" : ""}>${I.left}</button>`;
    const nextW = `<button class="wbtn" data-act="week" data-dir="1" aria-label="Следующая неделя"${p.w >= data.weeks.length - 1 ? " disabled" : ""}>${I.right}</button>`;
    const wl = `<span class="wl${label === "Эта неделя" ? " cur" : ""}">${esc(label)}</span>`, wr = esc(weekRange(week.monday));
    // У преподавателя неделя — отдельной строкой под его карточкой; у группы она в шапке (см. renderSchedule)
    let bar = isTeacher ? `<div class="week"><div class="mid" aria-live="polite">${wl}<span class="wr">${wr}</span></div>${prevW}${nextW}</div>` : "";

    bar += `<nav class="days" aria-label="Дни недели">`;
    for (let d = 0; d < 7; d++) {
      const date = addDays(week.monday, d);
      const ls = lessonsOf(week, d);
      const on = d === p.d, today = date === now.date, dim = date < now.date && !on;
      const dots = ls.slice(0, 4).map((l) => `<i class="${kindOf(l.type).cls}"></i>`).join("");
      const aria = `${DAYS[d]}, ${fmtDate(date)}${today ? ", сегодня" : ""}, ${ls.length ? ls.length + " " + plural(ls.length, "пара", "пары", "пар") : "пар нет"}`;
      bar += `<button class="day${on ? " on" : ""}${today ? " today" : ""}${dim ? " dim" : ""}" data-act="day" data-d="${d}" aria-pressed="${on}" aria-label="${esc(aria)}">
        <span class="s">${SHORT[d]}</span><span class="n">${dayNum(date)}</span><span class="dots">${dots}</span></button>`;
    }
    bar += `</nav>`;

    // Текущий день и по PAGER_SPAN соседей с каждой стороны — лежат за краями экрана.
    // Запас нужен для быстрых свайпов подряд: лента успевает уехать на 2–3 дня, пока не «переложилась».
    const fr = `<div class="pframe" aria-hidden="true"></div>`;
    const side = (dir) => { const out = []; let q = p; for (let k = 0; k < PAGER_SPAN && (q = neighborPos(data, q.w, q.d, dir)); k++) out.push(q); return out; };
    // Сразу строим только выбранный день — так переход лёгкий. Соседей для свайпа достраиваем
    // чуть позже или в момент касания ленты (fillNeighbors).
    let html = `<div class="pager" data-pager>`;
    html += `<div class="page cur${slideDir > 0 ? " from-r" : slideDir < 0 ? " from-l" : ""}" data-cur>${fr}${dayBodyHTML(data, p.w, p.d, isTeacher, enterNext, m)}</div>`;
    html += `</div>`;
    pendingNeighbors = () => {
      const page = (q, cls) => `<div class="page ${cls}" aria-hidden="true" inert>${fr}${dayBodyHTML(data, q.w, q.d, isTeacher, false)}</div>`;
      return { prev: side(-1).reverse().map((q) => page(q, "prev")).join(""), next: side(1).map((q) => page(q, "next")).join("") };
    };
    liveSig = m.sig;
    return { html, bar, notToday: notToday && todayInData, wl, wr, prevW, nextW, isCur: label === "Эта неделя" };
  }

  // ---------------- экраны ----------------
  function render() {
    const token = ++renderToken;
    app.classList.remove("fill");
    if (view === "settings") return renderSettings();
    if (view === "teachers") return renderTeachers(token);
    if (view === "notif") return renderNotif(token);
    return renderSchedule(token);
  }

  // ---------------- уведомления ----------------
  function changeItems() { return changes && Array.isArray(changes.items) ? changes.items : []; }
  function hasUnseen() {
    const items = changeItems();
    if (!items.length) return false;
    const seen = store.get("seenChanges") || "";
    return items[items.length - 1].ts > seen;
  }
  function openNotifySettings() {
    const bot = (index && index.bot) || "sodp55u_bot";
    const url = `https://t.me/${bot}?start=notify`;
    haptic("light");
    if (inTG && tgAtLeast("6.1")) { try { tg.openTelegramLink(url); return; } catch (e) { /* ниже — обычная ссылка */ } }

  const CHANGE_VIEW = {
    cancel: { tile: "t-cancel", icon: "xc", title: "Пара отменена" },
    add: { tile: "t-add", icon: "plus", title: "Добавлена пара" },
    replace: { tile: "t-other", icon: "swap", title: "Замена пары" },

  };
  function changeHTML(c, unread) {
    const v = CHANGE_VIEW[c.kind] || CHANGE_VIEW.type;
    const when = `${SHORT[weekday(c.date)]}, ${fmtDate(c.date)}${c.start ? ", " + c.start : ""}`;

    const ts = String(c.ts || "");

      <span class="body"><span class="row1"><span class="nm">${v.title}</span><span class="when">${esc(posted)}</span></span>
      <span class="desc">${esc(when)} · ${esc(what)}</span></span></button>`;

  async function renderNotif(token) {
    if (!changes) {
      app.innerHTML = skeletonHTML();
      try { changes = await fetchJSON("data/changes.json"); } catch (e) { changes = { items: [] }; }
      if (token !== renderToken) return;
    }
    const items = changeItems().slice().reverse();
    const seen = store.get("seenChanges") || "";
    const today = samaraNow().date, yesterday = addDays(today, -1);
    const groups = [["Сегодня", []], ["Вчера", []], ["Ранее", []]];
    for (const c of items) {
      const d = String(c.ts || "").slice(0, 10);
      groups[d === today ? 0 : d === yesterday ? 1 : 2][1].push(c);
    }
    const backBtn = inTG ? "" : `<button class="btn icon-btn" data-act="back" aria-label="Назад">${I.left}</button>`;
    let html = `<div class="top"><div style="display:flex;align-items:center;gap:10px">${backBtn}<div><div class="eyebrow">${esc((index && index.group) || "СОДП-55у")}</div><h1>Уведомления</h1></div></div></div>`;
    const foot = `<button class="btn wide" data-act="to-settings">${I.bell}Настроить уведомления</button>`;
    if (!items.length) {
      // Пусто: колокольчик, текст и кнопка — одним блоком посередине экрана
      html += `<div class="nempty"><div class="empty"><div class="ic">${I.bellBig}</div><div class="h">Уведомлений пока нет</div>
        <div class="p">Отмены, замены и смену аудиторий покажем здесь.</div></div>${foot}</div>`;
    } else {
      for (const [title, list] of groups) {
        if (!list.length) continue;
        html += `<h2 class="sec">${title}</h2><div class="list">${list.map((c) => changeHTML(c, String(c.ts) > seen)).join("")}</div>`;
      }
      html += `<div class="nfoot">${foot}</div>`;
    }
    app.classList.toggle("fill", !items.length);
    app.innerHTML = html;
    if (items.length) store.set("seenChanges", String(items[0].ts));
  }
  function canEditNotify() {

  function notifSettingsHTML() {

      return `<div class="list"><button class="item" data-act="notify-settings"><span class="body"><span class="nm" style="font-weight:500">Настроить в чате с ботом</span>

    const status = canEditNotify()

  // Подписываем настройки личным ключом и кладём в канал — бот заберёт их за пару секунд
  let saveTimer = null;
  function setNStatus(html, kind) {
    const el = document.getElementById("nstatus");
    if (!el) return;
    el.className = "nstatus" + (kind ? " " + kind : "");

  async function hmacHex(keyHex, msg) {
    const raw = new Uint8Array(keyHex.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(msg));
    return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function scheduleSave() {
    setNStatus("Сохраняю…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNotify, 700);
  }
  async function saveNotify() {
    const code = nCode(nstate);
    const t = Date.now();
    const nonce = [...crypto.getRandomValues(new Uint8Array(6))].map((b) => b.toString(16).padStart(2, "0")).join("");
    try {
      const h = await hmacHex(nkey, `${code}|${t}|${nonce}`);
      const body = JSON.stringify({ s: code, t, n: nonce, h });
      let r;
      try {
        r = await fetch(index.relay, { method: "POST", body });
      } catch (netErr) {
        // Если канал не отдаёт CORS-заголовок, ответ прочитать нельзя, но сообщение всё равно доходит.
        // Повтор с тем же телом бот отбросит как дубликат.
        r = await fetch(index.relay, { method: "POST", body, mode: "no-cors" });
      }
      if (r.type !== "opaque" && !r.ok) throw new Error(String(r.status));
      store.set("nlocal", JSON.stringify({ code, min: nstate.min, t, u: TG_USER }));
      setNStatus("Сохранено ✓", "ok");
      if (tg && tg.HapticFeedback && tgAtLeast("6.1")) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) { /* старый клиент */ } }
    } catch (e) {
      setNStatus(`Не удалось сохранить — нет связи. <button class="flink" data-act="notify-settings">Изменить в чате</button>`, "err");
    }
  }
