    // всплывает над нижней панелью: чуть поднимается и проявляется (только прозрачность и сдвиг — плавно везде)
    const shown = "translateX(-50%)", up = "translateX(-50%) translateY(12px) scale(.96)";
    try { el.animate([{ transform: up, opacity: 0 }, { transform: shown, opacity: 1 }], { duration: 340, easing: "cubic-bezier(.2, .9, .25, 1.05)" }); }
    catch (e) { /* без анимации */ }
    hideAnim = () => el.animate([{ transform: shown, opacity: 1 }, { transform: up, opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
    setTimeout(hide, action ? 4000 : 2000);
  }

  // ---------------- живое обновление ----------------
  // Подпись «сейчас» у линии идущей пары видна с первой минуты. В начале пары она стоит
  // сразу под временем начала (на месте времени конца) — время конца в это время прячется,
  // а когда подпись уезжает ниже, плавно возвращается. Время начала не перекрывается никогда.
  const NOW_MIN = 14;   // то же, что max(var(--p), 14px) у .nowlbl
  function placeNowLabels(animate) {
    for (const row of app.querySelectorAll(".row.live")) {
      const seg = row.querySelector(".seg"), time = row.querySelector(".time");
      const en = time && time.querySelector(".en"), lbl = row.querySelector("[data-nowlbl]");
      if (!seg || !en || !lbl || lbl.hidden) continue;
      const p = parseFloat(seg.style.getPropertyValue("--p")) || 0;
      const segTop = seg.offsetParent === time.offsetParent ? seg.offsetTop - time.offsetTop
        : seg.getBoundingClientRect().top - time.getBoundingClientRect().top;
      const top = segTop + Math.max(p / 100 * seg.offsetHeight, NOW_MIN) - 8;
      const hide = !!en.textContent && top < en.offsetTop + en.offsetHeight + 1 && top + 16 > en.offsetTop;
      if (row.classList.contains("en-off") === hide) continue;
      if (!animate) row.classList.add("quiet");
      row.classList.toggle("en-off", hide);
      if (!animate) { void en.offsetWidth; row.classList.remove("quiet"); }
    }
  }

  // Надписи «сейчас» расставляются сами после ЛЮБОЙ перестройки разметки (новый день, соседняя страница,
  // перерисованная карточка): раньше это надо было не забыть вызвать вручную, и пару раз забывали — тогда
  // «сейчас 12:14» ложилось на время конца пары. Наблюдатель срабатывает до отрисовки кадра, так что мигания нет.
  onAppDom((recs) => {
    for (const r of recs) for (const n of r.addedNodes) {
      if (n.nodeType === 1 && (n.matches(".row.live") || n.querySelector(".row.live"))) { placeNowLabels(false); return; }
    }
  });

  // Раз в 15 секунд: если статусы пар не поменялись — двигаем только шкалу и подписи,
  // чтобы не перезапускать анимации; если поменялись — перерисовываем день целиком.
  // Наступили новые сутки (приложение висело открытым или свёрнутым ночью): кто смотрел «сегодня» —
  // переводим на новое «сегодня», даже без сети. Кто сам ушёл на другой день — не трогаем.
  let tickDate = samaraNow().date;
  function rollDay() {
    const d = samaraNow().date;
    if (d === tickDate) return false;
    const was = tickDate;
    tickDate = d;
    let moved = false;
    for (const id of Object.keys(pos)) {
      const data = mem[id], p = pos[id], w = data && data.weeks[p.w];
      if (!w || addDays(w.monday, p.d) === was) { delete pos[id]; moved = true; }
    }
    return moved;
  }
  function tick() {
    if (rollDay() && (view === "schedule" || view === "teacher") && !scrolling) { opened.clear(); render(); return; }
    if (view !== "schedule" && view !== "teacher") return;
    if (scrolling) return;   // не перерисовываем посреди листания
    const id = view === "teacher" ? target : "g";
    const data = mem[id];
    if (!data || !pos[id] || !data.weeks[pos[id].w]) return;
    const m = dayModel(data, pos[id].w, pos[id].d, view === "teacher");
    if (m.sig !== liveSig) { render(); return; }
    for (const it of m.items) {
      if (it.type === "lesson" && it.st === "live") {
        const row = app.querySelector(`[data-cur] [data-row="${it.i}"]`);
        if (!row) continue;
        const seg = row.querySelector(".seg");
        if (seg) { seg.style.setProperty("--p", it.p + "%"); seg.style.setProperty("--pn", String(it.p / 100)); }
        const st = row.querySelector("[data-status]");
        if (st) st.textContent = it.statusText;
        const lbl = row.querySelector("[data-nowlbl]");
        if (lbl) { lbl.textContent = it.nowLabel; lbl.hidden = !it.showNow; }
        placeNowLabels(true);
      } else if (it.type === "lesson" && it.st === "next") {
        const st = app.querySelector(`[data-cur] [data-row="${it.i}"] [data-status]`);
        if (st) st.textContent = it.statusText;
      } else if (it.type === "break" && it.active) {
        const b = app.querySelector(`[data-cur] [data-brk="${it.i}"]`);
        if (!b) continue;
        b.style.setProperty("--p", it.p + "%"); b.style.setProperty("--pn", String(it.p / 100));
        const t = b.querySelector("[data-btext]");
        if (t) t.textContent = `Перерыв · ${it.text}`;
        const nl = b.querySelector("[data-bnow]");
        if (nl) nl.textContent = it.nowLabel;
      }
    }
    const hero = m.hero && app.querySelector("[data-cur] [data-hero]");
    if (hero) {
      const t = heroLeft(m.hero);
      const fill = hero.querySelector("[data-hfill]");
      if (fill) { if (fill.tagName.toLowerCase() === "circle") fill.style.strokeDashoffset = 100 - m.hero.p; else fill.style.width = m.hero.p + "%"; }
      const big = hero.querySelector("[data-hbig]"), unit = hero.querySelector("[data-hunit]");
      if (big) big.textContent = t.big;
      if (unit) unit.textContent = t.unit;
    }
  }

  // ---------------- пружины и переходы ----------------
  let springCache = null;
  // Пружинная кривая из CSS (--ease-spring); если linear() не поддерживается — обычная плавная
  function springEase() {
    if (springCache) return springCache;
    const v = getComputedStyle(ROOT).getPropertyValue("--ease-spring").trim() || "cubic-bezier(.4, 0, .2, 1)";
    try { document.body.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1, easing: v }).cancel(); springCache = v; }
    catch (e) { springCache = "cubic-bezier(.4, 0, .2, 1)"; }
    return springCache;
  }
  // Переход на другой день/неделю по нажатию (свайп пальцем идёт своей дорогой — через ленту).
  function moveTo(np) {
    const c = curPos();
    if (!c || !np) return;
    // лента уже едет к этому дню (повторное нажатие, «двойной» тап iPhone) — ничего не делаем,
    // иначе день появлялся заново, а таблетка прыгала назад и ехала ещё раз
    if (pgAnim && pgAnim.goal && pgAnim.goal.w === np.w && pgAnim.goal.d === np.d) return;
    const k = (np.w - c.p.w) * 7 + (np.d - c.p.d);
    if (!k) return;
    // v2.0: соседний день — родной плавной прокруткой ленты (таблетка едет за лентой, день становится
    // текущим, когда лента встала). Дальний день или другая неделя — сразу на место, а содержимое дня
    // мягко въезжает сбоку (как раньше): иначе лента пролетала бы через все дни по пути.
    if (Math.abs(k) === 1 && pagerGo(np)) return;
    if (pagerJump(np, Math.sign(k))) return;   // v2.1: без перерисовки экрана
    rememberPill();
    pos[c.id] = np;
    opened.clear();
    enterNext = false;
    slideDir = Math.sign(k);
    render();
  }

  // ---------------- липкая шапка ----------------
  // Как «большой заголовок» в iOS: при прокрутке полоса с днями прилипает к верху на стекле,
  // а заголовок недели сжимается. Порог с запасом (56 / 8 px), чтобы не дрожало на границе.
  // v2.1.6: сжатие — только сдвиг, масштаб и прозрачность (класс .vsmall), раскладка шапки не меняется вообще.
  // Раньше на пороге менялись размеры (класс .small), и в обработчике прокрутки шли пересчёт стилей, два прохода
  // замеров и запуск анимаций — 12 мс, кадр на iPhone длился 45–49 мс (2–3 потерянных кадра при каждом
  // сжатии/разжатии). Теперь насколько сдвинуть и сжать каждую часть шапки, меряется один раз (сжатый вид
  // по-прежнему задаёт .small — его включаем только на время замера), а на пороге лишь меняется класс:
  // переходы transform/opacity считает видеокарта.
  let barSmall = false, barEl = null, barTop = 0;
  const veil = document.querySelector(".topveil");
  const CAN_FLIP = !!(window.CSS && CSS.supports && CSS.supports("translate", "1px 1px") && CSS.supports("scale", "1 1"));
  function barGeo(bar) {
    if (bar.__geo) return;
    const wr = bar.querySelector(".whead h1.wr"), acts = [...bar.querySelectorAll(".whead .top-actions > *")], days = bar.querySelector(".days");
    const els = [wr, ...acts, days].filter(Boolean);
    const ext = -(parseFloat(getComputedStyle(bar, "::before").bottom) || 0);   // у «Стекла» фон ниже шапки
    const r0 = els.map((e) => e.getBoundingClientRect()), b0 = bar.getBoundingClientRect();
    bar.classList.add("small");
    const r1 = els.map((e) => e.getBoundingClientRect()), b1 = bar.getBoundingClientRect();
    bar.classList.remove("small");
    els.forEach((e, i) => {
      const a = r0[i], z = r1[i];
      const ky = a.height ? z.height / a.height : 1, kx = e === days ? 1 : ky;   // текст и кнопки — без искажения
      e.style.setProperty("--bx", `${(z.left - a.left).toFixed(2)}px`);
      e.style.setProperty("--by", `${(z.top - b1.top - (a.top - b0.top)).toFixed(2)}px`);
      e.style.setProperty("--bk", `${kx.toFixed(4)} ${ky.toFixed(4)}`);
      if (e === days) days.style.setProperty("--bi", `1 ${(1 / (ky || 1)).toFixed(4)}`);   // цифры дней не сплющиваются
    });
    bar.style.setProperty("--bb", `1 ${((b1.height + ext) / ((b0.height + ext) || 1)).toFixed(4)}`);
    bar.__geo = true;
  }
  function syncBar() {
    const bar = app.querySelector(".sbar");
    if (!bar) return;
    const y = window.scrollY;
    if (!barSmall && y > 56) barSmall = true;
    else if (barSmall && y < 8) barSmall = false;
    const fresh = bar !== barEl;
    // v1.9.5: «прилипла» — только когда полоса и правда стоит у верхнего края. У преподавателя над ней карточка,
    // и раньше фон полосы появлялся уже при y > 2 — посреди страницы, резкой линией поперёк цветной подсветки
    if (fresh) {
      barTop = parseFloat(getComputedStyle(bar).top) || 0;
      // v2.1.12: замер сжатой шапки — заранее, в спокойный момент после отрисовки, а не в первом кадре прокрутки
      // (замер на iPhone: рывок в начале первого сжатия шапки)
      if (CAN_FLIP && !REDUCED) setTimeout(() => { if (bar.isConnected && !bar.__geo && !bar.classList.contains("vsmall") && !scrolling && !pagerTouch) barGeo(bar); }, 600);
    }
    const stuck = y > 2 && (bar === app.firstElementChild || bar.getBoundingClientRect().top <= barTop + 1);
    bar.classList.toggle("stuck", stuck);
    // v2.1.14: полоса под часами темнеет вместе со стеклом шапки — иначе по верхнему краю шапки шла граница
    // (сверху — яркий фон, ниже — затемнённое стекло)
    if (veil) veil.classList.toggle("dim", stuck);
    barEl = bar;
    if (bar.classList.contains("vsmall") === barSmall) return;
    if (barSmall) barGeo(bar);
    perfAct("шапка");
    if (fresh || REDUCED || !CAN_FLIP) {   // шапка только что нарисована — сразу нужный вид, без анимации
      bar.classList.add("bnoanim");
      bar.classList.toggle("vsmall", barSmall);
      void bar.offsetWidth;
      bar.classList.remove("bnoanim");
    } else bar.classList.toggle("vsmall", barSmall);
  }
  window.addEventListener("resize", () => { const bar = app.querySelector(".sbar"); if (!bar || !bar.__geo) return;
    const was = bar.classList.contains("vsmall"); bar.classList.add("bnoanim"); bar.classList.remove("vsmall"); bar.__geo = false;
    if (was) { barGeo(bar); bar.classList.add("vsmall"); } void bar.offsetWidth; bar.classList.remove("bnoanim"); }, { passive: true });
  window.addEventListener("scroll", syncBar, { passive: true });

  // ---------------- события ----------------
  app.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    if (navBusy && (act === "teacher" || act === "notif" || act === "back")) return;   // экран ещё едет — второй тап не считаем
    const id = view === "teacher" ? target : "g";

    if (act === "day") {
      const d = +el.dataset.d;
      const goal = pgAnim && pgAnim.goal;   // лента ещё едет — сравниваем с днём, к которому едет
      if (goal && goal.w === pos[id].w && goal.d === d) { /* лента уже едет туда — повторное нажатие не считаем */ }
      else if (pos[id] && (goal || pos[id].d !== d)) { haptic("select"); moveTo({ w: pos[id].w, d }); }
    } else if (act === "week") {
      const data = mem[id];
      const w = pos[id].w + (+el.dataset.dir);
      if (data && w >= 0 && w < data.weeks.length) { haptic("select"); moveTo({ w, d: pos[id].d }); }
    } else if (act === "today") {
      if (mem[id]) {
        haptic("light");
        moveTo(pickDefault(mem[id]));
      }
    } else if (act === "teacher") {
      haptic("light");
      go("teacher", el.dataset.t, true);
    } else if (act === "room") {
      openRoomSheet(el.dataset.key);
    } else if (act === "open") {
      toggleCard(el.dataset.key);
    } else if (act === "back") {
      goBack();
    } else if (act === "notif") {
      haptic("light");
      go("notif", null, true);
    } else if (act === "fs") {
      haptic("select");
      setFullscreen(!tg.isFullscreen);
    } else if (act === "srange") {
      const r = +el.dataset.v;
      if (r !== statsRange) { haptic("light"); statsRange = r; statsPick = -1; store.set("statsRange", String(r)); const y = window.scrollY; render(); window.scrollTo(0, y); }
    } else if (act === "perfcopy") {
      perfCopy(el);
    } else if (act === "perfreset") {
      PERF.reset(); haptic("light"); render();
    } else if (act === "stats") {
      haptic("light");
      statsPick = -1;
      go("stats", null, true);
      loadAdminStats(true).then((st) => { if (st && view === "stats" && !navBusy) { const y = window.scrollY; render(); window.scrollTo(0, y); } });
    } else if (act === "to-settings") {
      haptic("light");
      nOpen = true; store.set("nOpen", "1");
      go("settings", null, true);
      const sec = document.getElementById("nsec");
      if (sec) requestAnimationFrame(() => sec.scrollIntoView({ block: "start", behavior: "smooth" }));
    } else if (act === "install") {
      haptic("light");
      promptInstall();
    } else if (act === "install-open") {
      haptic("light");
      openInstallPage();
    } else if (act === "notify-settings") {
      openNotifySettings();
    } else if (act === "nfold") {
      haptic("light");
      setNotifOpen(!nOpen);
    } else if (act === "nlink") {
      haptic("light");
      linkStart();
    } else if (act === "npush") {
      pushToggle(el);
    } else if (act === "ntg") {
      haptic("select");
      pushTgToggle(el);
    } else if (act === "nlink-reopen") {
      if (linkStartArg) openLinkChat(linkStartArg);
    } else if (act === "nlink-cancel") {
      haptic("light");
      linkCancel();
    } else if (act === "ntoggle") {
      if (!canEditNotify()) return;
      const k = el.dataset.k;
      nstate[k] = !nstate[k];
      el.setAttribute("aria-checked", String(nstate[k]));

    } else if (act === "ndel") {

    } else if (act === "nclear") {
      let ids = [];

      if (w < 0) { haptic("light"); toast("Этого дня уже нет в расписании"); return; }

      focusTarget = { date, start: el.dataset.start, kind: el.dataset.kind };

      go("schedule", "g", false);
    } else if (act === "retry") {

      render();
    } else if (act === "retry-net") {

    } else if (act === "icon-style") {

      try { window.applyIconStyle(el.dataset.v); } catch (e) { /* старая страница */ }

    } else if (act === "install-done") {

    } else if (act === "install-again") {
      haptic("light"); store.set("installDone", "0"); renderSettings();
    } else if (act === "onb") {
      haptic("light"); showOnboarding();
    } else if (act === "tsz-sys") {
      toggleSystemTextSize();
    } else if (act === "theme") {
      rememberSeg(el.closest(".seg3"));
      store.set("theme", el.dataset.v);
      applyTheme();
      haptic("select");
      renderSettings();
    } else if (act === "site") {
      const g = mem.g;
      const w = g && pos.g ? g.weeks[pos.g.w] : g && g.weeks[0];
      const url = (w && w.url) || "https://www.samgups.ru/raspisanie_v2/";
      if (inTG && tg.openLink) { try { tg.openLink(url); return; } catch (e) { /* ниже — обычное окно */ } }
      window.open(url, "_blank", "noopener");
    }
  });

  app.addEventListener("change", (ev) => {
    if (ev.target.id !== "nmin" || !canEditNotify()) return;
    nstate.min = +ev.target.value;
    haptic("select");
    refreshNSummary();
    scheduleSave();
  });

  app.addEventListener("input", (ev) => {
    if (ev.target.id !== "q") return;
    query = ev.target.value;
    const box = document.getElementById("tlists");
    if (box && index) box.innerHTML = teacherListsHTML();
  });

  // «Расписание» внизу: с другого раздела — возвращает к расписанию, а если уже в нём — к сегодняшнему дню
  function goToday() {
    const data = mem.g;
    if (!data || !data.weeks || !data.weeks.length) return;
    const def = pickDefault(data), p = pos.g;
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (p && p.w === def.w && p.d === def.d) return;   // уже сегодня — просто наверх
    if (!p) { pos.g = def; render(); return; }
    moveTo(def);   // рядом — плавная прокрутка ленты, далеко — сдвиг страницы
  }
  tabs.forEach((b) => b.addEventListener("click", () => {
    if (navBusy) return;   // пока экран едет, вкладки не переключаем
    const t = b.dataset.tab;
    perfAct("вкладка");
    haptic("select");
    if (t === "schedule") {
      if (view === "schedule") goToday();
      else go("schedule", "g", false);
    } else if (view === t) {
      // уже открыта эта вкладка — не перерисовываем заново, просто наверх
      window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
    } else go(t, null, false);
  }));

  // ---------------- свежие данные при возвращении ----------------
  // Если приложение долго висело свёрнутым — тихо подтягиваем то, что бот выложил за это время.
  let loadedAt = Date.now(), loadedDate = samaraNow().date, reloading = false;
  // Принудительно: по кнопке «Повторить», при появлении сети и раз в минуту, пока показано сохранённое
  function refreshNow() { loadedAt = 0; reloadIfStale(true); }
  // WebKit may keep the old document when a reload starts while offline.  In
  // that case the cached schedule is still on screen, so update its state as
  // soon as the browser reports the connection loss instead of waiting for a
  // failed fetch or a successful reload.
  window.addEventListener("offline", () => {
    if (!mem.g || mem.g._offline) return;
    mem.g._offline = true;
    loadedAt = 0;
    if (view === "schedule" || view === "teacher") { const y = scrollY; render(); scrollTo(0, y); }
  });
  window.addEventListener("online", () => { if (mem.g && mem.g._offline) refreshNow(); });
  setInterval(() => { if (mem.g && mem.g._offline && !document.hidden) refreshNow(); }, 60 * 1000);
  async function reloadIfStale(force, quiet) {
    if (reloading || (document.hidden && !force) || Date.now() - loadedAt < 10 * 60 * 1000) return;
    reloading = true;
    try {
      const [i, mt, ch, g] = await Promise.all([fetchJSON("data/index.json"), fetchJSON("data/meta.json"),
        fetchJSON("data/changes.json"), fetchJSON("data/g.json")]);
      if (g._offline) {
        if (quiet) { if (mem.g) mem.g._offline = true; if (view === "schedule") render(); return false; }   // показываем «нет сети» на сохранённом
        if (force) { render(); toast(lastNetError ? `Не отвечает — ${lastNetError}` : "Нет сети"); }
        return false;
      }
      // тихая проверка после быстрого запуска: всё то же самое — экран не трогаем совсем
      const same = (a, b) => { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } };
      if (quiet && same(g, mem.g) && same(i, index) && same(ch, changes)) {
        meta = mt; loadedAt = Date.now(); loadedDate = samaraNow().date;
        syncBadge();
        return true;
      }
      const newDay = samaraNow().date !== loadedDate;
      for (const id of Object.keys(pos)) {
        const w = mem[id] && mem[id].weeks[pos[id].w];
        if (newDay || !w) delete pos[id];          // наступил новый день — открываем сегодня
        else keepMonday[id] = w.monday;            // иначе — та же неделя и день, что были
      }
      for (const k of Object.keys(mem)) delete mem[k];
      index = i; meta = mt; changes = ch; mem.g = g;
      loadedAt = Date.now(); loadedDate = samaraNow().date;
      opened.clear();
      if (view !== "teachers") render();   // в списке преподавателей не сбиваем поиск
      syncBadge();
      return true;
    } catch (e) {
      /* нет сети — попробуем в следующий раз */
      return false;
    } finally {
      reloading = false;
    }
  }

  // ---------------- раскрытие карточки пары ----------------
  // Меняем только эту карточку и плавно тянем её высоту — остальной экран не перерисовываем
  function toggleCard(key) {
    perfAct("карточка");
    opened.has(key) ? opened.delete(key) : opened.add(key);
    haptic("select");
    const isTeacher = view === "teacher";
    const id = isTeacher ? target : "g";
    const data = mem[id], p = pos[id];
    const btn = [...app.querySelectorAll("[data-cur] [data-key]")].find((x) => x.dataset.key === key);
    const row = btn && btn.closest(".row");
    if (!data || !p || !row || REDUCED || scrolling) { render(); return; }
    const m = dayModel(data, p.w, p.d, isTeacher);
    const it = m.items.find((x) => x.type === "lesson" && x.key === key);
    if (!it) { render(); return; }
    const oldBody = row.querySelector(".card, .cc");
    const ob = oldBody.getBoundingClientRect(), rb = row.getBoundingClientRect();
    const h0 = ob.height;
    const r0 = getComputedStyle(oldBody).borderTopLeftRadius;   // скругление старой карточки (пока она ещё на странице)
    const oldTitle = oldBody.querySelector("h3");
    const t0 = oldTitle ? oldTitle.getBoundingClientRect() : null;
    const f0 = oldTitle ? parseFloat(getComputedStyle(oldTitle).fontSize) : 0;
    const n0 = oldTitle ? Math.round(t0.height / (parseFloat(getComputedStyle(oldTitle).lineHeight) || f0 * 1.3)) : 0;   // строк в названии
    const oldSeg = row.querySelector(".seg");
    const s0 = oldSeg ? oldSeg.getBoundingClientRect().height : 0;
    // где стояли пары ниже — потом они плавно доедут до новых мест
    const after = [];
    for (let el = row.nextElementSibling; el; el = el.nextElementSibling) after.push([el, el.getBoundingClientRect().top]);
    const list = row.parentElement;
    if (list) list.classList.remove("enter");   // чтобы не проиграть заново анимацию появления
    const tmp = document.createElement("ol");
    tmp.innerHTML = lessonHTML(it, parseInt(row.style.getPropertyValue("--i"), 10) || 0, isTeacher);
    const fresh = tmp.firstElementChild;
    row.replaceWith(fresh);
    // новая строка пришла без отметки «конец пары спрятан» — сразу решаем заново, иначе «сейчас 12:14»
    // ложилось прямо на «13:40» (у идущей пары после нажатия на карточку)
    placeNowLabels(false);
    liveSig = m.sig;
    const body = fresh.querySelector(".card, .cc");
    const h1 = body.getBoundingClientRect().height;
    const d = h1 - h0;   // > 0 — раскрываем, < 0 — сворачиваем
    // v1.8.8: всё, что нужно знать о новой карточке, меряем сразу, одним проходом — до любых изменений
    // страницы. Раньше замеры шли вперемешку со вставкой слоёв, и телефон пересчитывал раскладку 4–5 раз
    // в самом начале движения (как раз там, где на записях с iPhone пропадали кадры).
    const bcs = getComputedStyle(body);
    const radius = bcs.borderTopLeftRadius, shadowStr = bcs.boxShadow || "", shapeStr = bcs.getPropertyValue("corner-shape");
    const bwPx = parseFloat(bcs.borderTopWidth) || 0;
    const frR = fresh.getBoundingClientRect(), brR = body.getBoundingClientRect();
    const afterTop = after.map(([el]) => el.getBoundingClientRect().top);
    const seg = fresh.querySelector(".seg");
    const s1 = seg && s0 ? seg.getBoundingClientRect().height || 1 : 1;
    const title = body.querySelector("h3");
    const t1 = title && t0 ? title.getBoundingClientRect() : null;
    const tcs = title ? getComputedStyle(title) : null;
    const f1 = title ? parseFloat(tcs.fontSize) || f0 : f0;
    const n1 = title && t1 ? Math.round(t1.height / (parseFloat(tcs.lineHeight) || f1 * 1.3)) : 0;

    // Всё движение — сдвигами и масками, которые телефон считает на видеокарте:
    // страница под карточкой не перерисовывается каждый кадр, поэтому без рывков
    // Без пружины: карточка и пары ниже приезжают на место и сразу останавливаются. Пружина с перелётом
    // давала «докат» — содержимое проскакивало на несколько точек и возвращалось, это выглядело как дёрганье.
    // Кривая без длинного «хвоста»: прежняя (.25,.9,.3,1 за 340 мс) последние ~1,5 точки доползала ещё ~120 мс —
    // на экране 120 Гц это видно как «карточка свернулась, а пары ниже ещё куда-то едут». Эта — ~70 мс.
    // Торможение без «хвоста» (easeOutQuad): последние 5 точек проходятся за ~50 мс, а не за ~90.
    // На записи с iPhone 120 Гц хвост был виден: карточка уже свернулась, а край ещё «доползал» вверх.
    // Плавный разгон и плавное торможение. На записи с iPhone первые ~50 мс после нажатия кадров нет (строится
    // новая карточка), и при «резком» старте движение начиналось прыжком на ~40 точек, а потом медленно доезжало.
    // С мягким стартом за эти 50 мс проходится всего ~8 точек — прыжка не видно, и конец не кажется «доползанием».
    const ease = "cubic-bezier(.45, 0, .25, 1)", dur = 280, opt = { duration: dur, easing: ease };
    watchFrames("раскрытие карточки", dur);
    // Свечение и контур карточки в «Стекле» — тени (внешняя и внутренняя «кромка» 1px). Маска раскрытия срезала бы
    // и то и другое: свечение пропадало, а у края, где режет маска, карточка теряла контур. Поэтому на время анимации
    // их рисуют два отдельных слоя: свечение — под карточкой, кромка — поверх; оба плавно меняют высоту вместе с ней.
    // У самой карточки остаются только блики, которым маска не мешает.
    const glowFx = (() => {
      const parts = shadowStr.split(/,(?![^(]*\))/).map((x) => x.trim()).filter((x) => x && x !== "none");
      const isRing = (x) => /\binset\b/.test(x) && /(^|\s)0px 0px 0px [\d.]+px/.test(x);
      const outer = parts.filter((x) => !/\binset\b/.test(x));
      const ring = parts.filter(isRing);
      if (!outer.length && !ring.length) return null;
      const inner = parts.filter((x) => /\binset\b/.test(x) && !isRing(x)).join(", ") || "none";
      const fr = frR, br = brR;
      // Всё движется только сдвигом (transform) — так же, как пары ниже: на iPhone сдвиги считает видеокарта,
      // а анимация высоты шла бы отдельно, на основном потоке, и контур «отставал/уезжал» от карточки.
      // позиции — ровно по пикселям экрана: иначе тонкая линия на слое видеокарты размывается (тусклее настоящей)
      const dpr = window.devicePixelRatio || 1, px = (v) => Math.round(v * dpr) / dpr;
      const L = px(br.left - fr.left), T = px(br.top - fr.top), Wd = px(br.width);
      const H0 = px(h0), H1 = px(h1), hMin = Math.min(H0, H1), hMax = Math.max(H0, H1), R = parseFloat(radius) || 18;
      // форма углов как у карточки: где браузер умеет «сквиркл» (corner-shape), обычная дуга того же радиуса
      // выходит заметно круглее — кромка и свечение шли бы по другой линии, чем край карточки
      const shape = shapeStr;
      const box = (st) => { const e = document.createElement("div"); e.setAttribute("aria-hidden", "true");
        Object.assign(e.style, { position: "absolute", pointerEvents: "none", boxSizing: "border-box" }, st);
        if (shape && shape !== "round") e.style.setProperty("corner-shape", shape);
        return e; };
      // сдвиг слоя так, чтобы его низ совпадал с текущим низом карточки (слой высотой hh, нижний край — при hMax)
      const move = (el) => el.animate([{ transform: `translate3d(0, ${H0 - hMax}px, 0)` }, { transform: `translate3d(0, ${H1 - hMax}px, 0)` }], opt);
      fresh.style.isolation = "isolate";
      // свечение: без окна-обрезки (на iPhone такое окно рисовалось тёмным квадратом рядом с карточкой).
      // Слой высотой с меньшую карточку и низом по краю карточки — выше её верха он не поднимается никогда.
      const g = box({ left: `${L}px`, top: `${T + hMax - hMin}px`, width: `${Wd}px`, height: `${hMin}px`, borderRadius: radius,
        boxShadow: outer.length ? outer.join(", ") : "none", zIndex: "0" });
      g.dataset.fx = "glow";
      if (outer.length) move(g);
      fresh.insertBefore(g, fresh.firstChild);
      // кромка — той же тенью, что у карточки (не рамкой), чтобы выглядела точь-в-точь: неподвижный верх + едущий низ
      let edge = null;
      if (ring.length) {
        const sh = ring.join(", "), topH = Math.max(R, hMin - R);
        // внутренняя тень рисуется ВНУТРИ рамки (у карточки рамка 1px, хоть и прозрачная) — кромку ставим так же,
        // иначе она на 1 точку снаружи настоящей: контур двоился, а в конце «перепрыгивал» на место
        const bw = bwPx;
        const rIn = `${Math.max(0, R - bw)}px`;
        edge = box({ left: `${L + bw}px`, top: `${T + bw}px`, width: `${Wd - 2 * bw}px`, height: `${hMax - 2 * bw}px`, zIndex: "3" });
        edge.dataset.fx = "edge";
        const iMin = hMin - 2 * bw, iMax = hMax - 2 * bw;   // высоты внутри рамки
        const topWin = box({ left: "0", top: "0", width: "100%", height: `${topH}px`, overflow: "hidden" });
        topWin.appendChild(box({ left: "0", top: "0", width: "100%", height: `${iMin}px`, borderRadius: rIn, boxShadow: sh }));
        const win = box({ left: "0", top: `${topH}px`, width: "100%", height: `${iMax - topH}px`, overflow: "hidden" });
        // верх «шапки» вместе с её скруглёнными углами всегда выше окна — внутри карточки не видно ни линии, ни дуг
        const capH = iMax - topH + R + 4;
        const cap = box({ left: "0", top: `${iMax - topH - capH}px`, width: "100%", height: `${capH}px`, borderRadius: rIn, boxShadow: sh });
        win.appendChild(cap); edge.append(topWin, win); move(cap);
        fresh.appendChild(edge);
      }
      return { g, edge, inner };
    })();
    const glowDone = () => { if (glowFx) { glowFx.g.remove(); if (glowFx.edge) glowFx.edge.remove(); fresh.style.isolation = ""; } };

    // 1) пары ниже съезжают со старого места на новое
    // v2.1.12: только те, что видны на экране (или въедут на него). Каждая едущая пара — свой слой видеокарты,
    // и заводились они все разом в первом кадре: замер на iPhone — 3 медленных кадра в начале почти каждого раскрытия
    const vh = window.innerHeight + 40;
    after.forEach(([el, top0], i) => {
      const dy = top0 - afterTop[i];
      if (Math.abs(dy) > 0.5 && Math.min(top0, afterTop[i]) < vh) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], opt);
    });
    // 2) линия слева растёт/укорачивается вместе с карточкой, кружок на конце остаётся круглым
    if (seg && s0) {
      const k = s0 / s1;
      seg.style.transformOrigin = "50% 0";
      seg.animate([{ transform: `scaleY(${k})` }, { transform: "none" }], opt);
      const cap = seg.querySelector(".cap");
      if (cap) { cap.style.transformOrigin = "50% 100%"; cap.animate([{ transform: `scaleY(${1 / k})` }, { transform: "none" }], opt); }
      // отметка «сейчас» и время рядом с ней — тоже без растяжения
      seg.querySelectorAll(".mark, .nowlbl").forEach((el) => el.animate([{ transform: `scaleY(${1 / k})` }, { transform: "none" }], opt));
    }
    // 3) сама карточка: при раскрытии — открывается маской сверху вниз,
    //    при сворачивании — старая карточка под ней поджимается той же маской
    const ghost = oldBody.cloneNode(true);
    ghost.removeAttribute("data-act");
    ghost.setAttribute("aria-hidden", "true");
    Object.assign(ghost.style, {
      position: "absolute", top: `${ob.top - rb.top}px`, left: `${ob.left - rb.left}px`, width: `${ob.width}px`,
      height: `${h0}px`, margin: "0", pointerEvents: "none",
    });
    const gt = ghost.querySelector("h3");
    fresh.style.position = "relative";
    // Название: если строки переносятся так же — просто едет и масштабируется. Если перенос другой
    // (в свёрнутой карточке в одну строку, в раскрытой — в две), старое название уезжает и гаснет,
    // а новое появляется на его месте и доезжает — без мгновенного «прыжка» текста
    const morph = !!(t1 && n0 && n0 !== n1 && gt);
    if (gt && !morph) gt.style.visibility = "hidden";
    // Фон карточки возвращаем без плавного перехода (иначе после сворачивания он ещё 0,2 с «проявляется»)
    // «Окно» карточки: показывает её только до текущего нижнего края. Сделано двумя встречными сдвигами
    // (окно с overflow:hidden едет вверх, содержимое внутри — на столько же вниз), а не маской clip-path:
    // маску iPhone пересчитывает на основном потоке, а сдвиги — на видеокарте, вместе с парами ниже и кромкой.
    // С маской содержимое отставало от кромки и «вылезало» за неё, при сворачивании это выглядело как дёрганье.
    const reveal = (el, from, to, full, wrapStyle) => {
      const w = document.createElement("div");
      if (el !== body) w.setAttribute("aria-hidden", "true");
      w.dataset.fx = "win";
      Object.assign(w.style, { overflow: "hidden", borderRadius: `0 0 ${radius} ${radius}`, willChange: "transform", minWidth: "0" }, wrapStyle);
      if (el === body) {   // поля карточки переносим на окно: иначе окно выше карточки на них и край «вылезает» за кромку
        const cs = getComputedStyle(el);
        Object.assign(w.style, { marginTop: cs.marginTop, marginBottom: cs.marginBottom, marginLeft: cs.marginLeft, marginRight: cs.marginRight });
        el.style.margin = "0";
      }
      el.replaceWith(w); w.appendChild(el);
      const kf = (h) => ({ transform: `translate3d(0, ${h - full}px, 0)` }), ki = (h) => ({ transform: `translate3d(0, ${full - h}px, 0)` });
      const o = { ...opt, fill: "both" };
      const a1 = w.animate([kf(from), kf(to)], o);
      el.animate([ki(from), ki(to)], o);
      return { w, done: a1.finished };
    };
    let win = null;
    const unwrap = () => { if (win && win.w.isConnected) { const el = win.w.firstChild; el.getAnimations().forEach((x) => { if (x.effect && x.effect.getKeyframes().some((k) => k.transform && /translate3d/.test(k.transform))) x.cancel(); }); win.w.replaceWith(el); } win = null; };
    const cleanup = () => {
      unwrap(); ghost.remove(); fresh.style.position = ""; glowDone();
      body.style.cssText = "transition: none";
      requestAnimationFrame(() => requestAnimationFrame(() => { body.style.cssText = ""; }));
    };
    if (d >= 0) {
      Object.assign(ghost.style, { background: "transparent", borderColor: "transparent", boxShadow: "none", zIndex: "2" });
      fresh.appendChild(ghost);
      if (glowFx) Object.assign(body.style, { boxShadow: glowFx.inner });
      win = reveal(body, h0, h1, h1, { position: "relative", zIndex: "1" });
      // старая карточка убирается, как только её текст погас (раньше конца движения);
      // а свечение и стиль самой карточки возвращаем только когда окно доехало до конца
      const dropGhost = () => ghost.remove();   // (при раскрытии окно — у новой карточки, призрак без окна)
      if (ghost.getAnimations) requestAnimationFrame(() => Promise.all(ghost.getAnimations({ subtree: true }).map((x) => x.finished)).then(dropGhost, dropGhost));
      else setTimeout(dropGhost, dur + 40);   // старый iPhone без getAnimations — убираем по времени
      win.done.then(cleanup, cleanup);
    } else {
      if (glowFx) ghost.style.boxShadow = glowFx.inner;
      // у раскрытой и свёрнутой карточки разное скругление (22 и 18): у «призрака» сразу берём конечное —
      // иначе его блик по кромке шёл бы по другой дуге, чем кромка, и в углах контур двоился
      ghost.style.borderRadius = radius;
      const gs = { top: ghost.style.top, left: ghost.style.left, width: ghost.style.width };
      Object.assign(ghost.style, { position: "relative", top: "0", left: "0", zIndex: "" });
      fresh.insertBefore(ghost, glowFx ? glowFx.g.nextSibling : fresh.firstChild);
      // transition: none — иначе фон карточки гаснет плавно и на миг закрывает старый текст тёмной плашкой
      Object.assign(body.style, { position: "relative", zIndex: "1", background: "transparent", borderColor: "transparent", boxShadow: "none", transition: "none" });
      win = reveal(ghost, h0, h1, h0, { position: "absolute", top: gs.top, left: gs.left, width: gs.width, height: `${h0}px`, zIndex: "0" });
      win.done.then(cleanup, cleanup);
    }
    // старые строки (аудитория, преподаватель, тип) плавно гаснут на своих местах
    const fadeOut = { duration: 120, easing: "ease-out", fill: "forwards" };
    for (const c of ghost.children) if (c !== gt) c.animate([{ opacity: 1 }, { opacity: 0 }], fadeOut);
    // 4) название переезжает на новое место
    if (t1) {
      const dx = t0.left - t1.left, dy = t0.top - t1.top, k = f0 / f1;
      title.style.transformOrigin = gt.style.transformOrigin = "0 0";
      title.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${k})` }, { transform: "none" }], opt);
      if (morph) {
        // по очереди, а не одновременно: две разные раскладки текста не просвечивают друг через друга
        gt.animate([{ transform: "none" }, { transform: `translate(${-dx}px, ${-dy}px) scale(${1 / k})` }], { ...opt, fill: "forwards" });
        gt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: Math.round(dur * 0.28), easing: "ease-in", fill: "forwards" });
        title.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: Math.round(dur * 0.5), delay: Math.round(dur * 0.18), easing: "ease-out", fill: "backwards" });
      }
    }
    // 5) новые строки проявляются вместе с движением, а не после него — ничего не «выскакивает» в конце
    let n = 0;
    for (const c of body.children) {
      if (c === title) continue;
      c.animate([{ opacity: 0, transform: "translateY(-3px)" }, { opacity: 1, transform: "none" }],
        { duration: 200, delay: (d >= 0 ? 50 : Math.round(dur * (morph ? 0.3 : 0.15))) + 30 * n++, easing: "ease-out", fill: "backwards" });
    }
    if (d >= 0) fitPager(); else setTimeout(fitPager, 360);
  }

  // ---------------- листание дней ----------------
  // Вчера | сегодня | завтра лежат в горизонтальной прокрутке с защёлкиванием. Листает сам телефон,
  // а когда лента остановилась на соседнем дне, делаем его текущим и незаметно перерисовываем ленту.
  const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  })();
  window.perfReport = () => PERF.report();   // для проверки
  function perfAct(label) { try { PERF.act(label); } catch (e) { /* замер не должен ничего ломать */ } }
  function perfHTML() {
    const n = PERF.count();
    return `<div class="list" style="margin:14px 0 6px"><div class="srow"><div class="body"><span class="nm">Замер плавности</span>
      <span class="sub">${n ? `Записано движений: ${n}` : "Пока ничего не записано — просто пользуйтесь приложением"}</span></div></div>
      <button class="item" data-act="perfcopy"><span class="body"><span class="nm">Скопировать отчёт</span></span></button>
      <button class="item" data-act="perfreset"><span class="body"><span class="nm">Начать замер заново</span></span></button></div>`;
  }
  async function perfCopy(btn) {
    const text = PERF.report();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* ниже — запасной способ */ }
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:0;top:0;opacity:0;";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
    }
    const nm = btn && btn.querySelector(".nm");
    if (nm) { nm.textContent = ok ? "Скопировано — вставьте в чат" : "Не удалось скопировать"; setTimeout(() => { nm.textContent = "Скопировать отчёт"; }, 2500); }
    haptic(ok ? "light" : "heavy");
  }
};
window.__boot();
</script>
</body>
</html>
