  function showInstallVideo(os) {
    os = os || (IOS ? "ios" : "android");
    let w = document.querySelector(".vwrap");
    if (!w) {
      w = document.createElement("div");
      w.className = "vwrap";
      w.addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-vs]");
        if (b && b.dataset.vs === "close") { w.remove(); return; }
        if (b && b.dataset.vs !== os) { haptic("select"); showInstallVideo(b.dataset.vs); return; }
        if (ev.target === w) w.remove();
      });
      document.body.appendChild(w);
    }
    w.innerHTML = `<div class="vbox" role="dialog" aria-label="Видео: как установить">
      <div class="vtop"><div class="vseg">${[["ios", "iPhone"], ["android", "Android"]].map(([v, l]) =>
        `<button data-vs="${v}" class="${v === os ? "on" : ""}" aria-pressed="${v === os}">${l}</button>`).join("")}</div>
        <button class="ix" data-vs="close" aria-label="Закрыть">${I.x}</button></div>
      <video src="media/install-${os}.mp4?v=2" poster="media/install-${os}.jpg?v=2" autoplay muted loop playsinline controls
        width="540" height="960" aria-label="Как установить расписание на главный экран"></video></div>`;
    const v = w.querySelector("video");
    try { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) { /* автозапуск запрещён — есть кнопка ▶ */ }
  }
  function closeInstallSheet() { const w = document.querySelector(".iwrap"); if (w) w.remove(); }

  function renderSettings() {
    const pref = themePref();
    const opts = [["auto", inTG ? "Как в Telegram" : "Как в системе"], ["light", "Светлая"], ["dark", "Тёмная"]];
    const upd = meta && meta.updated ? fmtUpdated(meta.updated) : "";
    app.innerHTML = `<div class="top"><div><div class="eyebrow">${esc((index && index.group) || "СОДП-55у")}</div><h1>Настройки</h1></div></div>
      <h2 class="sec">Оформление</h2>
      <div class="list pad"><span class="lbl15">Тема</span>
        <div class="seg3" role="group" aria-label="Тема">${opts.map(([v, l]) =>
          `<button data-act="theme" data-v="${v}" aria-pressed="${pref === v}" class="${pref === v ? "on" : ""}">${l}</button>`).join("")}</div></div>
      ${fsSupported() ? `<div class="list" style="margin-top:10px"><div class="srow"><div class="body"><span class="nm">Во весь экран</span>
        <span class="sub">Без шапки Telegram, больше места для пар</span></div>
        <button class="sw" role="switch" data-act="fs" aria-checked="${!!tg.isFullscreen}" aria-label="Во весь экран"><span class="tr"><span class="kn"></span></span></button></div></div>` : ""}
      <h2 class="sec" id="asec">Приложение</h2>
      ${STANDALONE ? installHTML() + iconPickHTML() : iconPickHTML().replace('style="margin-top:10px"', 'style="margin-bottom:10px"') + installHTML()}
      <h2 class="sec" id="nsec">Уведомления в чате</h2>
      ${notifSettingsHTML()}
      <p class="foot">@sodp55u_bot · <button class="flink" data-act="site">Открыть на сайте</button><br>
        ${upd ? `Данные от ${esc(upd)}` : ""}</p>`;
  }

  function toast(text) {
    const old = document.querySelector(".toast");
    if (old) old.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("role", "status");
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  // ---------------- живое обновление ----------------
  // Подпись «сейчас» у линии идущей пары видна с первой минуты. В начале пары она стоит
  // сразу под временем начала (на месте времени конца) — время конца в это время прячется,
  // а когда подпись уезжает ниже, плавно возвращается. Время начала не перекрывается никогда.
  const NOW_MIN = 14;   // то же, что max(var(--p), 14px) у .nowlbl
  function placeNowLabels(animate) {
    for (const row of app.querySelectorAll(".row.live")) {
      const seg = row.querySelector(".seg"), time = row.querySelector(".time");
      const en = time && time.querySelector(".en"), lbl = row.querySelector("[data-nowlbl]");
      if (!seg || !en || !lbl || lbl.hidden) continue;
      const p = parseFloat(seg.style.getPropertyValue("--p")) || 0;
      const segTop = seg.offsetParent === time.offsetParent ? seg.offsetTop - time.offsetTop
        : seg.getBoundingClientRect().top - time.getBoundingClientRect().top;
      const top = segTop + Math.max(p / 100 * seg.offsetHeight, NOW_MIN) - 8;
      const hide = !!en.textContent && top < en.offsetTop + en.offsetHeight + 1 && top + 16 > en.offsetTop;
      if (row.classList.contains("en-off") === hide) continue;
      if (!animate) row.classList.add("quiet");
      row.classList.toggle("en-off", hide);
      if (!animate) { void en.offsetWidth; row.classList.remove("quiet"); }
    }
  }

  // Раз в 15 секунд: если статусы пар не поменялись — двигаем только шкалу и подписи,
  // чтобы не перезапускать анимации; если поменялись — перерисовываем день целиком.
  function tick() {
    if (view !== "schedule" && view !== "teacher") return;
    if (scrolling) return;   // не перерисовываем посреди листания
    const id = view === "teacher" ? target : "g";
    const data = mem[id];
    if (!data || !pos[id] || !data.weeks[pos[id].w]) return;
    const m = dayModel(data, pos[id].w, pos[id].d, view === "teacher");
    if (m.sig !== liveSig) { render(); return; }
    for (const it of m.items) {
      if (it.type === "lesson" && it.st === "live") {
        const row = app.querySelector(`[data-cur] [data-row="${it.i}"]`);
        if (!row) continue;
        const seg = row.querySelector(".seg");
        if (seg) seg.style.setProperty("--p", it.p + "%");
        const st = row.querySelector("[data-status]");
        if (st) st.textContent = it.statusText;
        const lbl = row.querySelector("[data-nowlbl]");
        if (lbl) { lbl.textContent = it.nowLabel; lbl.hidden = !it.showNow; }
        placeNowLabels(true);
      } else if (it.type === "lesson" && it.st === "next") {
        const st = app.querySelector(`[data-cur] [data-row="${it.i}"] [data-status]`);
        if (st) st.textContent = it.statusText;
      } else if (it.type === "break" && it.active) {
        const b = app.querySelector(`[data-cur] [data-brk="${it.i}"]`);
        if (!b) continue;
        b.style.setProperty("--p", it.p + "%");
        const t = b.querySelector("[data-btext]");
        if (t) t.textContent = `Перерыв · ${it.text}`;
        const nl = b.querySelector("[data-bnow]");
        if (nl) nl.textContent = it.nowLabel;
      }
    }
    const hero = m.hero && app.querySelector("[data-cur] [data-hero]");
    if (hero) {
      const t = heroLeft(m.hero);
      const fill = hero.querySelector("[data-hfill]");
      if (fill) { if (fill.tagName.toLowerCase() === "circle") fill.style.strokeDashoffset = 100 - m.hero.p; else fill.style.width = m.hero.p + "%"; }
      const big = hero.querySelector("[data-hbig]"), unit = hero.querySelector("[data-hunit]");
      if (big) big.textContent = t.big;
      if (unit) unit.textContent = t.unit;
    }
  }

  // ---------------- пружины и переходы ----------------
  let springCache = null;
  // Пружинная кривая из CSS (--ease-spring); если linear() не поддерживается — обычная плавная
  function springEase() {
    if (springCache) return springCache;
    const v = getComputedStyle(ROOT).getPropertyValue("--ease-spring").trim() || "cubic-bezier(.4, 0, .2, 1)";
    try { document.body.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1, easing: v }).cancel(); springCache = v; }
    catch (e) { springCache = "cubic-bezier(.4, 0, .2, 1)"; }
    return springCache;
  }
  // Переход на другой день/неделю по нажатию (свайп пальцем идёт своей дорогой — через ленту).
  let quietCommit = false;
  function moveTo(np) {
    const c = curPos();
    if (!c || !np) return;
    const k = (np.w - c.p.w) * 7 + (np.d - c.p.d);
    if (!k) return;
    // Нажатие на день: выделение сразу встаёт на нужный день, а новый день появляется коротким
    // сдвигом — без пролёта через промежуточные дни.
    pos[c.id] = np;
    opened.clear();
    enterNext = false;
    slideDir = Math.sign(k);
    render();
  }

  // ---------------- липкая шапка ----------------
  // Как «большой заголовок» в iOS: при прокрутке полоса с днями прилипает к верху на стекле,
  // а заголовок недели сжимается. Порог с запасом (56 / 8 px), чтобы не дрожало на границе.
  let barSmall = false;
  function syncBar() {
    const bar = app.querySelector(".sbar");
    if (!bar) return;
    const y = window.scrollY;
    if (!barSmall && y > 56) barSmall = true;
    else if (barSmall && y < 8) barSmall = false;
    bar.classList.toggle("stuck", y > 2);
    bar.classList.toggle("small", barSmall);
  }
  window.addEventListener("scroll", syncBar, { passive: true });

  // ---------------- события ----------------
  app.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    const id = view === "teacher" ? target : "g";

    if (act === "day") {
      const d = +el.dataset.d;
      if (pos[id] && pos[id].d !== d) { haptic("select"); moveTo({ w: pos[id].w, d }); }
    } else if (act === "week") {
      const data = mem[id];
      const w = pos[id].w + (+el.dataset.dir);
      if (data && w >= 0 && w < data.weeks.length) { haptic("select"); moveTo({ w, d: pos[id].d }); }
    } else if (act === "today") {
      if (mem[id]) {
        haptic("light");
        moveTo(pickDefault(mem[id]));
      }
    } else if (act === "teacher") {
      haptic("light");
      go("teacher", el.dataset.t, true);
    } else if (act === "open") {
      toggleCard(el.dataset.key);
    } else if (act === "back") {
      back();
    } else if (act === "notif") {
      haptic("light");
      go("notif", null, true);
    } else if (act === "fs") {
      haptic("select");
      setFullscreen(!tg.isFullscreen);
    } else if (act === "to-settings") {
      haptic("light");
      go("settings", null, true);
      const sec = document.getElementById("nsec");
      if (sec) requestAnimationFrame(() => sec.scrollIntoView({ block: "start", behavior: "smooth" }));
    } else if (act === "install") {
      haptic("light");
      promptInstall();
    } else if (act === "install-open") {
      haptic("light");
      openInstallPage();
    } else if (act === "notify-settings") {
      openNotifySettings();
    } else if (act === "ntoggle") {
      if (!canEditNotify()) return;
      const k = el.dataset.k;
      nstate[k] = !nstate[k];
      el.setAttribute("aria-checked", String(nstate[k]));
      if (k === "on") { const row = document.getElementById("nminrow"); if (row) row.hidden = !nstate.on; }
      haptic("select");
      scheduleSave();
    } else if (act === "jump") {
      const date = el.dataset.date;
      const g = mem.g;
      if (g && date) {
        const w = g.weeks.findIndex((x) => x.monday === mondayOf(date));
        if (w >= 0) pos.g = { w, d: weekday(date) };
      }
      haptic("select");
      go("schedule", "g", false);
    } else if (act === "retry") {
      delete mem[id];
      render();
    } else if (act === "retry-net") {
      haptic("light");
      el.textContent = "Обновляю…";
      refreshNow();
    } else if (act === "icon-style") {
      store.set("iconStyle", el.dataset.v);
      try { window.applyIconStyle(el.dataset.v); } catch (e) { /* старая страница */ }
      haptic("select");
      renderSettings();
    } else if (act === "theme") {
      store.set("theme", el.dataset.v);
      applyTheme();
      haptic("select");
      renderSettings();
    } else if (act === "site") {
      const g = mem.g;
      const w = g && pos.g ? g.weeks[pos.g.w] : g && g.weeks[0];
      const url = (w && w.url) || "https://www.samgups.ru/raspisanie_v2/";
      if (inTG && tg.openLink) { try { tg.openLink(url); return; } catch (e) { /* ниже — обычное окно */ } }
      window.open(url, "_blank", "noopener");
    }
  });

  app.addEventListener("change", (ev) => {
    if (ev.target.id !== "nmin" || !canEditNotify()) return;
    nstate.min = +ev.target.value;
    haptic("select");
    scheduleSave();
  });

  app.addEventListener("input", (ev) => {
    if (ev.target.id !== "q") return;
    query = ev.target.value;
    const box = document.getElementById("tlists");
    if (box && index) box.innerHTML = teacherListsHTML();
  });

  // «Расписание» внизу: с другого раздела — возвращает к расписанию, а если уже в нём — к сегодняшнему дню
  function goToday() {
    const data = mem.g;
    if (!data || !data.weeks || !data.weeks.length) return;
    const def = pickDefault(data), p = pos.g;
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (p && p.w === def.w && p.d === def.d) return;   // уже сегодня — просто наверх
    if (!p) { pos.g = def; render(); return; }
    moveTo(def);   // рядом — плавная прокрутка ленты, далеко — сдвиг страницы
  }
  tabs.forEach((b) => b.addEventListener("click", () => {
    const t = b.dataset.tab;
    haptic("select");
    if (t === "schedule") {
      if (view === "schedule") goToday();
      else go("schedule", "g", false);
    } else if (view === t) {
      // уже открыта эта вкладка — не перерисовываем заново, просто наверх
      window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
    } else go(t, null, false);
  }));

  // ---------------- свежие данные при возвращении ----------------
  // Если приложение долго висело свёрнутым — тихо подтягиваем то, что бот выложил за это время.
  let loadedAt = Date.now(), loadedDate = samaraNow().date, reloading = false;
  // Принудительно: по кнопке «Повторить», при появлении сети и раз в минуту, пока показано сохранённое
  function refreshNow() { loadedAt = 0; reloadIfStale(true); }
  window.addEventListener("online", () => { if (mem.g && mem.g._offline) refreshNow(); });
  setInterval(() => { if (mem.g && mem.g._offline && !document.hidden) refreshNow(); }, 60 * 1000);
  async function reloadIfStale(force) {
    if (reloading || (document.hidden && !force) || Date.now() - loadedAt < 10 * 60 * 1000) return;
    reloading = true;
    try {
      const [i, mt, ch, g] = await Promise.all([fetchJSON("data/index.json"), fetchJSON("data/meta.json"),
        fetchJSON("data/changes.json"), fetchJSON("data/g.json")]);
      if (g._offline) { if (force) { render(); toast(lastNetError ? `Не отвечает — ${lastNetError}` : "Нет сети"); } return; }
      const newDay = samaraNow().date !== loadedDate;
      for (const id of Object.keys(pos)) {
        const w = mem[id] && mem[id].weeks[pos[id].w];
        if (newDay || !w) delete pos[id];          // наступил новый день — открываем сегодня
        else keepMonday[id] = w.monday;            // иначе — та же неделя и день, что были
      }
      for (const k of Object.keys(mem)) delete mem[k];
      index = i; meta = mt; changes = ch; mem.g = g;
      loadedAt = Date.now(); loadedDate = samaraNow().date;
      opened.clear();
      if (view !== "teachers") render();   // в списке преподавателей не сбиваем поиск
    } catch (e) {
      /* нет сети — попробуем в следующий раз */
    } finally {
      reloading = false;
    }
  }

  // ---------------- раскрытие карточки пары ----------------
  // Меняем только эту карточку и плавно тянем её высоту — остальной экран не перерисовываем
  function toggleCard(key) {
    opened.has(key) ? opened.delete(key) : opened.add(key);
    haptic("select");
    const isTeacher = view === "teacher";
    const id = isTeacher ? target : "g";
    const data = mem[id], p = pos[id];
    const btn = [...app.querySelectorAll("[data-cur] [data-key]")].find((x) => x.dataset.key === key);
    const row = btn && btn.closest(".row");
    if (!data || !p || !row || REDUCED || scrolling) { render(); return; }
    const m = dayModel(data, p.w, p.d, isTeacher);
    const it = m.items.find((x) => x.type === "lesson" && x.key === key);
    if (!it) { render(); return; }
    const oldBody = row.querySelector(".card, .cc");
    const ob = oldBody.getBoundingClientRect(), rb = row.getBoundingClientRect();
    const h0 = ob.height;
    const r0 = getComputedStyle(oldBody).borderTopLeftRadius;   // скругление старой карточки (пока она ещё на странице)
    const oldTitle = oldBody.querySelector("h3");
    const t0 = oldTitle ? oldTitle.getBoundingClientRect() : null;
    const f0 = oldTitle ? parseFloat(getComputedStyle(oldTitle).fontSize) : 0;
    const oldSeg = row.querySelector(".seg");
    const s0 = oldSeg ? oldSeg.getBoundingClientRect().height : 0;
    // где стояли пары ниже — потом они плавно доедут до новых мест
    const after = [];
    for (let el = row.nextElementSibling; el; el = el.nextElementSibling) after.push([el, el.getBoundingClientRect().top]);
    const list = row.parentElement;
    if (list) list.classList.remove("enter");   // чтобы не проиграть заново анимацию появления
    const tmp = document.createElement("ol");
    tmp.innerHTML = lessonHTML(it, parseInt(row.style.getPropertyValue("--i"), 10) || 0, isTeacher);
    const fresh = tmp.firstElementChild;
    row.replaceWith(fresh);
    liveSig = m.sig;
    const body = fresh.querySelector(".card, .cc");
    const h1 = body.getBoundingClientRect().height;
    const d = h1 - h0;   // > 0 — раскрываем, < 0 — сворачиваем
    if (d >= 0) fitPager(); else setTimeout(fitPager, springEase().startsWith("linear") ? 540 : 340);

    // Всё движение — сдвигами и масками, которые телефон считает на видеокарте:
    // страница под карточкой не перерисовывается каждый кадр, поэтому без рывков
    const ease = springEase(), dur = ease.startsWith("linear") ? 520 : 320, opt = { duration: dur, easing: ease };
    const radius = getComputedStyle(body).borderTopLeftRadius;

    // 1) пары ниже съезжают со старого места на новое
    for (const [el, top0] of after) {
      const dy = top0 - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 0.5) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], opt);
    }
    // 2) линия слева растёт/укорачивается вместе с карточкой, кружок на конце остаётся круглым
    const seg = fresh.querySelector(".seg");
    if (seg && s0) {
      const s1 = seg.getBoundingClientRect().height || 1, k = s0 / s1;
      seg.style.transformOrigin = "50% 0";
      seg.animate([{ transform: `scaleY(${k})` }, { transform: "none" }], opt);
      const cap = seg.querySelector(".cap");
      if (cap) { cap.style.transformOrigin = "50% 100%"; cap.animate([{ transform: `scaleY(${1 / k})` }, { transform: "none" }], opt); }
    }
    // 3) сама карточка: при раскрытии — открывается маской сверху вниз,
    //    при сворачивании — старая карточка под ней поджимается той же маской
    const ghost = oldBody.cloneNode(true);
    ghost.removeAttribute("data-act");
    ghost.setAttribute("aria-hidden", "true");
    Object.assign(ghost.style, {
      position: "absolute", top: `${ob.top - rb.top}px`, left: `${ob.left - rb.left}px`, width: `${ob.width}px`,
      height: `${h0}px`, margin: "0", pointerEvents: "none",
    });
    const gt = ghost.querySelector("h3");
    if (gt) gt.style.visibility = "hidden";
    fresh.style.position = "relative";
    const cleanup = () => { ghost.remove(); fresh.style.position = ""; body.style.cssText = ""; };
    if (d >= 0) {
      Object.assign(ghost.style, { background: "transparent", borderColor: "transparent", boxShadow: "none", zIndex: "2" });
      fresh.appendChild(ghost);
      body.animate([{ clipPath: `inset(0px 0px ${d}px 0px round ${radius})` }, { clipPath: `inset(0px 0px 0px 0px round ${radius})` }], opt);
      ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: "ease-out", fill: "forwards" })
        .finished.then(cleanup).catch(cleanup);
    } else {
      ghost.style.zIndex = "0";
      fresh.insertBefore(ghost, fresh.firstChild);
      Object.assign(body.style, { position: "relative", zIndex: "1", background: "transparent", borderColor: "transparent" });
      ghost.animate([{ clipPath: `inset(0px 0px 0px 0px round ${r0})` }, { clipPath: `inset(0px 0px ${-d}px 0px round ${radius})` }], { ...opt, fill: "forwards" })
        .finished.then(cleanup).catch(cleanup);
      for (const c of ghost.children) c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: "ease-out", fill: "forwards" });
    }
    // 4) название переезжает на новое место
    const title = body.querySelector("h3");
    let span = null;   // полоса, по которой едет название: новые строки в ней появляются, когда оно уже проехало
    if (title && t0) {
      const t1 = title.getBoundingClientRect();
      span = [Math.min(t0.top, t1.top), Math.max(t0.bottom, t1.bottom)];
      const k = f0 / (parseFloat(getComputedStyle(title).fontSize) || f0);
      title.style.transformOrigin = "0 0";
      title.animate([{ transform: `translate(${t0.left - t1.left}px, ${t0.top - t1.top}px) scale(${k})` }, { transform: "none" }], opt);
    }
    // 5) новые строки проявляются
    for (const c of body.children) {
      if (c === title) continue;
      const r = c.getBoundingClientRect();
      const late = span && r.bottom > span[0] && r.top < span[1];
      c.animate([{ opacity: 0 }, { opacity: 1 }],
        late ? { duration: 160, delay: 160, easing: "ease-out", fill: "backwards" }
             : { duration: 220, delay: 30, easing: "ease-out", fill: "backwards" });
    }
  }

  // ---------------- листание дней ----------------
  // Вчера | сегодня | завтра лежат в горизонтальной прокрутке с защёлкиванием. Листает сам телефон,
  // а когда лента остановилась на соседнем дне, делаем его текущим и незаметно перерисовываем ленту.
  const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let scrolling = false, pagerTouch = false, settleTimer = 0, scrollFrame = 0;
  function pagerEl() { return app.querySelector("[data-pager]"); }
  function curIndex(pg) { return pg.querySelectorAll(":scope > .page.prev").length; }
  function curPos() {
    if (view !== "schedule" && view !== "teacher") return null;
    const id = view === "teacher" ? target : "g";
    return mem[id] && pos[id] ? { id, data: mem[id], p: pos[id] } : null;
  }
  function hasNeighbor(dir) {
    const c = curPos();
    return !!(c && neighborPos(c.data, c.p.w, c.p.d, dir));
  }
  // Высота ленты — как у текущего дня, но до низа экрана: соседние дни при листании видны целиком,
  // а пустого места для прокрутки под коротким днём не появляется
  function fitPager() {
    const pg = pagerEl();
    const cur = pg && pg.querySelector("[data-cur]");
    if (!cur) return;
    const top = pg.getBoundingClientRect().top + window.scrollY;
    const padBottom = parseFloat(getComputedStyle(app).paddingBottom) || 0;   // место под нижней панелью
    const visible = window.innerHeight - top - padBottom;
    pg.style.height = `${Math.max(cur.offsetHeight, Math.round(visible))}px`;
  }
  function setupPager() {
    const pg = pagerEl();
    if (!pg) return;
    fitPager();
    pg.scrollLeft = curIndex(pg) * pg.clientWidth;
    pg.addEventListener("scroll", onPagerScroll, { passive: true });
    pg.addEventListener("touchstart", () => { fillNeighbors(); pagerTouch = true; }, { passive: true });
    pg.addEventListener("wheel", fillNeighbors, { passive: true });
    clearTimeout(fillTimer);
    fillTimer = setTimeout(fillNeighbors, slideDir || enterNext ? 450 : 150);   // после анимации появления
  }
  // Достроить соседние дни слева и справа, не сдвигая текущий (скролл компенсируем в том же кадре)
  let pendingNeighbors = null, fillTimer = 0, suppressScroll = false;
  function fillNeighbors() {
    clearTimeout(fillTimer);
    const pg = pagerEl();
    if (!pendingNeighbors || !pg) return;
    const nb = pendingNeighbors();
    pendingNeighbors = null;
    if (nb.prev) pg.insertAdjacentHTML("afterbegin", nb.prev);
    if (nb.next) pg.insertAdjacentHTML("beforeend", nb.next);
    suppressScroll = true;
    pg.scrollLeft = curIndex(pg) * pg.clientWidth;
  }
  {
    const up = (e) => { if (e.touches && e.touches.length) return; if (pagerTouch) { pagerTouch = false; if (scrolling) armSettle(); } };
    document.addEventListener("touchend", up, { passive: true, capture: true });
    document.addEventListener("touchcancel", up, { passive: true, capture: true });
  }
  function onPagerScroll() {
    if (suppressScroll) { suppressScroll = false; return; }   // это мы сами поправили позицию после достройки
    scrolling = true;
    if (!scrollFrame) scrollFrame = requestAnimationFrame(paintPaging);
    armSettle();
  }
  function armSettle() {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(settlePager, 110);
  }
  // Пока лента едет: проявляем рамки-карточки и переносим подсветку дня в строке сверху
  function paintPaging() {
    scrollFrame = 0;
    const pg = pagerEl();
    if (!pg) return;
    const W = pg.clientWidth || 1;
    const off = pg.scrollLeft / W - curIndex(pg);              // -1 … 1
    const d = Math.abs(off - Math.round(off));                  // насколько далеко от «ровного» дня
    const o = REDUCED ? "0" : Math.min(1, d * 5).toFixed(2);
    pg.querySelectorAll(".pframe").forEach((el) => { el.style.opacity = o; });
    previewChips(Math.round(off));
  }
  function settlePager() {
    const pg = pagerEl();
    if (!pg || pagerTouch) return;                              // палец ещё на экране — ждём
    const W = pg.clientWidth || 1;
    const k = Math.round(pg.scrollLeft / W);
    if (Math.abs(pg.scrollLeft - k * W) > 1.5) { armSettle(); return; }   // ещё доезжает до места
    scrolling = false;
    pg.querySelectorAll(".pframe").forEach((el) => { el.style.opacity = "0"; });
    const dir = k - curIndex(pg);
    if (dir) commitDay(dir);
  }
  // Подсветка дня в строке сверху — сразу, как только понятно, куда листаем
  function previewChips(dir) {
    const c = curPos();
    if (!c) return;
    const np = dir ? stepPos(c.data, c.p, dir) : c.p;
    if (!np || np.w !== c.p.w) return;
    const week = c.data.weeks[np.w], today = samaraNow().date;
    app.querySelectorAll(".days .day").forEach((b) => {
      const d = +b.dataset.d, on = d === np.d;
      if (b.classList.contains("on") === on) return;
      b.classList.toggle("on", on);
      b.classList.toggle("dim", addDays(week.monday, d) < today && !on);
      b.setAttribute("aria-pressed", String(on));
    });
  }
  function commitDay(dir) {
    const c = curPos();
    const np = c && stepPos(c.data, c.p, dir);
    if (!np) return;
    pos[c.id] = np;
    opened.clear();
    enterNext = false;
    slideDir = 0;
    if (!quietCommit) haptic("select");
    quietCommit = false;
    render();   // новый день стоит ровно там же, где остановилась лента, — подмена незаметна
  }
  // Пролистать на соседний день кнопкой/клавишей — той же плавной прокруткой
  function shiftDay(dir) {
    const pg = pagerEl();
    if (!pg || !hasNeighbor(dir)) return false;
    fillNeighbors();
    pg.scrollTo({ left: (curIndex(pg) + dir) * pg.clientWidth, behavior: REDUCED ? "auto" : "smooth" });
    return true;
  }
  // На компьютере — стрелками ← →
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest("input, select, textarea")) return;
    if (e.key === "ArrowRight" && shiftDay(1)) e.preventDefault();
    else if (e.key === "ArrowLeft" && shiftDay(-1)) e.preventDefault();
  });
  // Поворот экрана и т. п. — пересобираем ленту под новую ширину
  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if ((view === "schedule" || view === "teacher") && !scrolling) render(); }, 150);
  });

  // ---------------- полноэкранный режим ----------------
  // Только на телефонах (на компьютере «во весь экран» — это весь монитор). По умолчанию включён.
  const MOBILE = inTG && /^(ios|android|android_x)$/.test(String(tg.platform));
  let fsFailed = false;
  const fsSupported = () => MOBILE && !fsFailed && tgAtLeast("8.0") && typeof tg.requestFullscreen === "function";
  function applyInsets() {
    if (!tg) return;
    const fs = !!tg.isFullscreen;
    const sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
    // Сверху в полноэкранном режиме — строка состояния телефона и кнопки Telegram «Закрыть» / «⋯»
    ROOT.style.setProperty("--safe-top", fs ? `${(+sa.top || 0) + (+ca.top || 0)}px` : "0px");
    ROOT.style.setProperty("--safe-bottom", `${(+sa.bottom || 0) + (+ca.bottom || 0)}px`);
    ROOT.classList.toggle("fs", fs);
  }
  function setFullscreen(on) {
    if (!fsSupported()) return;
    try { on ? tg.requestFullscreen() : tg.exitFullscreen(); } catch (e) { /* старый клиент */ }
  }

  // ---------------- запуск ----------------
  if (tg && tgAtLeast("8.0")) {
    for (const ev of ["safeAreaChanged", "contentSafeAreaChanged"]) {
      try { tg.onEvent(ev, applyInsets); } catch (e) { /* старый клиент */ }
    }
    try {
      tg.onEvent("fullscreenChanged", () => {
        applyInsets();
        store.set("fullscreen", tg.isFullscreen ? "1" : "0");
        if (view === "settings") renderSettings();
      });
      tg.onEvent("fullscreenFailed", (e) => {
        if (e && e.error === "UNSUPPORTED") { fsFailed = true; if (view === "settings") renderSettings(); }
      });
    } catch (e) { /* старый клиент */ }
    applyInsets();
  }
  if (tg) {
    try { tg.ready(); } catch (e) { /* вне Telegram */ }
    try { tg.expand(); } catch (e) { /* вне Telegram */ }
    if (tgAtLeast("7.7")) { try { tg.disableVerticalSwipes(); } catch (e) { /* старый клиент */ } }
    if (tgAtLeast("6.1")) { try { tg.BackButton.onClick(back); } catch (e) { /* старый клиент */ } }
    try { tg.onEvent("themeChanged", applyTheme); } catch (e) { /* старый клиент */ }
  }
  if (window.matchMedia) {
    try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme); } catch (e) { /* старый браузер */ }
  }
  applyTheme();
  syncTabs();
  // Во весь экран — сразу при запуске, если не выключали в настройках
  if (fsSupported() && store.get("fullscreen") !== "0" && !tg.isFullscreen) setFullscreen(true);

  // Сначала скелет, потом всё нужное для первого экрана разом — чтобы анимация не обрывалась
  app.innerHTML = skeletonHTML();
  Promise.all([
    fetchJSON("data/index.json").then((j) => { index = j; }).catch(() => {}),
    fetchJSON("data/meta.json").then((j) => { meta = j; }).catch(() => {}),
    fetchJSON("data/changes.json").then((j) => { changes = j; }).catch(() => { changes = { items: [] }; }),
    load("g").catch(() => {}),
  ]).then(() => {
    loadedAt = Date.now();
    render();
    if (QS.get("install") === "1" && !inTG) {
      // убираем служебные параметры из адреса — иконка на iPhone запомнит чистую ссылку
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* не страшно */ }
      setTimeout(showInstallSheet, 300);
    } else setTimeout(showInstallBar, 4000);
  });

  setInterval(tick, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); reloadIfStale(); } });

  // ---------------- PWA: офлайн и установка ----------------
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
    if (document.readyState === "complete") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
};
window.__boot();
</script>
</body>
</html>
