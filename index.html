<link rel="manifest" id="lnkManifest" href="manifest.webmanifest">
<link rel="icon" id="lnkFav" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" id="lnkTouch" href="icons/apple-touch-icon.png">
<script>
  // Вид иконки на рабочем столе (выбирается в настройках): light | dark. Не выбран — по теме телефона.
  // iPhone и Android берут иконку в момент установки — поэтому подставляем нужную сразу.
  window.iconAuto = function () { return window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; };
  window.applyIconStyle = function (st) {
    if (st !== "light" && st !== "dark") st = window.iconAuto();
    var suf = st === "light" ? "-light" : "-dark";
    document.getElementById("lnkManifest").href = "manifest" + suf + ".webmanifest";
    document.getElementById("lnkFav").href = "icons/favicon-64" + suf + ".png";
    document.getElementById("lnkTouch").href = "icons/apple-touch-icon" + suf + ".png";
  };
  try {
    var fromUrl = new URLSearchParams(location.search).get("icon");   // выбор, сделанный внутри Telegram
    if (/^(light|dark)$/.test(fromUrl || "")) localStorage.setItem("iconStyle", fromUrl);
    applyIconStyle(localStorage.getItem("iconStyle") || fromUrl);
  } catch (e) { applyIconStyle(""); }
</script>

<script>
  // Скрипт Telegram грузим только внутри Telegram и не ждём его дольше 3 секунд:
  // если telegram.org тормозит, приложение всё равно откроется (просто без кнопок Telegram).
  (function () {
    var inTg = /tgWebApp/.test(location.hash + location.search) || !!window.TelegramWebviewProxy || window.parent !== window;
    var tgDone = !inTg, appReady = false, started = false;
    function go() { if (!started && tgDone && appReady && window.__appStart) { started = true; window.__appStart(); } }
    window.__boot = function () { appReady = true; go(); };
    if (inTg) {
      var s = document.createElement("script");
      s.src = "https://telegram.org/js/telegram-web-app.js";
      s.onload = s.onerror = function () { tgDone = true; go(); };
      document.head.appendChild(s);
      setTimeout(function () { tgDone = true; go(); }, 3000);
    }
  })();
</script>
<style>
/* ---------- палитра ---------- */
html[data-theme="dark"] {
  color-scheme: dark;

  --text: #ECEEF2; --text2: #C3C8D1; --muted: #A3AAB6; --faint: #737B89;

    --past-title: #B0B6C1; --past-muted: #9AA1AD;
   --done: #4A505C; --today-border: #3A4150;
  --tag-bg: #16261C; --tag-fg: #3DDC84; --warn-bg: #2A2417; --warn-fg: #FFB547;
  --red-bg: #2E1B1A; --red-fg: #FF8A7A;  --unread: #1A1E26;
   --track-a: .32; --badge-a: .15;

  --av-s: 30%; --av-l: 19%; --avf-s: 85%; --avf-l: 76%;
   --elev: none;
    --glass-shadow: 0 12px 32px rgba(0, 0, 0, .45);
}
html[data-theme="light"] {
  color-scheme: light;

  --text: #14171C; --text2: #363C48; --muted: #565D69; --faint: #80868F;

    --past-title: #4A515C; --past-muted: #565D69;
  --dot-past: #D3D7DF; --done: #B8BEC8; --today-border: #AEB4BF;
  --tag-bg: #E2F4E9; --tag-fg: #0B7A3B; --warn-bg: #FDF1DC; --warn-fg: #9A5A00;
  --red-bg: #FDE7E4; --red-fg: #C0392B;  --unread: #F3F7FF;
   --track-a: .32; --badge-a: .12;

  --av-s: 80%; --av-l: 94%; --avf-s: 55%; --avf-l: 38%;

}
/* светлая тема: синий текст (ссылки, «сегодня», преподаватель) — чуть темнее, чтобы мелкие надписи читались */
html[data-theme="light"] :is(.tlink, .flink, .wlink, .tag, .t-room, .wl.cur, .ymore summary) { color: #0059DB; }
html[data-theme="light"] .day.today:not(.on) :is(.n, .s) { color: #0059DB; }
.k-lec  { --k-fg: var(--lec-fg);  --k-bar: var(--lec-bar);  --k-rgb: var(--lec-rgb); }
.k-prac { --k-fg: var(--prac-fg); --k-bar: var(--prac-bar); --k-rgb: var(--prac-rgb); }
.k-lab  { --k-fg: var(--lab-fg);  --k-bar: var(--lab-bar);  --k-rgb: var(--lab-rgb); }
.k-oth  { --k-fg: var(--oth-fg);  --k-bar: var(--oth-bar);  --k-rgb: var(--oth-rgb); }

/* ---------- основа ---------- */
* { box-sizing: border-box; }
:root { --side: 20px; }   /* поля по бокам экрана */
html, body { margin: 0; background: var(--bg); }
/* Двойное касание на iPhone не должно ничего увеличивать и прокручивать — только два обычных нажатия */
*, *::before, *::after { touch-action: manipulation; }
body {
  color: var(--text); font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg { flex: none; }
#app, .snap {
  max-width: 520px; margin: 0 auto; min-height: 100vh; overflow-x: clip;
  padding: calc(16px + var(--safe-top, 0px) + var(--top-gap, 0px)) var(--side) calc(92px + max(env(safe-area-inset-bottom), var(--safe-bottom, 0px)));
}
.fade { animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }

/* ---------- шапка ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0;  font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.icon-btn { width: 44px; padding: 0; color: var(--text); }
.offline {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 10px;
  border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); font-size: 12px; font-weight: 600;
}

/* ---------- неделя и дни ---------- */
.week {
  display: flex; align-items: center;
    border-radius: 16px;
}
.week button {
    flex: none; border: 0;
  color: var(--text); display: grid; place-items: center; padding: 0;
}
.week button:disabled { opacity: .3; cursor: default; }
.week .mid { flex: 1; min-width: 0; display: flex; flex-direction: column;   }
.wl {  font-weight: 600;  text-transform: uppercase; color: var(--muted); min-height: 13px; }
.wl.cur { color: var(--accent); }
.wr {   font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));   }
.day {
   padding: 0;  border: 1px solid var(--border);
  color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;

}

.day .n {  font-weight: 700; font-variant-numeric: tabular-nums; }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--k-bar); }
.day.dim { color: var(--muted); background: transparent; opacity: .62; }
.day.dim .dots i { background: var(--faint); }

.day.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day.on .dots i { background: var(--on-accent); }
.dayhead { display: flex; flex-direction: column;   }
.dayhead .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dayhead h2 { margin: 0;   }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;   }
.summary { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- лента пар ---------- */
.tl { list-style: none; margin: 0; padding: 0; }
.row, .brk { display: grid; grid-template-columns: 48px 14px minmax(0, 1fr); column-gap: 12px; }
.time { position: relative; padding-top: 0; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.time .st { font-size: 15px; font-weight: 700; line-height: 19px; }
.time .en { font-size: 13px; line-height: 16px; color: var(--muted); transition: opacity .3s ease; }
/* текущее время встало на место «10:00» — конец пары прячем, пока подпись не уедет ниже */
.row.en-off .time .en { opacity: 0; }
.row.quiet .time .en { transition: none; }
.row.live .time .st { color: var(--k-fg); }
.row.past .time .st { color: var(--past-muted); }

/* Линия пары — ровно по высоте карточки: точка у верхнего края, кружок у нижнего */
.rail { display: flex; flex-direction: column; align-items: center; isolation: isolate; padding-bottom: 3px; }
.seg-top { width: 2px; height: 3px; flex: none; background: var(--border); }
.row.first .seg-top { background: transparent; }
.row.after-past .seg-top { background: var(--done); }
.dot {
  position: relative; width: 12px; height: 12px; flex: none; border-radius: 50%;
  border: 2px solid var(--k-bar); background: var(--bg);
}
.row.live .dot { background: var(--k-bar); }
.row.past .dot { border-color: var(--done); background: var(--dot-past); }
.row.live .dot::after, .row.next .dot::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%; z-index: -1;
  background: rgba(var(--k-rgb), .45); animation: halo 2.4s ease-in-out infinite;
}
.row.next .dot::after { background: rgba(var(--k-rgb), .32); animation-duration: 4.8s; }
@keyframes halo { 0%, 100% { transform: scale(.5); opacity: .95; } 50% { transform: scale(1.2); opacity: 0; } }
.seg { position: relative; flex: 1; width: 4px; border-radius: 2px; background: rgba(var(--k-rgb), var(--track-a)); }
.row.past .seg { width: 2px; background: var(--done); }
.row.past.last .seg { background: transparent; }
.fill { position: absolute; left: 0; top: 0; width: 100%; height: var(--p); border-radius: 2px; background: var(--k-bar); transition: height .6s ease; }
.mark {

.cap {

/* появление ленты при смене дня/недели */


/* Листание дней ведёт приложение само (как в приложениях iOS): лента идёт за пальцем 1:1,
   короткий быстрый бросок перелистывает день, медленный короткий — возвращает. Вертикальная прокрутка — родная. */
.pager {
  display: flex; margin: 0 calc(-1 * var(--side)); overflow: hidden;
  touch-action: pan-y; overscroll-behavior-x: contain; overflow-anchor: none; scrollbar-width: none;
}
.pager::-webkit-scrollbar { display: none; }
.page {
  position: relative; isolation: isolate; flex: 0 0 100%; min-width: 0; align-self: flex-start;
  padding: 0 var(--side); display: flow-root;
}

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px 24px; }
.empty .ic {
  width: 64px; height: 64px; margin-bottom: 6px;  background: var(--surface);
  border: 1px solid var(--border); color: var(--text2); display: grid; place-items: center;
}
.empty .h { font-size: 18px; font-weight: 600; }
.empty .p { max-width: 280px; font-size: 14px; line-height: 1.45; color: var(--muted); text-wrap: balance; }

.sk {
  height: 76px; margin-top: 10px; border-radius: 18px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- преподаватели ---------- */
.search {
  display: flex; align-items: center; gap: 10px;  margin-top: 16px; padding: 0 14px;
   background: var(--surface); border: 1px solid var(--border); color: var(--muted);
}
.search input {
  flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent;
  color: var(--text); font: inherit; font-size: 15px;
}
.search input::placeholder { color: var(--muted); }
.sec {  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--border);  overflow: hidden; }
.item {
  width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border: 0;  background: transparent; color: var(--text); text-align: left;
}
.list > .item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .nm { font-size: 15px; font-weight: 600; }
.item .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chev { color: var(--faint); }
.av {
  width: 40px; height: 40px; flex: none;  display: grid; place-items: center;
  font-size: 14px; font-weight: 700; letter-spacing: -.01em;
  background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) var(--avf-s) var(--avf-l));
}
.av.big { width: 56px; height: 56px;  font-size: 18px; }
.nothing { padding: 18px 14px; font-size: 14px; color: var(--muted); }
.tcard {
  display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 16px;
  background: var(--surface); border: 1px solid var(--border);
}
.tcard .nm { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; }
.tcard .sub { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.4; }

/* ---------- уведомления ---------- */
.bell { position: relative; }
.bell .badge {
  position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px var(--surface);
}

.tile { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; }
.t-cancel { background: var(--red-bg); color: var(--red-fg); }
.t-add { background: var(--tag-bg); color: var(--tag-fg); }
.t-room { background: var(--acc-soft); color: var(--accent); }
.t-other { background: var(--warn-bg); color: var(--warn-fg); }

.srow { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid var(--sep); }
.list > .srow:first-child { border-top: 0; }
.srow .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow .nm { font-size: 15px; font-weight: 600; }
.srow .sub { font-size: 12px; color: var(--muted); }
.sw { width: 60px; height: 44px; flex: none; padding: 0; border: 0; background: transparent; display: grid; place-items: center; }
.sw .tr { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--strong); transition: background .2s; }
.sw .kn {
  position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s;
}
.sw[aria-checked="true"] .tr { background: var(--accent); }
.sw[aria-checked="true"] .kn { transform: translateX(20px); }
.sw:disabled { opacity: .45; cursor: default; }
.selrow { display: flex; align-items: center; gap: 12px; padding: 0 14px 12px 16px; font-size: 14px; color: var(--text2); }
.selrow[hidden] { display: none; }
.selrow span { flex: 1; }
.nsel {
  height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong);
  background: var(--surface2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
}
.nstatus { margin: 8px 4px 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
/* Раскрывающаяся карточка уведомлений: шапка со сводкой, внутри — тумблеры */
.ncard .nhead { min-height: 64px; }
.ncard .nhead .sub { white-space: normal; line-height: 1.35; }
.ncard .nhead .sub.off { color: var(--muted); }
.ncard .nhead .chev svg { transform: rotate(90deg); transition: transform .32s var(--ease-spring, ease); }
.ncard.open .nhead .chev svg { transform: rotate(-90deg); }
.nfold { overflow: hidden; }   /* содержимое выезжает сверху — не заезжает на шапку */
.nfold[hidden] { display: none; }
.nfold .srow:first-child { border-top: 1px solid var(--sep); }
.nfold .nstatus { margin: 0; padding: 4px 16px 14px; }
.nfold .selrow + .srow, .nfold .srow + .srow { border-top: 1px solid var(--sep); }
.nlink { padding: 14px 16px 16px; border-top: 1px solid var(--sep); }
.nlink p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--text2); }
.nlink ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.nlink li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.nlink li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
.nlink .btn.wide { margin-top: 14px; }
.nlink .btn.wide[disabled] { opacity: .7; }
.nlink .nstatus:empty { display: none; }
.nfold .nsub { padding: 14px 16px 2px; border-top: 1px solid var(--sep); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nfold .nsub + .srow { border-top: 0; }
/* потянуть вниз — обновить (ярлык): как в iOS — весь экран тянется вниз, в открывшейся щели
   по одной зажигаются чёрточки индикатора; отпустили — экран чуть задерживается, индикатор крутится */
.ptr { position: fixed; left: 50%; top: calc(var(--safe-top, 0px) + var(--top-gap, 0px)); z-index: 8; width: 28px; height: 28px;
  margin: -14px 0 0 -14px; color: var(--muted); opacity: 0; pointer-events: none; will-change: transform, opacity; }
.ptr svg { display: block; width: 28px; height: 28px; }
.ptr .tk { opacity: 0; }
.ptr.spin svg { animation: ptrspin .8s steps(8) infinite; }
@keyframes ptrspin { to { transform: rotate(360deg); } }
html.ptr-hold #app { will-change: transform; }
/* свайп от края — назад: тень у левого края */
/* свайп назад как в iOS: снимок прошлого экрана под текущим */
.under { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: var(--bg); pointer-events: none; will-change: transform; }
.under *, .under *::before, .under *::after { animation: none !important; transition: none !important; }
.under-dim { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: rgba(0, 0, 0, .14); }
html[data-theme="dark"] .under-dim { background: rgba(0, 0, 0, .42); }
html.nav-anim #app, html.nav-anim .tabs { pointer-events: none; }   /* пока экран едет — нажатия не ловим */
html.swiping #app { position: relative; z-index: 3; background: var(--bg); will-change: transform;
  box-shadow: -1px 0 0 rgba(255, 255, 255, .04), -14px 0 32px rgba(0, 0, 0, .28); }
html[data-theme="light"].swiping #app { box-shadow: -14px 0 30px rgba(0, 0, 0, .14); }
html.swiping, html.swiping body { overflow-x: clip; }   /* уехавший вбок экран не расширяет страницу (иначе телефон «отъезжает» и прыгает нижняя панель) */
.nlink .alt { margin-top: 10px; text-align: center; font-size: 13px; color: var(--muted); }
.nlink .alt .flink { font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .ncard .nhead .chev svg { transition: none; } }
.nstatus.ok { color: var(--tag-fg); }
.nstatus.err { color: var(--red-fg); }

/* Пустой экран уведомлений: всё по центру, блок — посередине свободного места */
#app.fill, .snap.fill { display: flex; flex-direction: column; }
.nempty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px 0 6vh; }
.nempty .empty { padding: 0 16px; }

.nempty .empty .p { text-wrap: balance; }
.nempty .btn.wide { max-width: 360px; margin-top: 24px; }
.nfoot { margin-top: 16px; }
.btn.wide { width: 100%; margin-top: 12px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------- настройки ---------- */
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.lbl15 { font-size: 15px; font-weight: 500; }
.seg3 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px; padding: 4px;  background: var(--bg); }
.seg3 button { height: 44px; padding: 0 4px;  border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.seg3 button.on { background: var(--surface2); border-color: var(--border); color: var(--text); }

.foot { margin: 22px 0 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); }
.flink { border: 0; background: none; padding: 6px 2px; margin: -6px 0; color: var(--accent); font-weight: 600; }
/* Подсказки — тихая чёрная капсула над нижней панелью. Не вверху: в iOS 26 у установленных приложений
   система размывает полосу экрана под часами, и подсказка там выглядит мутной. */
.toast {
  position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom), var(--safe-bottom, 0px)) + 76px); transform: translateX(-50%); z-index: 40;
  display: flex; align-items: center; gap: 8px; height: 36px; max-width: calc(100vw - 32px); padding: 0 14px 0 6px;
  border-radius: 999px; background: #000; color: #EDEEF0; font-size: 13px; font-weight: 600; letter-spacing: .005em; white-space: nowrap;
  box-shadow: 0 0 0 .5px rgba(255, 255, 255, .07), 0 6px 18px rgba(0, 0, 0, .28);
}
html[data-theme="light"] .toast { box-shadow: 0 6px 18px rgba(20, 30, 60, .18); }
.toast.long { height: auto; min-height: 36px; padding-top: 7px; padding-bottom: 7px; border-radius: 19px; white-space: normal; line-height: 1.3; width: max-content; max-width: min(340px, calc(100vw - 32px)); }
.toast .t-ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--tc) 20%, transparent); color: var(--tc); }
.toast .t-ic svg { width: 13px; height: 13px; }
.toast .t-tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.toast { --tc: #6AB0FF; } .toast.t-ok { --tc: #5BE38E; } .toast.t-warn { --tc: #FFBE5C; } .toast.t-trash { --tc: #B9BEC8; }
.toast.act { padding-right: 5px; }
.toast.act button { flex: none; height: 26px; margin-left: 4px; padding: 0 11px; border: 0; border-radius: 999px; font: inherit; font-size: 12.5px; font-weight: 700;
  background: rgba(255, 255, 255, .11); color: #8EC2FF; }

/* Во весь экран сверху — часы телефона и кнопки Telegram «Закрыть» / «⋯». Под ними сплошная полоса
   цвета фона (с мягким краем), чтобы прокрученный текст не залезал под них. */
.topveil { display: none; }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg);  }
#splash[hidden] { display: none; }
/* иконка стоит неподвижно — ровно как на картинке-заставке iPhone, без «моргания» при подмене */
#splash img { width: 112px; height: 112px; border-radius: 25px; margin-top: -48px;
  box-shadow: 0 14px 40px -14px rgba(0, 0, 0, .45); }
/* уход: заставка гаснет целиком (иконка вместе с фоном) — без чёрной паузы между иконкой и расписанием */
#splash { transition: opacity .22s ease-out; }
#splash.out { opacity: 0; pointer-events: none; }

/* iOS 26 размывает полосу чуть ниже статус-бара (и под кнопками Telegram во весь экран).
   Сплошная подложка закрывает эту полосу, а контент начинается ниже — подпись «СОДП-55у» не попадает под размытие. */
.fs { --top-gap: 16px; }
.fs .topveil { display: block; position: fixed; left: 0; right: 0; top: 0; height: calc(var(--safe-top, 0px) + var(--top-gap, 0px)); z-index: 9; background: var(--bg); }
.fs .topveil::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; background: linear-gradient(var(--bg), rgba(0, 0, 0, 0)); pointer-events: none; }

/* ---------- нижняя панель ---------- */
.tabs {
  position: fixed;   bottom: 0; z-index: 10;
   border-top: 1px solid var(--tab-border);

}
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tab {
   border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.tab.on { color: var(--accent); font-weight: 600; }

/* ================= Оформление 2.0 =================
   Меньше рамок: блоки отделяются тоном фона и мягкой тенью. Крупнее заголовки и номер аудитории,
   дни недели — единой «дорожкой», нижняя панель — плавающая полупрозрачная, как в iOS. */
.btn { border-color: var(--hair); box-shadow: var(--elev); }
.icon-btn { border-radius: 50%; }
.btn.wide { border-radius: 16px; box-shadow: 0 8px 22px -10px rgba(var(--acc-rgb), .8); }

/* неделя: заголовок слева, стрелки — круглые кнопки справа */
.week { margin-top: 18px; padding: 0; gap: 8px; background: transparent; border: 0; }
.week .mid { order: -1; align-items: flex-start; gap: 1px; }
.week button { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); box-shadow: var(--elev); }
.wl { font-size: 12px; letter-spacing: .04em; }
.wr { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

/* дни — одна дорожка, выбранный день — плотная капсула */
.days { gap: 2px; margin-top: 12px; padding: 4px; border-radius: 22px;   border: 1px solid var(--border); }
.day { height: auto; min-height: 56px; border-radius: 18px; border-color: transparent; background: transparent; }
.day .s { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; opacity: .65; }
.day .n { font-size: 18px; }
.day.today { border-color: transparent; }
.day.today:not(.on) .n, .day.today:not(.on) .s { color: var(--accent); opacity: 1; }

.day.on .s { opacity: .85; }
.day.dim .s { opacity: 1; }
html[data-theme="light"] .day.dim { opacity: .78; }   /* прошедшие дни и так приглушены целиком — подпись не гасим второй раз */
.dayhead { margin: 20px 2px 10px; gap: 3px; }
.dayhead h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.tag { background: rgba(var(--acc-rgb), .14); color: var(--accent); }

/* карточки пар */
.card { padding: 14px 16px; border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); gap: 9px; }
.card h3 { font-size: 17px; letter-spacing: -.005em; }

.row.next .card { border-color: rgba(var(--k-rgb), .22); }
.row.past .card, .row.past .cc { border-color: transparent; box-shadow: none; }

.meta { gap: 5px; font-size: 13.5px; }
.meta > span:first-child { color: var(--text); font-weight: 600; }   /* аудитория — то, куда идти */
.cc { border-radius: 18px; border-color: var(--hair); box-shadow: var(--elev); padding: 11px 14px; }
.blbl { font-size: 12.5px; }

/* списки и поиск */
.search { height: 50px; border-radius: 16px; border-color: var(--hair); box-shadow: var(--elev); }
.list { border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); }
.item { position: relative; border-top: 0; }
.list > .item + .item::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); }
.av { border-radius: 50%; }
.av.big { border-radius: 50%; }
.tcard { border-radius: 24px; border-color: var(--hair); box-shadow: var(--elev); }
.empty .ic { border-radius: 22px; border-color: var(--hair); box-shadow: var(--elev); }
.seg3 { border-radius: 16px; }
.seg3 button { border-radius: 12px; }
.sec { margin: 24px 6px 8px; }

/* нижняя панель — плавающая капсула над полоской «домой» */
.tabs {
    bottom: max(10px, env(safe-area-inset-bottom), var(--safe-bottom, 0px));
   margin: 0 auto;
  background: var(--glass);
}
.tab {   transition: background .2s, color .2s; }

   /* контраст подписи ≥ 4.5:1 на подсветке */

/* шапка: над заголовком везде название группы; у расписания заголовок — неделя, рядом стрелки и колокольчик */
h1 { font-size: 24px; margin-top: 4px; }
/* Кнопки стоят по центру строки с неделей (а не посередине между подписью и неделей, как раньше).
   Сетка: подпись — первая строка, неделя — вторая; кнопки во второй строке, выступают вверх/вниз поровну. */
.whead {
  --wrfs: clamp(18px, 5.6vw, 22px); --wb: 40px;
  margin-top: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: end;
}
.whead .ht { display: contents; }
.whead .eyebrow { grid-column: 1; grid-row: 1; }
.whead h1.wr { grid-column: 1; grid-row: 2; font-size: var(--wrfs); line-height: 1.15; }
.whead .top-actions { grid-column: 2; grid-row: 2; align-self: end; margin: calc((var(--wrfs) * 1.15 - var(--wb)) / 2) 0; }
.sbar.small .whead { --wrfs: 17px; --wb: 34px; }
.whead .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.whead .eyebrow .wl { font-size: inherit; letter-spacing: inherit; }
h1.wr { font-size: clamp(18px, 5.6vw, 22px); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.whead .top-actions { gap: 6px; flex: none; }
.whead .top-actions .wbtn, .whead .top-actions .icon-btn { width: var(--wb); height: var(--wb); }
.wbtn { flex: none; border: 1px solid var(--hair); border-radius: 50%; background: var(--surface); box-shadow: var(--elev); color: var(--text); display: grid; place-items: center; padding: 0; }
.wbtn:disabled { opacity: .3; cursor: default; }
/* Зона нажатия — не меньше 44 точек (рекомендация Apple), хотя сами кнопки выглядят меньше:
   невидимое поле вокруг кнопки. По бокам — не больше половины промежутка, чтобы соседние не путались */
.wbtn, .icon-btn, .tlink, .flink { position: relative; }
.wbtn::after { content: ""; position: absolute; inset: -2px -3px; border-radius: 50%; }
.whead .wbtn::after, .whead .icon-btn::after {
  content: ""; position: absolute; top: calc(min(0px, (var(--wb, 44px) - 44px) / 2)); bottom: calc(min(0px, (var(--wb, 44px) - 44px) / 2));
  left: -3px; right: -3px; border-radius: 50%;
}
.tlink::after, .flink::after { content: ""; position: absolute; left: -4px; right: -4px; top: -10px; bottom: -10px; }
.whead + .days, .whead + .offline + .days { margin-top: 14px; }

/* свёрнутая карточка: тип — цветной точкой, как в раскрытой; аудитория — жирная, как в раскрытой */
.cc .ln .bar { width: 6px; height: 6px; border-radius: 50%; }
.cc .rm { font-weight: 600; color: var(--text); }
.row.past .cc .rm, .row.past .meta > span:first-child { color: var(--past-title); }

/* ================= Стиль «Глубокий чёрный» =================
   Тёмная тема: чистый чёрный фон (на OLED-экране iPhone чёрные точки не светятся), неоновые цвета пар и свечение.
   Светлая — зеркально: чистый белый фон, насыщенные цвета, вместо свечения цветная тень. */
html[data-theme="dark"] {
  --bg: #000000; --surface: #0D0E11; --surface2: #15171B; --border: #1C1F24; --sep: #17191D; --strong: #2A2D33;
  --hair: rgba(255, 255, 255, .09); --tab-bg: #08090B; --tab-border: #17191D;
  --accent: #4DA3FF; --acc-rgb: 77, 163, 255; --on-accent: #000000; --acc-soft: #0F1D30;

  --oth-fg: #7FDBFF; --oth-bar: #33C8FF; --oth-rgb: 51, 200, 255;
  --past-bg: #07080A; --past-border: #121418; --dot-past: #24272D;
  --glass: rgba(8, 9, 11, .96); --glass-border: rgba(255, 255, 255, .08); --tint-a: .06;
  --glow-card: 0 0 30px -8px; --glow-a: .55; --glow-line: 0 0 12px; --glow-day: 0 0 22px -4px;
}
html[data-theme="light"] {
  --bg: #FFFFFF; --surface: #F5F6F8; --surface2: #ECEEF2; --border: #E6E8EC; --sep: #E9EBEF; --strong: #D5D8DE;
  --hair: rgba(0, 0, 0, .05); --elev: none; --tab-bg: #FFFFFF; --tab-border: #E9EBEF;
  --accent: #0A6CFF; --acc-rgb: 10, 108, 255; --on-accent: #FFFFFF; --acc-soft: #E5EFFF;

  --oth-fg: #006C99; --oth-bar: #14A7E8; --oth-rgb: 20, 167, 232;
  --past-bg: #FAFAFB; --past-border: #F0F1F4;
  --glass: rgba(255, 255, 255, .96); --glass-border: rgba(0, 0, 0, .06); --glass-shadow: 0 10px 30px rgba(0, 0, 0, .10);
  --tint-a: .08;
  --glow-card: 0 14px 30px -12px; --glow-a: .5; --glow-line: 0 2px 8px; --glow-day: 0 8px 20px -6px;
}
.row.live .card { border-color: rgba(var(--k-rgb), .6); box-shadow: var(--glow-card) rgba(var(--k-rgb), var(--glow-a)); }
.row.live .fill, .row.live .mark, .row.live .dot { box-shadow: var(--glow-line) rgba(var(--k-rgb), .85); }
.day.on { box-shadow: var(--glow-day) rgba(var(--acc-rgb), .9); }

html[data-theme="light"] .tab.on { color: #0050CC; }
html[data-theme="light"] .seg3 { background: var(--surface2); }
html[data-theme="light"] .seg3 button.on { background: #FFFFFF; border-color: transparent; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
html[data-theme="light"] .day.today:not(.on) .n, html[data-theme="light"] .day.today:not(.on) .s { color: #0050CC; }

/* Узкие телефоны (360–380 px): чуть меньше полей, чтобы статус пары и подписи не обрезались */
@media (max-width: 380px) {
  .whead .grp { display: none; }
  .whead .eyebrow { font-size: 11px; letter-spacing: .03em; }
  .whead .top-actions { gap: 4px; }   /* в шапке остаётся «Эта неделя» — длинное «Следующая неделя» иначе обрезается */
  :root { --side: 14px; }
  .row, .brk { column-gap: 10px; }
  .card { padding: 12px; }
  .seg3 button { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {

}

/* ================= Современный вид 2026 ================= */

/* --- цвета типов пар (из макета): полоска — насыщенный цвет, подложка — светлая заливка --- */
html[data-theme="light"] {
  --lec-bar: #55B685; --lec-rgb: 85, 182, 133;  --lec-fg: #1F7A4C;  --lec-soft: #EFFDF5;
  --prac-bar: #E9A23B; --prac-rgb: 233, 162, 59; --prac-fg: #8A4E00; --prac-soft: #FEFBED;
  --lab-bar: #845EEE; --lab-rgb: 132, 94, 238;  --lab-fg: #5B34D6;  --lab-soft: #F5F3FE;
  --oth-soft: #EDF7FC;
}
html[data-theme="dark"] {
  --lec-bar: #55B685; --lec-rgb: 85, 182, 133;  --lec-fg: #7FD6AA;  --lec-soft: rgba(85, 182, 133, .16);
  --prac-bar: #E9A23B; --prac-rgb: 233, 162, 59; --prac-fg: #F2BD6B; --prac-soft: rgba(233, 162, 59, .16);
  --lab-bar: #845EEE; --lab-rgb: 132, 94, 238;  --lab-fg: #AD92FF;  --lab-soft: rgba(132, 94, 238, .18);
  --oth-soft: rgba(51, 200, 255, .14);
}
.k-lec  { --k-soft: var(--lec-soft); }
.k-prac { --k-soft: var(--prac-soft); }
.k-lab  { --k-soft: var(--lab-soft); }
.k-oth  { --k-soft: var(--oth-soft); }
/* чип типа — как в легенде: скруглённая полоска цвета + светлая заливка */
.kind { background: var(--k-soft); color: var(--k-fg); box-shadow: none; border-radius: 8px; padding: 4px 10px 4px 6px; }
.kind::before { display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--k-bar); }
html[data-theme="light"] .row.live .card { background: var(--k-soft); }
html[data-theme="light"] .hero { background: radial-gradient(130% 150% at 0% 0%, rgba(var(--k-rgb), .16), rgba(var(--k-rgb), 0) 70%), var(--k-soft); }

/* --- «жидкое стекло»: нижняя панель просвечивает и размывает то, что под ней --- */

html[data-theme="light"] .tabs {

  border-color: rgba(0, 0, 0, .06);

}

/* --- липкая шапка: дни прилипают сверху на стекле, заголовок недели сжимается --- */
.sbar {
  position: sticky; top: calc(var(--safe-top, 0px) + var(--top-gap, 0px)); z-index: 8;
  margin: -10px calc(-1 * var(--side)) -10px; padding: 10px var(--side);
  transition: background-color .25s ease, box-shadow .25s ease;
}
/* фон шапки — сплошной: при прокрутке текст ленты не должен просвечивать под «СОДП-55у» и днями */
.sbar { background: var(--bg); }
.sbar.stuck { box-shadow: 0 1px 0 var(--hair); }

.sbar .eyebrow { max-height: 18px; transition: max-height .25s ease, opacity .2s ease; }
.sbar h1.wr, .sbar .wbtn, .sbar .icon-btn, .sbar .day { transition: font-size .25s ease, width .25s ease, height .25s ease; }
.sbar.small .whead .eyebrow { max-height: 0; opacity: 0; }
.sbar .whead .top-actions { transition: margin .25s ease; }
.sbar.small .days { margin-top: 8px; }
.sbar.small .day { min-height: 48px; }
.sbar .week { margin-top: 0; }
.tcard + .sbar, .tcard + .offline + .sbar { margin-top: 6px; }
.sbar .week + .days { margin-top: 12px; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tabs { background: var(--glass); }
}

/* --- блок «Сейчас», как Live Activity: кольцо, сколько осталось, куда идти --- */
.hero {
  position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px 14px; align-items: center;
  margin: 0 0 16px; padding: 16px; border-radius: 26px;
  background: radial-gradient(130% 150% at 0% 0%, rgba(var(--k-rgb), .24), rgba(var(--k-rgb), .06) 55%, rgba(var(--k-rgb), 0) 85%), var(--surface);
  border: 1px solid rgba(var(--k-rgb), .38);
  box-shadow: 0 20px 44px -24px rgba(var(--k-rgb), .85);
}
html[data-theme="light"] .hero { box-shadow: 0 16px 34px -20px rgba(var(--k-rgb), .55); }
/* кольцо: ровная дуга без свечения, заметная дорожка, цифры по центру */
.hv-ring { grid-template-columns: 72px minmax(0, 1fr); }
.ring { position: relative; width: 72px; height: 72px; align-self: start; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 6; }
.ring .trk { stroke: rgba(var(--k-rgb), .2); }
html[data-theme="light"] .ring .trk { stroke: rgba(var(--k-rgb), .22); }
.ring .arc { stroke: var(--k-bar); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring .rv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.ring .rv b { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring .rv small { font-size: 11px; font-weight: 600; line-height: 1; color: var(--muted); }

.hb { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hl { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--k-fg); }
.hero h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.hr { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
.hr b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
/* длинное место («Лаборатория автоматики №12…») — мельче и не больше двух строк; нет аудитории — тихо */

.hr b.none { font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
/* очень длинное название предмета — не больше трёх строк в «Сейчас» и в свёрнутой карточке (полностью — в раскрытой) */
.hero h3, .cc h3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hr span { font-size: 13px; color: var(--muted); }
.hn {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-width: 0;
  padding-top: 12px; border-top: 1px solid rgba(var(--k-rgb), .18); font-size: 13px; color: var(--text2);
}
.hn + .hn { border-top: 0; padding-top: 0; margin-top: -4px; }
.hn i { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--k-bar); }
.hn .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hn b { color: var(--text); font-variant-numeric: tabular-nums; }
.row.live .cc, .row.next .cc { border-color: rgba(var(--k-rgb), .35); }
.row.live .cc .ln, .row.next .cc .ln { color: var(--k-fg); }
/* --- форма контроля в сессии: тихий чип в шапке карточки вместо отдельной строки --- */
.meta .mrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; align-self: stretch; min-width: 0; }
.meta .mrow > :first-child:not(.ctlchip) { min-width: 0; }
.meta .mrow .ctlchip { margin-left: auto; }
.ctlchip {
  flex: none; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; line-height: 16px; color: var(--muted); white-space: nowrap;
}
.row.past .ctlchip { opacity: .7; }

/* --- PWA: установленное приложение и плашка «Установить» --- */
@media (display-mode: standalone) {
  :root { --safe-top: env(safe-area-inset-top, 0px); --top-gap: 16px; }
  .topveil { display: block; position: fixed; left: 0; right: 0; top: 0; height: calc(var(--safe-top) + var(--top-gap)); z-index: 9; background: var(--bg); }
}
.item .sub.wrap { white-space: normal; line-height: 1.4; }
.ibar {
  position: fixed; z-index: 11; left: 12px; right: 12px; max-width: 496px; margin: 0 auto;
  bottom: calc(max(10px, env(safe-area-inset-bottom), var(--safe-bottom, 0px)) + 78px);
  display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 22px;

  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);

  animation: rise .55s var(--ease-spring) both;
}

.ibar .tile { width: 36px; height: 36px; border-radius: 11px; }
body.has-ibar #app, body.has-ibar .snap { padding-bottom: calc(170px + max(env(safe-area-inset-bottom), var(--safe-bottom, 0px))); }   /* плашка не закрывает последнюю пару */
/* устаревшие данные и подсветка пары из уведомления */
.offline.stale { background: var(--warn-bg); color: var(--warn-fg); }
.foot.old { color: var(--warn-fg); }
.ibar .ib { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
.ibar .ib small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.ibtn { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; }
.ix { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
@supports (corner-shape: squircle) { .ibar { corner-shape: squircle; border-radius: 30px; } .ibtn, .ibar .tile { corner-shape: squircle; border-radius: 16px; } }

/* --- переход по нажатию на день: сдвигается только содержимое, рамки страницы не трогаем --- */
.page.cur.from-r > * { animation: dayInR .28s cubic-bezier(.2, .8, .2, 1) both; }
.page.cur.from-l > * { animation: dayInL .28s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes dayInR { from { opacity: 0; transform: translate3d(24px, 0, 0); } }
@keyframes dayInL { from { opacity: 0; transform: translate3d(-24px, 0, 0); } }

button.offline { border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; }
button.offline u { text-underline-offset: 2px; flex: none; margin-left: auto; }
button.offline span { min-width: 0; text-wrap: balance; }

/* --- экран установки --- */
.iwrap { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease both; }
.isheet {
  position: relative; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; margin: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
  padding: 26px 20px 20px; border-radius: 30px; background: var(--surface); border: 1px solid var(--border);
  text-align: center; animation: sheetUp .46s cubic-bezier(.32, .72, 0, 1) both;   /* выезжает снизу, как листы в iOS */
}
@keyframes sheetUp { from { transform: translateY(105%); } }
.iclose { position: absolute; top: 10px; right: 10px; }
.iprev { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
.isheet h3 { margin: 14px 0 4px; font-size: 20px; font-weight: 700; }
.isub { margin: 0 0 14px; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
.ipick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.ipick button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 16px;
  border: 1.5px solid transparent; background: var(--bg); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.ipick button img { width: 44px; height: 44px; border-radius: 11px; }
.ipick button.on { border-color: var(--accent); color: var(--text); background: rgba(var(--acc-rgb), .1); }

.ihint { margin: 12px 2px 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); text-align: left; }
.ibig { width: 100%; height: 50px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; margin-top: 4px; }
.ibig.ghost { background: var(--bg); color: var(--accent); margin-top: 12px; }
.iarrow { position: fixed; left: 50%; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); margin-left: -16px; width: 32px; z-index: 31;
  font-size: 30px; font-weight: 800; color: var(--accent); text-align: center; animation: ibounce 1s ease-in-out infinite; pointer-events: none; }
@keyframes ibounce { 50% { transform: translateY(8px); } }
@keyframes fadeIn { from { opacity: 0; } }
@supports (corner-shape: squircle) { .isheet { corner-shape: squircle; border-radius: 40px; } .iprev { corner-shape: squircle; border-radius: 26px; } }

/* --- видео-инструкция --- */

.ibig svg { vertical-align: -3px; margin-right: 4px; }

/* --- видео внутри блока установки --- */
.ivid { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 14px 14px; }
.isheet .ivid { padding: 16px 0 0; }
.ivseg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; max-width: 240px; padding: 4px; border-radius: 14px; background: var(--surface2); }
.ivseg button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.ivseg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.ivid video { display: block; width: 62%; max-width: 230px; height: auto; aspect-ratio: 9 / 16; border-radius: 20px; background: #000; object-fit: cover; }

.ynote { width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; text-align: left;
  background: rgba(var(--acc-rgb), .1); border: 1px solid rgba(var(--acc-rgb), .25); font-size: 13.5px; line-height: 1.4; color: var(--text2); }
.ynote b { font-size: 15px; color: var(--text); }
.ynote .ibig { display: grid; place-items: center; height: 46px; margin-top: 8px; text-decoration: none; }
.ynote .ibig.ghost { margin-top: 4px; }
.ynote .yopt { margin-top: 8px; color: var(--text); font-weight: 600; }
.ynote small { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.ysteps { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ymore { margin-top: 8px; }
.ymore summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; text-align: center; padding: 6px 0; }
.ymore summary::-webkit-details-marker { display: none; }

/* --- мастер установки в Настройках --- */
.iwiz { padding: 14px 14px 10px; }
.iwiz .list { background: transparent !important; border: 0 !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
.iwiz .lbl15 { display: none; }
.iwiz .icnote { margin-top: 8px; }
.iwiz .item { padding: 6px 0; min-height: 0; }
.wst { display: flex; align-items: center; gap: 10px; margin: 4px 2px 10px; font-size: 15px; font-weight: 700; color: var(--text); }
.wst + .list .item { padding-top: 0; }
.iwiz > .wst:not(:first-child) { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--sep); }
.wn { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; }
.iwiz .ivid { padding: 8px 0 4px; }
.wdone { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 44px; margin-top: 6px; border: 0; border-radius: 14px; background: var(--surface2); color: var(--text2); font-size: 14px; font-weight: 600; }
.idone { display: flex; gap: 12px; align-items: flex-start; padding: 14px; }
.idone .body { display: flex; flex-direction: column; gap: 3px; }
.idone .nm { font-size: 15px; font-weight: 700; }
.idone .sub { font-size: 13px; color: var(--muted); line-height: 1.4; }
.t-ok { background: rgba(var(--lec-rgb), .16); color: var(--lec-fg); }
.wlink { align-self: flex-start; margin-top: 6px; padding: 4px 0; border: 0; background: none; color: var(--accent); font-size: 13.5px; font-weight: 600; }
.ivlbl { align-self: flex-start; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
/* видео: рамка, кнопка ▶ (экономия трафика / запрещён автозапуск), шаги в такт */
.vframe { position: relative; width: 62%; max-width: 230px; }
.vframe video { width: 100% !important; max-width: none !important; }
.vplay { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; display: none; place-items: center; }
.vplay svg { width: 26px; height: 26px; }
.vframe.tap .vplay { display: grid; }
.vsteps { list-style: none; width: 100%; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.vsteps li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; font-size: 13.5px; line-height: 1.35; color: var(--muted); cursor: pointer; transition: background .25s, color .25s; }
.vsteps li b { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface2); color: var(--muted); transition: background .25s, color .25s; }
.vsteps li.on { background: rgba(var(--acc-rgb), .1); color: var(--text); font-weight: 600; }
.sfx { width: 100%; display: flex; flex-direction: column; gap: 2px; margin-top: 6px; padding: 12px 14px; border-radius: 16px; background: var(--surface2); text-align: left; font-size: 13px; line-height: 1.4; color: var(--text2); }
.sfx .ibig { display: grid; place-items: center; height: 42px; margin-top: 8px; text-decoration: none; font-size: 15px; background: var(--bg); }
.vsteps li.on b { background: var(--accent); color: var(--on-accent); }

.foot .ver { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }

/* --- таблетка выбранного дня: отдельный слой, едет плавно (видеокарта) --- */

.days .day { position: relative; z-index: 1; }
.days .pill { position: absolute; z-index: 0; left: 0; top: 4px; bottom: 4px; width: 0; border-radius: 18px; pointer-events: none;
  background: var(--accent);  opacity: 0; will-change: transform, width; }
.days .pill.ready { opacity: 1; }
/* листание: на время движения каждый день — свой слой видеокарты (текст едет вместе с рамками, без дрожи) */
.pager.paging > .page { will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.days:has(.pill.ready) .day.on { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }
.day { transition: color .18s ease, opacity .18s ease; }
@supports (corner-shape: squircle) { .days .pill { corner-shape: squircle; border-radius: 26px; } }
.sbar .days .day { transition: min-height .45s var(--ease-spring), color .18s ease, opacity .18s ease; }
/* слой «выбранных» цифр: копия строки дней поверх, видна только внутри таблетки (clip-path двигаем вместе с ней) */
.days:has(.days-on) .day.on { color: var(--text) !important; }
.days:has(.days-on) .day.on .dots i { background: var(--k-bar) !important; }
.days:has(.days-on) .day.on .s { opacity: .65; }
.days-on { position: absolute; z-index: 2; left: 0; top: 4px; bottom: 4px; width: 0; overflow: hidden; border-radius: 18px; pointer-events: none; will-change: transform; }
.days-on-in { position: absolute; left: 0; top: -4px; bottom: -4px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 100%; align-items: stretch;
  color: var(--on-accent); will-change: transform; }
@supports (corner-shape: squircle) { .days-on { corner-shape: squircle; border-radius: 26px; } }
.days-on .day-o { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 0; font: inherit; }
.days-on .s { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; opacity: .9; }
.days-on .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.days-on .dots { display: flex; gap: 3px; height: 5px; }
.days-on .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--on-accent); }

/* --- выбор иконки --- */
.icpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.icpick button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 18px;
  border: 1.5px solid transparent; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600; }
.icpick button img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.icpick button.on { border-color: var(--accent); color: var(--text); background: rgba(var(--acc-rgb), .1); }
.icnote { margin: 10px 2px 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
@supports (corner-shape: squircle) { .icpick button { corner-shape: squircle; border-radius: 24px; } .icpick button img { corner-shape: squircle; border-radius: 18px; } }

/* ================= Пружины и сквиркл ================= */

/* --- пружинные кривые: рассчитаны из затухающей пружины (перелёт ~4% и ~16%) --- */
:root { --ease-spring: cubic-bezier(.22, 1, .36, 1); --ease-bounce: cubic-bezier(.34, 1.56, .64, 1); }
@supports (animation-timing-function: linear(0, 1)) {
  :root { --ease-spring: linear(0, 0.01924, 0.06951, 0.141, 0.2256, 0.3169, 0.4097, 0.5004, 0.5861, 0.6649, 0.7358, 0.7981, 0.8519, 0.8972, 0.9347, 0.9649, 0.9887, 1.007, 1.02, 1.029, 1.035, 1.038, 1.038, 1.038, 1.036, 1.033, 1.03, 1.026, 1.022, 1.019, 1.016, 1.013, 1.01, 1.008, 1.006, 1.004, 1.002, 1.001, 1, 0.9997, 1); --ease-bounce: linear(0, 0.0265, 0.09696, 0.1984, 0.3191, 0.4487, 0.5787, 0.7025, 0.815, 0.913, 0.9945, 1.059, 1.106, 1.139, 1.157, 1.163, 1.16, 1.149, 1.133, 1.113, 1.092, 1.071, 1.051, 1.032, 1.016, 1.002, 0.9915, 0.9834, 0.9779, 0.9747, 0.9735, 0.9738, 0.9755, 0.978, 0.9811, 0.9845, 0.988, 0.9914, 0.9944, 0.9971, 1); }
}

@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.ring .arc, .fill, .mark, .nowlbl, .bmark, .bnow { transition-timing-function: var(--ease-spring); }
.sbar .eyebrow, .sbar h1.wr, .sbar .wbtn, .sbar .icon-btn, .sbar .day, .sbar .whead .top-actions { transition-timing-function: var(--ease-spring); transition-duration: .45s; }

/* нажатие: элемент чуть проседает и пружинит обратно */
.day, .btn, .wbtn, .tab, .cc, .item, .sw, .seg3 button, .tlink {
  transition-property: background-color, border-color, color, opacity, box-shadow, transform, width, height, font-size;
  transition-duration: .2s, .2s, .2s, .2s, .2s, .5s, .45s, .45s, .45s;
  transition-timing-function: ease, ease, ease, ease, ease, var(--ease-spring), var(--ease-spring), var(--ease-spring), var(--ease-spring);
}
.day:active, .btn:active, .wbtn:active:not(:disabled), .tab:active, .seg3 button:active { transform: scale(.92); transition-duration: .2s, .2s, .2s, .2s, .2s, .08s; }
.cc:active, .item:active { transform: scale(.98); transition-duration: .2s, .2s, .2s, .2s, .2s, .08s; }
.sw .kn { transition: transform .5s var(--ease-bounce); }

/* --- сквиркл: плавные углы как у иконок iOS; радиусы крупнее, потому что сквиркл «съедает» скругление --- */
@supports (corner-shape: squircle) {
  .card, .cc, .hero, .days, .day, .tabs, .tab, .list, .tcard, .search, .kind, .seg3, .seg3 button, .nsel,
  .btn:not(.icon-btn), .empty .ic, .offline, .tag { corner-shape: squircle; }
  .card { border-radius: 30px; }
  .cc { border-radius: 26px; }
  .hero { border-radius: 36px; }
  .days { border-radius: 30px; }
  .day { border-radius: 26px; }

  .list, .tcard { border-radius: 32px; }
  .search { border-radius: 22px; }
  .kind { border-radius: 11px; }
  .seg3 { border-radius: 22px; }
  .seg3 button { border-radius: 17px; }
  .btn:not(.icon-btn), .nsel { border-radius: 18px; }
  .empty .ic { border-radius: 28px; }
  .tag, .offline { border-radius: 14px; }
  .ctlchip { corner-shape: squircle; border-radius: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ================= «Жидкое стекло» (как в iOS 26) =================
   Плавающие элементы — нижняя панель, кнопки шапки, полоса дней, плашки — из «стекла»:
   просвечивают и размывают то, что под ними, сверху блик, по краю — светлая кромка. */
.tabs {
  left: 20px; right: 20px; max-width: 440px; padding: 5px; border-radius: 34px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .02) 58%), rgba(20, 22, 28, .42);
  -webkit-backdrop-filter: blur(26px) saturate(200%) brightness(1.06); backdrop-filter: blur(26px) saturate(200%) brightness(1.06);
  border: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), inset 0 -1px 0 rgba(255, 255, 255, .05), 0 18px 40px rgba(0, 0, 0, .5);
}
html[data-theme="light"] .tabs {
  background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .38) 60%), rgba(244, 246, 250, .4);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 16px 36px rgba(20, 30, 60, .16), 0 2px 6px rgba(20, 30, 60, .06);
}
/* светлая кромка стекла: ярче сверху-слева и снизу-справа, как блик на линзе */
.tabs::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(155deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .08) 35%, rgba(255, 255, 255, .03) 65%, rgba(255, 255, 255, .28));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
html[data-theme="light"] .tabs::before {
  background: linear-gradient(155deg, #FFFFFF, rgba(255, 255, 255, .6) 40%, rgba(255, 255, 255, .5) 70%, #FFFFFF);
}
/* выбранная вкладка — «линза» из стекла внутри панели */
.tab { min-height: 54px; border-radius: 28px; }
.tab.on { background: rgba(255, 255, 255, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 0 1px rgba(255, 255, 255, .06); }
html[data-theme="light"] .tab.on { background: rgba(255, 255, 255, .85); box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 8px rgba(20, 30, 60, .12); }
/* круглые кнопки шапки — стеклянные */
.whead .wbtn, .whead .icon-btn.bell, .btn.icon-btn[data-act="back"] {
  position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)), rgba(255, 255, 255, .04);
  border: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 4px 14px rgba(0, 0, 0, .35);
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
}
html[data-theme="light"] .whead .wbtn, html[data-theme="light"] .whead .icon-btn.bell, html[data-theme="light"] .btn.icon-btn[data-act="back"] {
  background: linear-gradient(180deg, #FFFFFF, rgba(255, 255, 255, .7)); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(20, 30, 60, .06), 0 4px 12px rgba(20, 30, 60, .1);
}
/* полоса дней — стеклянная капсула; выбранный день — капля с бликом */
.days { position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02)), var(--surface); border-color: transparent;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .35); }
.sbar.stuck .days { background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)), var(--surface); }
html[data-theme="light"] .days, html[data-theme="light"] .sbar.stuck .days {
  background: linear-gradient(180deg, #FFFFFF, rgba(255, 255, 255, .85)), var(--surface);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(20, 30, 60, .05), 0 8px 22px rgba(20, 30, 60, .08);
}
.days .pill { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -2px 6px rgba(0, 0, 0, .12), 0 6px 18px rgba(var(--acc-rgb), .45); }
.days .pill::after { content: ""; position: absolute; left: 18%; right: 18%; top: 3px; height: 38%; border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .38), rgba(255, 255, 255, 0)); }
/* плашка «Установить» — тем же стеклом */
.ibar { background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .02) 58%), rgba(20, 22, 28, .5); border: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), 0 16px 36px rgba(0, 0, 0, .45); }
html[data-theme="light"] .ibar { background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .5)), rgba(244, 246, 250, .5); box-shadow: inset 0 1px 0 #FFFFFF, 0 14px 32px rgba(20, 30, 60, .14); }
@supports (corner-shape: squircle) { .tabs { border-radius: 42px; } .tab { border-radius: 34px; } }
/* телефон без размытия — стекло делаем плотнее, чтобы подписи читались */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tabs, .ibar { background: var(--glass); }
}

/* ---- экран «Уведомления»: карточки изменений как уведомления iPhone ---- */
.nsum { margin: 6px 2px 0; font-size: 13.5px; color: var(--muted); }
.nsum b { color: var(--accent); font-weight: 700; }
.nlist { display: flex; flex-direction: column; gap: 10px; }
.nsec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.nclear { margin: 0 4px 0 0; padding: 6px 2px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; }
.ncw { position: relative; border-radius: 22px; }
.ncw > .nc { position: relative; z-index: 1; touch-action: pan-y; }
.ncw.ncsw > .nc { will-change: transform; }
.nc-del { position: absolute; z-index: 0; top: 0; bottom: 0; right: 0; width: 84px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 0; border-radius: 22px;
  background: #E5484D; color: #fff; font: inherit; font-size: 12px; font-weight: 700; transform: translate3d(92px, 0, 0); visibility: hidden; }
.ncw.ncsw > .nc-del { visibility: visible; }
.nc-del svg { flex: none; width: 22px; height: 22px; }
.nc-del > * { opacity: var(--o, 1); transition: opacity .2s; }
.nc-del span { white-space: nowrap; }
.ncw.gone { pointer-events: none; }

.nc { --tone: var(--warn-fg); --tone-bg: var(--warn-bg);
  display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 14px 16px 15px; text-align: left; color: var(--text);
  border-radius: 22px; border: 1px solid var(--hair); background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0)), var(--surface);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); position: relative; overflow: hidden; }
html[data-theme="light"] .nc { background: var(--surface); box-shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 6px 18px rgba(20, 30, 60, .05); }
.nc-red { --tone: var(--red-fg); --tone-bg: var(--red-bg); }
.nc-green { --tone: var(--tag-fg); --tone-bg: var(--tag-bg); }
.nc-blue { --tone: var(--accent); --tone-bg: var(--acc-soft); }
.nc.unread { border-color: color-mix(in srgb, var(--tone) 35%, transparent);
  background: linear-gradient(135deg, color-mix(in srgb, var(--tone) 12%, transparent), transparent 55%), var(--surface); }
.nc-top { display: flex; align-items: center; gap: 10px; }
.nc-ic { width: 30px; height: 30px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--tone-bg); color: var(--tone); }
.nc-ic svg { width: 18px; height: 18px; }
.nc-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--tone); }
.nc-ts { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 22%, transparent); }
.nc-when { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nc-go { color: var(--faint); display: inline-flex; }
.nc-subj { font-size: 14.5px; line-height: 1.35; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nc-subj s { text-decoration-color: color-mix(in srgb, var(--tone) 70%, transparent); text-decoration-thickness: 1.5px; }
.nc-type { color: var(--muted); }
.nc-type::before { content: " · "; }
.nc-diff { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
.nc-chip { max-width: 100%; padding: 4px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-chip.old { background: var(--surface2); color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent); }
.nc-chip.new { background: var(--tone-bg); color: var(--tone); font-weight: 700; }
.nc-chip.bad { background: var(--red-bg); color: var(--red-fg); }
.nc-chip.good { background: var(--tag-bg); color: var(--tag-fg); }
.nc-chip.plain { background: var(--surface2); color: var(--text2); }
.nc-arr { display: inline-flex; color: var(--muted); }
.nc-arr svg { width: 16px; height: 16px; }
.nc-was { font-size: 12.5px; color: var(--muted); }
.nc:active { transform: scale(.98); transition: transform .08s; }
@supports (corner-shape: squircle) { .nc { corner-shape: squircle; border-radius: 30px; } .nc-ic { corner-shape: squircle; border-radius: 13px; } }

/* значки у переключателей уведомлений */
.sicrow { padding-left: 12px; }
.sic { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.sic svg { width: 18px; height: 18px; }
.sic-blue { background: linear-gradient(180deg, #4C9BFF, #1F6FEB); }
.sic-orange { background: linear-gradient(180deg, #FFB547, #F08A1C); }
.sic-purple { background: linear-gradient(180deg, #A78BFA, #7C4DFF); }
.sic-red { background: linear-gradient(180deg, #FF7A6E, #E5484D); }
.sicrow + .selrow { padding-left: 56px; }
@supports (corner-shape: squircle) { .sic { corner-shape: squircle; border-radius: 12px; } }

/* лента: напоминания и сводки */
.nc-purple { --tone: var(--lab-fg); --tone-bg: rgba(var(--lab-rgb), .16); }
.nc-orange { --tone: var(--prac-fg); --tone-bg: rgba(var(--prac-rgb), .16); }
.nc-list { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; }
.nc-list > span { display: flex; gap: 10px; min-width: 0; font-size: 13.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-list em { min-width: 0; font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.nc-list b { flex: none; width: 42px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.nc-list .more { color: var(--muted); padding-left: 52px; }

/* экран «Статистика» */
.st-upd { margin-top: 4px; font-size: 13px; color: var(--muted); }
.st-hero { margin-top: 14px; padding: 16px 16px 14px; border-radius: 24px; background: var(--surface); border: 1px solid var(--hair);
  display: grid; grid-template-columns: auto 1fr; align-items: end; column-gap: 14px; }
.st-hero .lbl { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
.st-hero .big { font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.st-hero .side { padding-bottom: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; color: var(--text2); }
.st-hero .side b { color: var(--text); font-variant-numeric: tabular-nums; }
.st-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.st-two > div { padding: 13px 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--hair); min-width: 0; }
.st-two .n { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.st-two .t { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.st-trend { display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700;
  background: var(--surface2); color: var(--text2); font-variant-numeric: tabular-nums; }
.st-trend.up { background: var(--tag-bg); color: var(--tag-fg); }
.st-trend.down { background: var(--red-bg); color: var(--red-fg); }
.st-trend svg { width: 12px; height: 12px; }
.st-range { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 18px 0 2px; border-radius: 14px; background: var(--surface); border: 1px solid var(--hair); }
.st-range button { height: 36px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; }
.st-range button.on { background: var(--surface2); border-color: var(--border); color: var(--text); }
.schart { padding: 14px 16px 12px; }
.scap { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-height: 40px; }
.scap .d { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.scap .v { font-size: 13.5px; color: var(--text2); white-space: nowrap; }
.scap .v b { font-size: 24px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.schart svg { display: block; width: 100%; height: 132px; overflow: visible; touch-action: pan-y; margin-top: 6px; }
.schart .sbar { fill: color-mix(in srgb, var(--accent) 38%, transparent); transition: fill .15s; }
.schart .sbar.on { fill: var(--accent); }
.schart .shit { fill: transparent; cursor: pointer; }
.schart .sbase { stroke: var(--sep); stroke-width: 1; }
.schart .savg { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .8; }
.schart .sval { fill: var(--text2); font-size: 11px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
.saxis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.saxis.wd span { flex: 1; text-align: center; font-weight: 600; }
.saxis.wd span.on { color: var(--text); }
.savgl { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.savgl i { width: 16px; border-top: 1.5px dashed var(--muted); }
.sstack { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface2); }
.sstack i { display: block; height: 100%; min-width: 4px; }
.sleg { display: flex; flex-direction: column; margin-top: 4px; }
.sleg > div { display: grid; grid-template-columns: 10px 1fr auto 44px; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); font-size: 14.5px; }
.sleg > div:first-child { border-top: 0; }
.sleg .dot { width: 10px; height: 10px; border-radius: 3px; }
.sleg .nm { font-weight: 600; min-width: 0; }
.sleg b { font-variant-numeric: tabular-nums; }
.sleg .pc { text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.c1 { background: #2a78d6; } .c2 { background: #eb6834; } .c3 { background: #1baf7a; }
html[data-theme="dark"] .c1 { background: #3987e5; } html[data-theme="dark"] .c2 { background: #d95926; } html[data-theme="dark"] .c3 { background: #199e70; }
.skv > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; font-size: 14.5px; border-top: 1px solid var(--sep); }
.skv > div:first-child { border-top: 0; }
.skv span { color: var(--text2); min-width: 0; }
.skv b { font-variant-numeric: tabular-nums; text-align: right; }
.skv small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -2px; }
.skv .pbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.skv .pbar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sgrid > div { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--hair); min-width: 0; }
.sgrid .tx { display: flex; flex-direction: column; min-width: 0; }
.sgrid b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--text); }
.sgrid .sic { background: var(--surface2); color: var(--text2); }
.sgrid .tx > span { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snote { margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
.sic-gray { background: linear-gradient(180deg, #A3AAB6, #737B89); }
.sic-tg { background: linear-gradient(180deg, #37BBFE, #229ED9); }
.sic-green { background: linear-gradient(180deg, #4ADE80, #16A34A); }
.dg-hero { padding: 14px 16px 12px; border-radius: 22px; border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--elev); }
.dg-head .sic, .dg-chips .sic, .dg-row .sic { background: var(--surface2); color: var(--text2); }
.dg-head .sic-red, .dg-chips .on .sic-red, .dg-row .sic-red { color: var(--red-fg); }
.dg-head .sic-green { color: var(--tag-fg); }
.dg-chips .on.err b { color: var(--red-fg); }
.dg-head { display: flex; align-items: center; gap: 12px; }
.dg-head .sic { width: 40px; height: 40px; border-radius: 13px; }
.dg-head .sic svg { width: 22px; height: 22px; }
.dg-ht { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dg-ht b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.dg-ht span { font-size: 13px; color: var(--text2); }
.dg-spark { display: block; width: 100%; height: 40px; margin-top: 14px; }
.dg-spark .de { fill: var(--red-fg); } .dg-spark .dj { fill: var(--faint); } .dg-spark .dz { fill: var(--sep); }
.dg-axis { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.dg-leg { display: inline-flex; align-items: center; gap: 5px; }
.dg-leg i { width: 8px; height: 8px; border-radius: 2px; margin-left: 4px; } .dg-leg i.de { background: var(--red-fg); } .dg-leg i.dj { background: var(--faint); }
.dg-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.dg-chips > div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 9px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--hair); min-width: 0; }
.dg-chips > div:not(.on) { opacity: .55; }
.dg-chips .sic { width: 26px; height: 26px; border-radius: 9px; } .dg-chips .sic svg { width: 15px; height: 15px; }
.dg-chips b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.dg-chips span:last-child { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.15; }
.dg-list { margin-top: 8px; }
.dg-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--sep); }
.dg-row:first-child { border-top: 0; }
.dg-row > .sic { margin-top: 2px; }
.dg-body { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dg-k { font-size: 12px; font-weight: 700; color: var(--muted); }
.dg-m { font-size: 14.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.dg-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.dg-pills i { font-style: normal; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 7px; background: var(--surface2); color: var(--text2); }
.dg-cnt { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 1px; }
.dg-cnt b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dg-cnt span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.schips { display: flex; flex-wrap: wrap; gap: 6px; }
.schips span { padding: 6px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--hair); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.schips span b { color: var(--muted); font-weight: 600; margin-left: 4px; }
</style>
